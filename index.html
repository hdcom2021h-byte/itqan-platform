  /* =========================================================
     الإقرار والتوقيع والاعتماد الإلكتروني (النسخة السحابية)
     كل انتقال في الحالة يتم عبر دوال الخادم؛ الواجهة تعرض وتطلب فقط.
     ========================================================= */
  const ES = { missing: false, versions: [], mySig: undefined, sigs: {} };
  const ES_LABEL = {
    draft: ['مسودة', 'p-mute'], ready: ['جاهز للإرسال', 'p-info'], awaiting_ack: ['بانتظار إقرار الموظف', 'p-warn'],
    ack_agree: ['أقر الموظف بالموافقة — بانتظار اعتماد المدير', 'p-info'], ack_note: ['أقر الموظف مع ملاحظة — بانتظار اعتماد المدير', 'p-warn'],
    returned: ['معاد للمراجعة', 'p-bad'], approved: ['معتمد نهائياً', 'p-ok'], legacy: ['معتمد', 'p-ok'],
  };
  const esOn = () => CLOUD && !ES.missing;
  async function esLoad(withSnapshot) {
    const v = await C.loadVersions(withSnapshot).catch(() => null);
    if (v === null) { ES.missing = true; ES.versions = []; return; }
    ES.missing = false; ES.versions = v;
  }
  const versionsOf = (empId) => ES.versions.filter((v) => v.employee_id === empId).sort((a, b) => b.version_no - a.version_no);
  const latestVersion = (empId) => versionsOf(empId)[0] || null;
  const activeVersion = (empId) => versionsOf(empId).find((v) => v.state !== 'superseded') || null;
  function esState(empId) {
    const f = fileOf(empId); if (!f) return { key: 'draft' };
    const v = activeVersion(empId), last = latestVersion(empId);
    if (f.status === 'approved') return v && v.state === 'approved' ? { key: 'approved', v } : { key: 'legacy' };
    if (v && ['awaiting_ack', 'ack_agree', 'ack_note', 'returned'].includes(v.state)) return { key: v.state, v };
    const res = L.fileResult(f);
    return { key: res.complete ? 'ready' : 'draft', changed: !!(last && last.state === 'superseded' && (!v || v.version_no < last.version_no)) };
  }
  const esPill = (k) => pill(ES_LABEL[k][0], ES_LABEL[k][1]);
  async function ensureSigs(ids) {
    const need = ids.filter((id) => id && !(id in ES.sigs));
    if (!need.length) return;
    try { const got = await C.signaturesByIds(need); need.forEach((id) => { ES.sigs[id] = got[id] || null; }); } catch (e) { /* */ }
  }
  async function ensureMySig() {
    const uid = await C.uid();
    if (ES.mySig !== undefined && ES.mySigUid === uid) return ES.mySig;
    try { const s = await C.mySignature(); ES.mySig = s && !s._missing && s.id ? s : null; } catch (e) { ES.mySig = null; }
    ES.mySigUid = uid;
    return ES.mySig;
  }
  /* بيانات التوقيعات للتقرير: توقيع الموظف بعد إقراره، وتوقيع المدير/ة بعد الاعتماد النهائي فقط */
  function esignForReport(empId, file) {
    if (!esOn()) return null;
    const st = esState(empId); const v = st.v;
    if (!v) return null;
    const out = {};
    if (['ack_agree', 'ack_note', 'approved'].includes(v.state) && v.ack_signature_id) out.emp = { img: ES.sigs[v.ack_signature_id] || null, at: v.ack_at, choice: v.ack_choice };
    if (v.state === 'approved' && file.status === 'approved' && v.approve_signature_id) out.prin = { img: ES.sigs[v.approve_signature_id] || null, at: v.approved_at };
    return out;
  }
  async function esRefresh(empId) {
    await esLoad(EMP_MODE());
    if (empId && !EMP_MODE()) { try { const fr = await C.fileRow(empId); DB.files[empId] = { ...DB.files[empId], ...fr }; } catch (e) { /* */ } }
  }

  /* ---------- بطاقة المديرة داخل ملف التقييم ---------- */
  function esignCard(e, f, res) {
    const st = esState(e.id); const v = st.v;
    const bl = (res.blockers || []).filter(Boolean);
    let body = '';
    const sent = v ? `<div class="small muted">النسخة ${v.version_no} · أُرسلت ${dateAr(v.sent_at)}</div>` : '';
    if (st.key === 'draft') body = `${bl.length ? `<div class="small muted"><b>متطلبات الإرسال:</b><ul class="req">${bl.map((b) => `<li>${esc(b)}</li>`).join('')}</ul></div>` : ''}<div class="row"><button class="btn primary" type="button" disabled>${ic('send', 'sm')} إرسال للموظف للاطلاع</button></div>`;
    else if (st.key === 'ready') body = `${st.changed ? `<div class="small" style="color:var(--warn)">عُدّل التقييم بعد إرسال نسخة سابقة؛ أرسلي النسخة الجديدة للإقرار.</div>` : ''}${!e.linked ? '<div class="small muted">حساب الموظف غير مفعّل بعد؛ يظهر له التقييم عند تفعيله.</div>' : ''}
      <div class="row"><button class="btn primary" type="button" data-act="es-send" data-id="${e.id}">${ic('send', 'sm')} إرسال للموظف للاطلاع</button></div>`;
    else if (st.key === 'awaiting_ack') body = `${sent}<div class="row"><button class="btn" type="button" data-act="es-return" data-v="${v.id}">${ic('unlock', 'sm')} إعادة للمراجعة</button></div>`;
    else if (st.key === 'ack_agree' || st.key === 'ack_note') body = `${sent}${ackBox(v)}
      <div class="row"><button class="btn primary" type="button" data-act="es-approve" data-v="${v.id}">${ic('award', 'sm')} اعتماد التقييم النهائي</button><button class="btn" type="button" data-act="es-return" data-v="${v.id}">${ic('unlock', 'sm')} إعادة للمراجعة</button></div>`;
    else if (st.key === 'returned') body = `${sent}${v.return_reason ? `<div class="small">سبب الإعادة: ${esc(v.return_reason)}</div>` : ''}
      <div class="row"><button class="btn primary" type="button" data-act="es-send" data-id="${e.id}" ${res.complete ? '' : 'disabled'}>${ic('send', 'sm')} إرسال النسخة المحدّثة</button></div>`;
    else if (st.key === 'approved') body = `${sent}${ackBox(v)}<div class="small">اعتُمد نهائياً ${dateAr(v.approved_at)}</div>${sigThumbs(v)}
      <div class="row"><button class="btn" type="button" data-act="unapprove" data-id="${e.id}">${ic('unlock', 'sm')} إعادة فتح للتعديل</button></div>`;
    else body = `<div class="small muted">اعتُمد هذا الملف قبل تفعيل الإقرار الإلكتروني${f.approvedAt ? ' بتاريخ ' + dateAr(f.approvedAt) : ''}.</div><div class="row"><button class="btn" type="button" data-act="unapprove" data-id="${e.id}">${ic('unlock', 'sm')} إعادة فتح للتعديل</button></div>`;
    return `<div class="card es-card"><div class="card-h"><h2>الإقرار والاعتماد الإلكتروني</h2>${esPill(st.key)}</div><div class="card-b stack">${body}
      <details data-es-log="${e.id}"><summary class="small muted">سجل الإجراءات</summary><div class="es-log small muted">—</div></details></div></div>`;
  }
  function ackBox(v) {
    if (!v || !v.ack_at) return '';
    return `<div class="es-ack"><b>${v.ack_choice === 'agree' ? 'اطلع الموظف على التقييم ويوافق على محتواه' : 'اطلع الموظف على التقييم ولديه ملاحظة'}</b>
      ${v.ack_note ? `<blockquote>${esc(v.ack_note)}</blockquote>` : ''}<span class="small muted">${dateAr(v.ack_at)} ${timeAr(v.ack_at)}</span>
      ${v.ack_signature_id && ES.sigs[v.ack_signature_id] ? `<img class="sig-img" src="${ES.sigs[v.ack_signature_id]}" alt="توقيع الموظف">` : ''}</div>`;
  }
  function sigThumbs(v) {
    const a = v.ack_signature_id && ES.sigs[v.ack_signature_id], b = v.approve_signature_id && ES.sigs[v.approve_signature_id];
    if (!a && !b) return '';
    return `<div class="row">${a ? `<figure class="sig-fig"><img class="sig-img" src="${a}" alt=""><figcaption>توقيع الموظف</figcaption></figure>` : ''}${b ? `<figure class="sig-fig"><img class="sig-img" src="${b}" alt=""><figcaption>توقيع المدير/ة</figcaption></figure>` : ''}</div>`;
  }
  const timeAr = (iso) => { try { return new Date(iso).toLocaleTimeString('ar-SA-u-nu-latn', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
  const ES_ACT = { sent: 'أُرسل للموظف للاطلاع', acknowledged: 'أقر الموظف', returned: 'أُعيد للمراجعة', approved: 'اعتُمد نهائياً', changed_after_send: 'عُدّل بعد الإرسال (أُلغيت النسخة المرسلة)', signature_saved: 'حُفظ توقيع' };
  async function esFillLog(empId, el) {
    try {
      const evs = await C.loadEvents(empId);
      el.innerHTML = evs.length ? `<ul>${evs.map((x) => `<li>${dateAr(x.at)} ${timeAr(x.at)} — ${ES_ACT[x.action] || esc(x.action)}${x.details && x.details.version_no ? ` (النسخة ${x.details.version_no})` : ''}${x.action === 'acknowledged' ? (x.details.choice === 'agree' ? ': موافق' : ': مع ملاحظة') : ''}</li>`).join('')}</ul>` : 'لا توجد إجراءات بعد.';
    } catch (e) { el.textContent = 'تعذّر تحميل السجل.'; }

  function initPad(cv) {
    const g = cv.getContext('2d'); g.lineWidth = 2.6; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#1F1630';
    let drawing = false, last = null;
    const pos = (ev) => { const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left) * (cv.width / r.width), y: (ev.clientY - r.top) * (cv.height / r.height) }; };
    cv.addEventListener('pointerdown', (ev) => { drawing = true; last = pos(ev); cv.setPointerCapture(ev.pointerId); ev.preventDefault(); });
    cv.addEventListener('pointermove', (ev) => { if (!drawing) return; const p = pos(ev); g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(p.x, p.y); g.stroke(); last = p; cv.dataset.dirty = '1'; cv.dataset.source = 'draw'; ev.preventDefault(); });
    const end = () => { drawing = false; };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  }
  function trimCanvas(cv) {
    const g = cv.getContext('2d'); const { width: w, height: h } = cv; const d = g.getImageData(0, 0, w, h).data;
    let x0 = w, y0 = h, x1 = 0, y1 = 0;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (x1 <= x0 || y1 <= y0) return cv.toDataURL('image/png');
    const m = 8, o = document.createElement('canvas'); o.width = x1 - x0 + m * 2; o.height = y1 - y0 + m * 2;
    o.getContext('2d').drawImage(cv, x0 - m, y0 - m, o.width, o.height, 0, 0, o.width, o.height);
    return o.toDataURL('image/png');
  }
  function sigUploadToPad(file) {

      const k = Math.min(cv.width / img.width, cv.height / img.height, 1);

    const sn = v.snapshot, file = sn.file || {};
    const live = new Map((ES.myPlans || []).map((p) => [p.id, p]));

    const res = L.fileResult(file);
    let items;

      const mk = (g, grp) => ({ id: g.id, name: g.title || '—', group: grp, score: g.calc.score, max: 5, weight: g.weight, measure: g.measure, unit: g.unit, target: g.target, actual: g.actual, justification: g.justification, feedback: g.feedback, plan: g.plan, followUp: g.followUp, planStatus: g.planStatus, followResult: g.followResult });
      items = [...res.goals.rows.map((g) => mk(g, 'الأهداف الذكية')), ...res.comps.rows.map((g) => mk(g, 'الجدارات'))];
    } else items = (file.items || []).map((it) => ({ id: it.id, name: it.name, group: it.section || '', score: L.isScore(it.score) ? Number(it.score) : null, max: 5, weight: it.weight, justification: it.justification, feedback: it.feedback, plan: it.plan, followUp: it.followUp, planStatus: it.planStatus, followResult: it.followResult }));

  async function readXlsx(file) {
    const I = UI.imp;
    I.error = ''; I.rows = null; I.fileName = file.name;
    if (!/\.xlsx$/i.test(file.name)) { I.error = 'الملف ليس بصيغة ‎.xlsx. احفظيه من Excel بصيغة «مصنف Excel (.xlsx)».'; render(); return; }
    try { await needLib('xlsx'); } catch (err) { /* */ }
    if (typeof window.XLSX === 'undefined') { I.error = 'تعذّرت قراءة الملف. تحققي من الاتصال بالإنترنت.'; render(); return; }
    try {
      const buf = await file.arrayBuffer();
      const wb = window.XLSX.read(buf, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const aoa = window.XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false, blankrows: false });
      const m = L.mapSheetRows(aoa);
      if (m.error) { I.error = m.error; render(); return; }
      if (!m.rows.length) { I.error = 'لا توجد صفوف بيانات تحت العناوين.'; render(); return; }
      I.missing = m.missing;
      I.rows = L.buildImportPreview(m.rows, DB.employees, { year: DB.settings.year, school: DB.settings.schoolName });
    } catch (e) { I.error = 'تعذّرت قراءة الملف: ' + (e.message || ''); }
    render();
  }
  async function importSave() {
    const rows = (UI.imp.rows || []).filter((r) => r.status === 'ok');
    // إعادة التحقق لحظة الحفظ ضد البيانات الحالية
    const fresh = L.buildImportPreview(rows.map((r) => ({ name: r.name, role: r.role, jobTitle: r.jobTitle, specialty: r.specialty, year: r.year, school: r.school, nationalId: r.nationalId, line: r.line })), DB.employees, {});
    const good = fresh.filter((r) => r.status === 'ok');
    const n = await commit((db) => {
      good.forEach((r) => {
        const id = L.uid('emp');
        if (r.jobTitle) db.settings.jobTitles = { ...(db.settings.jobTitles || {}), [r.jobTitle]: r.role };
        db.employees.push({ id, name: r.name, role: r.role, jobTitle: r.jobTitle || '', specialty: r.specialty, year: r.year, school: r.school, nationalId: r.nationalId || '', createdAt: nowIso(), importedFrom: UI.imp.fileName || 'قائمة ملصقة' });
        db.files[id] = r.role === 'admin' ? L.newAdminFile(db.adminDefaults.shares) : L.newRoleFile(r.role, db.templates[r.role]);
      });
      return good.length;
    }, (k) => `حُفظ ${k} موظف${good.length < rows.length ? `، وتُخطّي ${rows.length - good.length} صف أصبح مكرراً` : ''}.`);
    if (n !== false) { UI.imp.rows = null; UI.imp.pasteText = ''; render(); }
  }
  async function downloadTemplate() {
    try { await needLib('xlsx'); } catch (err) { toast('تعذّر تجهيز الملف. تحققي من الاتصال بالإنترنت.', 'bad'); return; }
    const X = window.XLSX;
    const ws = X.utils.aoa_to_sheet([['الاسم', 'فئة التقييم', 'المسمى الوظيفي', 'التخصص', 'العام الدراسي', 'المدرسة', 'رقم الهوية']]);
    ws['!cols'] = [{ wch: 30 }, { wch: 20 }, { wch: 24 }, { wch: 20 }, { wch: 14 }, { wch: 30 }, { wch: 14 }];
    const help = X.utils.aoa_to_sheet([['تعليمات'], ['اكتبي كل موظف في صف تحت العناوين في ورقة «الموظفون».'], ['قيم «فئة التقييم» المقبولة:'], ...L.ROLES.map((r) => [r.label]), [''], ['«المسمى الوظيفي» اختياري: اكتبي المسمى الفعلي إن كان غير الفئة (مثل منسقة الجودة) مع اختيار فئة التقييم المناسبة.'], ['العام والمدرسة إن تُركا فارغين يُملآن من إعدادات المنصة.'], ['رقم الهوية: 10 أرقام تبدأ بـ 1 أو 2، ويلزم لتفعيل حساب الموظف. نسّقي عموده كنص حتى لا يتحول إلى صيغة علمية.']]);
    help['!cols'] = [{ wch: 60 }];
    const wb = X.utils.book_new();
    wb.Workbook = { Views: [{ RTL: true }] };
    X.utils.book_append_sheet(wb, ws, 'الموظفون');
    X.utils.book_append_sheet(wb, help, 'تعليمات');
    const out = X.write(wb, { bookType: 'xlsx', type: 'array' });

          <div class="field"><label for="st_pr">اسم مديرة المدرسة</label><input id="st_pr" name="principalName" value="${esc(s.principalName)}" maxlength="80"></div>
          <div class="field"><label for="st_year">العام الدراسي</label><input id="st_year" name="year" value="${esc(s.year)}" placeholder="مثال: 1448هـ" maxlength="30"></div>
          <div class="field"><label for="st_ev">اسم المقيّم الافتراضي</label><input id="st_ev" name="evaluator" value="${esc(s.evaluator)}" maxlength="80"></div>
          <div class="field"><label for="st_stage">المرحلة</label><select id="st_stage" name="stage">${['', 'ابتدائية', 'متوسطة', 'ثانوية', 'مجمع تعليمي', 'رياض أطفال'].map((o) => `<option value="${o}" ${s.stage === o ? 'selected' : ''}>${o || 'اختاري'}</option>`).join('')}</select></div>
          <div class="field"><label for="st_stat">الرقم الإحصائي</label><input id="st_stat" name="statNo" value="${esc(s.statNo)}" inputmode="numeric" maxlength="20"></div>
          <div class="field"><label for="st_off">مكتب التعليم / الإدارة</label><input id="st_off" name="office" value="${esc(s.office)}" maxlength="120"></div>
        </div>
        <div class="form-foot"><button class="btn primary" type="submit">${ic('check', 'sm')} حفظ الإعدادات</button></div>
      </div></form>
      ${reportHeaderCard()}
      ${esOn() ? `${mySigCard()}${esSettingsCard()}` : ''}
      ${libManagerCard()}
      ${CLOUD ? `<div class="grid g-2">
        <div class="card"><div class="card-h"><h2>${ic('key', 'sm')} كلمة المرور</h2></div><div class="card-b row"><button class="btn" type="button" data-act="own-pass">${ic('key', 'sm')} تغيير كلمة المرور</button></div></div>
        <div class="card"><div class="card-h"><h2>${ic('db', 'sm')} نسخة احتياطية</h2></div><div class="card-b row"><button class="btn" type="button" data-act="backup">${ic('download', 'sm')} تصدير نسخة احتياطية</button></div></div>
      </div>` : `<div class="grid g-2">
        <div class="card"><div class="card-h"><h2>${ic('db', 'sm')} الحفظ</h2></div><div class="card-b stack">
          <div class="note ${S.available ? 'info' : 'bad'}">${ic('info', 'sm')}<div>${S.available ? `<b>حفظ محلي مؤقت في هذا المتصفح فقط</b> وليس حفظاً سحابياً. الحجم الحالي تقريباً ${kb} ك.ب. لا تراه الأجهزة أو الحسابات الأخرى.` : 'الحفظ في هذا المتصفح غير متاح؛ البيانات تبقى حتى إغلاق الصفحة.'}</div></div>
          <div class="row"><button class="btn" type="button" data-act="backup">${ic('download', 'sm')} تصدير نسخة احتياطية (JSON)</button>
            <label class="btn" for="restoreFile">${ic('upload', 'sm')} استعادة نسخة</label><input id="restoreFile" type="file" accept=".json,application/json" hidden></div>
          <p class="small muted">الاستعادة تستبدل كل البيانات الحالية في هذا المتصفح بعد التأكيد.</p></div></div>
        <div class="card"><div class="card-h"><h2>البيانات التجريبية</h2></div><div class="card-b stack">
          <p class="small">${demoN ? `يوجد ${demoN} موظف تجريبي مميز بوسم «تجريبي»، مع ملفاتهم وشواهدهم.` : 'لا توجد بيانات تجريبية.'}</p>
          <div class="row">${demoN ? `<button class="btn danger" type="button" data-act="demo-remove">${ic('trash', 'sm')} حذف البيانات التجريبية فقط</button>` : `<button class="btn" type="button" data-act="demo-load">${ic('plus', 'sm')} تحميل بيانات تجريبية</button>`}</div>
          <hr style="border:0;border-top:1px solid var(--line);width:100%">
          <button class="btn danger" type="button" data-act="reset-all">مسح كل البيانات من هذا المتصفح</button></div></div>
      </div>`}`;
  };

  /* =========================================================
     الأحداث
     ========================================================= */
  function afterRender(r) {
    if (esOn()) {
      if (r.view === 'file' && r.id) { const v = activeVersion(r.id); const ids = v ? [v.ack_signature_id, v.approve_signature_id].filter((x) => x && !(x in ES.sigs)) : []; if (ids.length) ensureSigs(ids).then(() => { if (route().view === 'file') render(); }); }
      if ((r.view === 'settings' || r.view === 'portal' || r.view === 'myeval') && ES.mySig === undefined && (r.view === 'settings' ? !EMP_MODE() : EMP_MODE())) ensureMySig().then(fillMySig);
      if (r.view === 'portal' && EMP_MODE()) renderMyEval();
    }
    if (r.view === 'reports' && UI.rep.empId) renderReportPreview();
    if (r.view === 'settings' && !EMP_MODE() && !OWNER_MODE()) { loadAssets().then(fillAssetTiles); loadLibrary().then(fillLib); }
    if (r.view === 'messages' && UI.msgEmp) markRead(UI.msgEmp);
    if (r.view === 'portal' && UI.portal.empId && (EMP_MODE() || !CLOUD)) markRead(UI.portal.empId);
    if (r.view === 'file' && r.id && document.getElementById('talk') && unreadCount(r.id)) {
      const tb = document.getElementById('talk');
      if ('IntersectionObserver' in window) { const io = new IntersectionObserver((es) => { if (es.some((x) => x.isIntersecting)) { io.disconnect(); markRead(r.id); } }); io.observe(tb); }
      else markRead(r.id);
    }
    document.querySelectorAll('.msgs').forEach((m) => (m.scrollTop = m.scrollHeight));
    // حفظ حالة فتح التفاصيل
    document.querySelectorAll('details[data-item-id]').forEach((d) => d.addEventListener('toggle', () => {
      UI.openItems = UI.openItems || new Set();
      if (d.open) UI.openItems.add(d.dataset.itemId); else UI.openItems.delete(d.dataset.itemId);
    }));
    const dz = $('dropZone');
    if (dz) {
      ['dragenter', 'dragover'].forEach((t) => dz.addEventListener(t, (e) => { e.preventDefault(); dz.classList.add('over'); }));
      ['dragleave', 'drop'].forEach((t) => dz.addEventListener(t, (e) => { e.preventDefault(); dz.classList.remove('over'); }));
      dz.addEventListener('drop', (e) => { const f = e.dataTransfer.files[0]; if (f) readXlsx(f); });
    }
  }

  document.addEventListener('click', async (ev) => {
    const bp = $('bellPanel'); if (bp && !ev.target.closest('#bellWrap')) bp.remove();
    const go = ev.target.closest('tr[data-go]');
    if (go && !ev.target.closest('a,button')) { location.hash = go.dataset.go; return; }
    const t = ev.target.closest('[data-act]');
    if (!t) return;
    const a = t.dataset.act;
    if (a === 'modal-bg') { if (ev.target === t) closeModal(); return; }
    if (t.tagName === 'A' && a !== 'rep-open') ev.preventDefault();
    const d = t.dataset;
    switch (a) {
      case 'modal-close': closeModal(); break;
      case 'es-send': esSend(d.id); break;
      case 'me-filter': ME_UI.filter = d.v; render(); break;
      case 'me-report': myReportModal(); break;
      case 'me-print': if (UI.meReportHtml) printPagesHtml(UI.meReportHtml, 'تقرير تقييمي'); break;
      case 'es-return': esReturn(d.v); break;
      case 'es-approve': esApproveModal(d.v); break;
      case 'sig-new': signaturePad(d.v ? () => esApproveModal(d.v) : null); break;
      case 'sig-clear': { const cv = $('sigPad'); if (cv) { cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); delete cv.dataset.dirty; } break; }
      case 'sg-open': openSuggestions(d.emp, d.item); break;
      case 'sg-cat': if (PE) { PE.cat = d.v; sgRenderLib(); } break;
      case 'sg-add': if (PE) { PE.rows.push({ k: PE.k(), sid: null, category: d.v, text: '' }); sgRenderPlan(); const ta = document.querySelector(`[data-sg-row="${PE.rows[PE.rows.length - 1].k}"]`); if (ta) ta.focus(); } break;
      case 'sg-del': if (PE) { PE.rows = PE.rows.filter((r) => r.k !== d.v); sgRenderPlan(); sgRenderLib(); } break;
      case 'sg-plan-del': deletePlan(); break;
      case 'lib-add': if (!LIB.loaded) await loadLibrary(); if (!LIB.missing) libRowModal(null); break;
      case 'lib-edit': libRowModal(LIB.rows.find((x) => x.id === d.v)); break;
      case 'lib-toggle': libToggle(d.v); break;
      case 'nav-group': { if (NAV_CLOSED.has(d.v)) NAV_CLOSED.delete(d.v); else NAV_CLOSED.add(d.v); lsSet('itqan.navClosed', JSON.stringify([...NAV_CLOSED])); renderNav(); break; }
      case 'auth-go': AUTH.stage = d.v; AUTH.err = ''; AUTH.msg = ''; render(); break;
      case 'auth-open': AUTH.stage = d.v; AUTH.err = ''; AUTH.msg = ''; render(); break;
      case 'auth-close': if (ME && !OWNER_MODE()) { await logout(); } else { AUTH.stage = 'landing'; AUTH.err = ''; render(); } break;
      case 'auth-bg': if (ev.target === t) { if (!ME) { AUTH.stage = 'landing'; AUTH.err = ''; render(); } } break;
      case 'auth-retry': afterLogin(); break;
      case 'logout': logout(); break;
      case 'emp-access': {
        try { const st = await C.accessState(d.id); Object.assign(emp(d.id), st); } catch (e) { toast('تعذّر تحديث حالة الحساب: ' + C.errMsg(e), 'warn'); }
        openAccessModal(d.id); render(); break;
      }
      case 'access-issue': {
        t.disabled = true;
        try { const code = await C.issueInvite(d.id); const e = emp(d.id); e.inviteCode = code; e.inviteExpiresAt = new Date(Date.now() + 14 * 864e5).toISOString(); openAccessModal(d.id); toast('صدر رمز التفعيل.'); }
        catch (e) { t.disabled = false; toast('لم يصدر الرمز: ' + C.errMsg(e), 'bad'); }
        break;
      }
      case 'access-revoke': {
        t.disabled = true;
        try { await C.revoke(d.id); const e = emp(d.id); e.linked = false; e.inviteCode = null; closeModal(); render(); toast('أُلغي ربط الحساب، ولم يعد الموظف يصل إلى المنصة.'); }
        catch (e) { t.disabled = false; toast('لم يُلغَ الربط: ' + C.errMsg(e), 'bad'); }
        break;
      }
      case 'local-migrate': migrateLocal(); break;
      case 'bell': { const ex = $('bellPanel'); if (ex) { ex.remove(); break; } $('bellWrap').insertAdjacentHTML('beforeend', bellPanel()); break; }
      case 'bell-refresh': { const bp = $('bellPanel'); if (bp) bp.remove(); await refreshMessages(false); toast('حُدّثت الرسائل.', '', { ms: 2000 }); render(); break; }
      case 'bell-go': { const bp = $('bellPanel'); if (bp) bp.remove(); if (EMP_MODE()) { location.hash = 'portal'; render(); setTimeout(() => $('talk') && $('talk').scrollIntoView({ behavior: 'smooth' }), 50); } else { UI.msgEmp = d.id; if (location.hash === '#messages') render(); else location.hash = 'messages'; } break; }
      case 'msg-open': UI.msgEmp = d.id; render(); break;
      case 'own-pass': changeOwnPasswordModal(); break;
      case 'emp-setpass': { const e = emp(d.id); passwordModal({ title: `تعيين كلمة مرور — ${esc(e.name)}`, intro: 'تُستبدل كلمة المرور الحالية للموظف، وتظهر الجديدة لكِ مرة واحدة لتعطيها له.', onSave: (pw) => C.principalSetPassword(d.id, pw) }); break; }
      case 'owner-refresh': await loadOwner(); render(); toast('حُدّثت القائمة.', '', { ms: 2000 }); break;
      case 'owner-filter': UI.owner.filter = d.v; render(); break;
      case 'owner-status': {
        const x = UI.owner.list.find((q) => q.id === d.id);
        if (d.v === 'suspended') { const yes = await confirmBox({ title: 'إيقاف مدرسة', text: `سيتوقف وصول «${esc(x.name)}» ومنسوبيها حتى إعادة القبول. البيانات تبقى محفوظة.`, ok: 'إيقاف', danger: true }); if (!yes) break; }
        setSaving(true);
        try { await C.ownerSetStatus(d.id, d.v); setSaving(false); await loadOwner(); render(); toast(d.v === 'approved' ? 'تم قبول المدرسة' : 'تم إيقاف المدرسة', '', { ms: 3000 }); }
        catch (e) { setSaving(false); toast('تعذّر الحفظ، حاولي مرة أخرى', 'bad', { ms: 8000, detail: C.errMsg(e) }); }
        break;
      }
      case 'owner-edit': {
        const x = UI.owner.list.find((q) => q.id === d.id);
        openModal({ title: 'تعديل بيانات المدرسة', body: `<div class="field"><label for="oe_n">اسم المدرسة</label><input id="oe_n" name="n" value="${esc(x.name)}" maxlength="120"></div>
          <div class="field"><label for="oe_a">اسم مسؤول النظام</label><input id="oe_a" name="a" value="${esc(x.admin_name)}" maxlength="80"></div>
          <p class="small muted">الرقم الوزاري ورقم هوية المسؤول جزء من اسم المستخدم ولا يُعدَّلان من هنا.</p><span class="err" id="oe_err"></span>`,
          foot: `<button class="btn primary" type="submit">حفظ</button><button class="btn ghost" type="button" data-act="modal-close">إلغاء</button>`,
          onSubmit: async (fd) => { setSaving(true); try { await C.ownerUpdate(d.id, String(fd.get('n') || '').trim(), String(fd.get('a') || '').trim()); setSaving(false); await loadOwner(); render(); toast('تم الحفظ بنجاح', '', { ms: 3000 }); return true; } catch (e) { setSaving(false); $('oe_err').textContent = 'تعذّر الحفظ، حاولي مرة أخرى — ' + C.errMsg(e); return false; } } });
        break;
      }
      case 'owner-pass': { const x = UI.owner.list.find((q) => q.id === d.id); passwordModal({ title: `كلمة مرور مسؤول «${esc(x.name)}»`, intro: `اسم المستخدم: الرقم الوزاري <b class="ltr">${esc(x.ministry_no)}</b> + رقم الهوية <b class="ltr">${esc(x.admin_nid || '')}</b>. كلمة المرور الحالية لا يمكن عرضها؛ عيّني كلمة مرور جديدة.`, onSave: (pw) => C.ownerResetAdmin(d.id, pw) }); break; }
      case 'owner-del': {
        const x = UI.owner.list.find((q) => q.id === d.id);
        openModal({ title: 'حذف مدرسة نهائياً', body: `<div class="note bad">${ic('alert', 'sm')}<div>سيُحذف «${esc(x.name)}» مع كل الموظفين والتقييمات والشواهد والرسائل وحسابات الدخول (${x.employees_count} موظف). لا يمكن التراجع.</div></div>
          <div class="field"><label for="od_m">للتأكيد اكتبي الرقم الوزاري: <b class="ltr">${esc(x.ministry_no)}</b></label><input id="od_m" name="m" class="ltr" inputmode="numeric" autocomplete="off"></div><span class="err" id="od_err"></span>`,
          foot: `<button class="btn danger" type="submit">${ic('trash', 'sm')} حذف نهائي</button><button class="btn ghost" type="button" data-act="modal-close">إلغاء</button>`,
          onSubmit: async (fd) => { const m = String(fd.get('m') || '').trim(); if (m !== x.ministry_no) { $('od_err').textContent = 'الرقم الوزاري غير مطابق'; return false; }
            setSaving(true); try { await C.ownerDelete(d.id, m); setSaving(false); await loadOwner(); render(); toast('حُذفت المدرسة.', '', { ms: 3000 }); return true; } catch (e) { setSaving(false); $('od_err').textContent = 'تعذّر الحذف — ' + C.errMsg(e); return false; } } });
        break;
      }
      case 'emp-add': openEmployeeModal(null, d.role); break;
      case 'emp-edit': openEmployeeModal(d.id); break;
      case 'emp-del': deleteEmployee(d.id); break;
      case 'score': {
        const v = d.v === '' ? null : Number(d.v);
        editFile(d.emp, (f) => { const it = f.items.find((i) => i.id === d.item); it.score = v; }, null);
        break;
      }
      case 'use-sug': {
        const f = fileOf(d.emp); const it = f.items.find((i) => i.id === d.item); const sg = suggestionFor(it.name);
        if (!sg) break;
        editFile(d.emp, (ff) => { const x = ff.items.find((i) => i.id === d.item); if (!x.feedback) x.feedback = sg.feedback; if (!x.plan) x.plan = sg.plan; }, 'أُدرج النص المقترح في الخانات الفارغة فقط.');
        break;
      }
      case 'approve': {
        const f = fileOf(d.id); const res = L.fileResult(f);
        if (!res.complete) { toast('لا يمكن الاعتماد قبل استكمال جميع الشروط.', 'bad'); break; }
        commit((db) => { const x = db.files[d.id]; x.status = 'approved'; x.approvedAt = nowIso(); x.log.push({ at: nowIso(), msg: `اعتُمد بنتيجة ${f2(res.score)}` }); }, 'اعتُمد التقييم.');
        break;
      }
      case 'unapprove': {
        const yes = await confirmBox({ title: 'إعادة فتح الملف', text: 'سيُلغى اعتماد الملف ويحتاج اعتماداً جديداً بعد التعديل.', ok: 'إعادة الفتح' });
        if (yes) commit((db) => { const x = db.files[d.id]; x.status = 'draft'; x.approvedAt = null; x.log.push({ at: nowIso(), msg: 'أُعيد فتحه للتعديل' }); }, 'أصبح الملف مسودة تحتاج اعتماداً جديداً.');
        break;
      }
      case 'items-edit': UI.itemEdit[d.id] = clone(fileOf(d.id).items); render(); break;
      case 'ie-cancel': delete UI.itemEdit[d.emp]; render(); break;
      case 'sug-plan': editFile(d.emp, (f) => { const o = (f.items || []).find((x) => x.id === d.item); if (o && !o.plan) o.plan = SUG_PLAN; }, 'أُدرجت الإجراءات المقترحة، ويمكن تعديلها.'); break;
      case 'ie-add': UI.itemEdit[d.emp].push({ id: L.uid('it'), name: 'عنصر جديد', weight: 0, section: null, score: null, feedback: '', plan: '', followUp: '' }); render(); break;
      case 'ie-del': UI.itemEdit[d.emp] = UI.itemEdit[d.emp].filter((i) => i.id !== d.item); render(); break;
      case 'ie-save': {
        const draft = UI.itemEdit[d.emp];
        if (draft.some((i) => !String(i.name).trim())) { toast('يوجد عنصر بلا اسم.', 'bad'); break; }
        if (draft.some((i) => !(Number(i.weight) > 0))) { toast('كل عنصر يحتاج وزناً أكبر من صفر.', 'bad'); break; }
        const ok = await editFile(d.emp, (f, db) => {
          const keep = new Set(draft.map((i) => i.id));
          f.items.filter((i) => !keep.has(i.id)).forEach((i) => {
            f.archivedItems.push({ id: i.id, name: i.name, weight: i.weight, score: i.score, feedback: i.feedback, plan: i.plan, deletedAt: nowIso() });
            db.evidence.forEach((x) => { if (x.employeeId === d.emp && x.itemId === i.id) { x.archived = true; x.itemLabel = i.name; x.archivedAt = nowIso(); } });
          });
          f.items = draft.map((n) => { const old = f.items.find((i) => i.id === n.id); return old ? { ...old, name: n.name.trim(), weight: Number(n.weight) } : { ...n, name: n.name.trim(), weight: Number(n.weight) }; });
          db.evidence.forEach((x) => { if (x.employeeId === d.emp && !x.archived) { const it = f.items.find((i) => i.id === x.itemId); if (it) x.itemLabel = it.name; } });
          f.log.push({ at: nowIso(), msg: 'عُدّلت عناصر هذا الملف' });
        }, 'حُفظت عناصر هذا الملف.');
        if (ok) { delete UI.itemEdit[d.emp]; render(); }
        break;
      }
      case 'g-add': {
        const kind = d.kind;
        editFile(d.emp, (f) => {
          f[kind].push({ id: L.uid(kind === 'goals' ? 'g' : 'c'), title: '', measure: '', unit: '', weight: 0, target: '', actual: '', feedback: '', plan: '', followUp: '' });
          if (kind === 'goals' ? f.autoGoals : f.autoComps) { const w = L.equalWeights(f[kind].length); f[kind].forEach((g, i) => (g.weight = w[i])); }
        }, kind === 'goals' ? 'أُضيف هدف.' : 'أُضيفت جدارة.');
        break;
      }
      case 'g-del': {
        const yes = await confirmBox({ title: 'حذف', text: 'سيُحذف من الملف وتنتقل شواهده إلى الأرشيف.', ok: 'حذف', danger: true });
        if (!yes) break;
        editFile(d.emp, (f, db) => {
          const g = f[d.kind].find((x) => x.id === d.id);
          f.archivedItems.push({ id: g.id, name: g.title, weight: g.weight, deletedAt: nowIso() });
          db.evidence.forEach((x) => { if (x.employeeId === d.emp && x.itemId === g.id) { x.archived = true; x.itemLabel = g.title; x.archivedAt = nowIso(); } });
          f[d.kind] = f[d.kind].filter((x) => x.id !== d.id);
          if (d.kind === 'goals' ? f.autoGoals : f.autoComps) { const w = L.equalWeights(f[d.kind].length); f[d.kind].forEach((x, i) => (x.weight = w[i])); }
        }, 'حُذف ونُقلت شواهده إلى الأرشيف.');
        break;
      }
      case 't-add': commit((db) => { db.files[d.emp].training.push({ id: L.uid('t'), need: '', course: '', provider: '', date: '', status: 'planned', feedback: '', impact: '' }); }, 'أُضيف سجل تدريب.'); break;
      case 't-del': {
        const yes = await confirmBox({ title: 'حذف سجل تدريب', text: 'تنتقل شواهده إلى الأرشيف.', ok: 'حذف', danger: true });
        if (yes) commit((db) => { const f = db.files[d.emp]; const t = f.training.find((x) => x.id === d.id); db.evidence.forEach((x) => { if (x.employeeId === d.emp && x.itemId === d.id) { x.archived = true; x.itemLabel = t.course || t.need; } }); f.training = f.training.filter((x) => x.id !== d.id); }, 'حُذف سجل التدريب.');
        break;
      }
      case 'ev-add': openEvidenceModal({ empId: d.emp || null, itemId: d.item || null, portal: !!d.portal }); break;
      case 'ev-edit': openEvidenceModal({ id: d.id, portal: !!d.portal }); break;
      case 'ev-del': deleteEvidence(d.id); break;
      case 'ev-arch': UI.ev.archived = d.v === '1'; render(); break;
      case 'qr-view': showQr(d.id); break;
      case 'copy': {
        try { await navigator.clipboard.writeText(d.text); toast('نُسخ الرابط.'); } catch (e) { toast('لم يُنسخ تلقائياً؛ حدّدي الرابط وانسخيه يدوياً.', 'warn'); }
        break;
      }
      case 'rep-open': UI.rep.empId = d.id; break;
      case 'rep-print': {
        reportPrint();
        break;
      }
      case 'rep-pdf': reportPdf(); break;
      case 'rep-html': { const h = await reportStandalone(false); if (h) offerFile(`${tplName()}-${emp(UI.rep.empId).name}.html`, h, 'text/html'); break; }
      case 'rep-preview': reportPreviewModal(); break;
      case 'asset-del': {
        const k = ASSET_KINDS.find((x) => x.key === d.v);
        const yes = await confirmBox({ title: `حذف ${k.label}`, text: 'ستُحذف الصورة من إعدادات التقارير.', ok: 'حذف', danger: true });
        if (yes && await saveAsset(d.v, null)) fillAssetTiles();
        break;
      }
      case 'imp-mode': UI.imp.mode = d.v; UI.imp.rows = null; UI.imp.error = ''; render(); break;
      case 'imp-template': downloadTemplate(); break;
      case 'imp-clear': UI.imp.rows = null; render(); break;
      case 'imp-save': importSave(); break;
      case 'paste-preview': {
        const I = UI.imp;
        I.pasteText = $('pasteText').value; I.pasteRole = $('pasteRole').value; I.pasteTitle = $('pasteTitle').value; I.pasteSpec = $('pasteSpec').value; I.pasteYear = $('pasteYear').value; I.pasteSchool = $('pasteSchool').value;
        const rows = L.parsePastedNames(I.pasteText).map((r) => ({ ...r, role: I.pasteRole, jobTitle: I.pasteTitle, specialty: I.pasteSpec, year: I.pasteYear, school: I.pasteSchool }));
        if (!rows.length) { toast('الصقي اسماً واحداً على الأقل.', 'bad'); break; }
        I.fileName = 'قائمة ملصقة'; I.missing = [];
        I.rows = L.buildImportPreview(rows, DB.employees, { year: DB.settings.year, school: DB.settings.schoolName });
        render();
        break;
      }
      case 'tpl-role': UI.tplRole = d.v; render(); break;
      case 'tp-add': UI.tplDraft[d.role].push({ id: L.uid('tp'), name: 'عنصر جديد', weight: 0, section: null }); render(); break;
      case 'tp-del': UI.tplDraft[d.role] = UI.tplDraft[d.role].filter((i) => i.id !== d.id); render(); break;
      case 'tp-cancel': UI.tplDraft[d.role] = clone(DB.templates[d.role].items); render(); break;
      case 'tp-restore': UI.tplDraft[d.role] = DB.templates[d.role].original.map((o) => ({ id: L.uid('tp'), name: o.name, weight: o.weight, section: o.section })); render(); toast('استُعيد الأصل في المسودة. اضغطي «حفظ القالب» لاعتماده.'); break;
      case 'tp-save': {
        const dr = UI.tplDraft[d.role];
        if (!dr.length) { toast('القالب يحتاج عنصراً واحداً على الأقل.', 'bad'); break; }
        if (dr.some((i) => !String(i.name).trim())) { toast('يوجد عنصر بلا اسم.', 'bad'); break; }
        if (dr.some((i) => !(Number(i.weight) > 0))) { toast('كل عنصر يحتاج وزناً أكبر من صفر.', 'bad'); break; }
        await commit((db) => { db.templates[d.role].items = dr.map((i) => ({ ...i, name: i.name.trim(), weight: Number(i.weight) })); db.templates[d.role].updatedAt = nowIso(); }, 'حُفظ القالب. يُطبَّق على الملفات الجديدة فقط.');
        UI.tplDraft[d.role] = clone(DB.templates[d.role].items); render();
        break;
      }
      case 'ad-save': {
        const g = Number($('ad_g').value), c = Number($('ad_c').value);
        if (!(g >= 0 && c >= 0) || Math.abs(g + c - 100) > 0.01) { toast('مجموع الحصتين يجب أن يساوي 100%.', 'bad'); break; }
        commit((db) => { db.adminDefaults.shares = { goals: g, comp: c }; }, 'حُفظ التوزيع الافتراضي للملفات الجديدة.');
        break;
      }
      case 'logo-remove': UI.pendingLogo = null; render(); break;
      case 'backup': offerFile(`itqan-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(DB, null, 1), 'application/json'); break;
      case 'demo-remove': {
        const n = D.countDemo(DB);
        const yes = await confirmBox({ title: 'حذف البيانات التجريبية', text: `سيُحذف ${n} موظف تجريبي مع ملفاتهم وشواهدهم. البيانات الحقيقية لا تتأثر.`, ok: 'حذف التجريبي فقط', danger: true });
        if (yes) commit((db) => D.removeDemo(db), (r) => `حُذف ${r.employees} موظف تجريبي و${r.evidence} شاهد تجريبي.`);
        break;
      }
      case 'demo-load': commit((db) => { D.seedDemo(db); }, 'حُمّلت بيانات تجريبية مميزة بوسم «تجريبي».'); break;
      case 'reset-all': {
        const yes = await confirmBox({ title: 'مسح كل البيانات', text: 'سيُحذف كل شيء من هذا المتصفح: الموظفون والتقييمات والشواهد والإعدادات والقوالب المعدّلة. صدّري نسخة احتياطية أولاً إن احتجتِ.', ok: 'مسح الكل', danger: true });
        if (yes) { DB = S.freshDb(); const r = S.save(DB); toast(r.ok ? 'مُسحت البيانات وبدأت المنصة فارغة.' : 'لم يكتمل المسح: ' + r.error, r.ok ? '' : 'bad'); UI.tplDraft = {}; render(); }
        break;
      }
      default: break;
    }
  });

  /* حقول الملف: تُحفظ عند مغادرة الحقل */
  document.addEventListener('change', async (ev) => {
    const el = ev.target;
    if (el.dataset.sgSid) { sgToggle(el.dataset.sgSid, el.checked); return; }
    if (el.id === 'sigUpload') { sigUploadToPad(el.files[0]); el.value = ''; return; }
    if (el.name === 'choice' && el.closest('#ackForm')) { $('ackNoteWrap').hidden = el.value !== 'note'; if (el.value === 'note') $('ack_note').focus(); return; }
    if (el.id === 'esJustBelow' || el.id === 'esJustMode') { const below = Number($('esJustBelow').value), mode = $('esJustMode').value; commit((db) => { db.settings.esign = { ...(db.settings.esign || {}), justify: { below, mode } }; }, 'حُفظ الإعداد.'); return; }
    if (el.id === 'esAllowUpload') { const on = el.checked; commit((db) => { db.settings.esign = { ...(db.settings.esign || {}), allowUpload: on }; }, 'حُفظ الإعداد.'); return; }
    if (el.closest('#modalForm')) { if (el.dataset.modalChange && modalOnChange) modalOnChange(el.dataset.modalChange, el.value); return; }
    if (['lmRole', 'lmItem', 'lmCat', 'lmShow'].includes(el.id)) { LM[{ lmRole: 'role', lmItem: 'item', lmCat: 'cat', lmShow: 'show' }[el.id]] = el.value; if (el.id === 'lmRole') LM.item = ''; fillLib(); return; }
    if (el.dataset.bind) {
      const [, empId, kind, id, field] = el.dataset.bind.split('|');
      let v = el.value;
      if (el.dataset.num) v = v === '' ? '' : Number(v);
      if (kind === 'training') { commit((db) => { const o = db.files[empId].training.find((x) => x.id === id); if (o) o[field] = v; }, null, { deferRender: true }).then((ok) => { if (!ok) el.classList.add('save-failed'); }); return; }
      el.classList.remove('save-failed');
      editFile(empId, (f) => {
        if (kind === 'summary') f[field] = v;
        else if (kind === 'shares') f.shares[field] = v === '' ? 0 : v;
        else { const o = f[kind].find((x) => x.id === id); if (o) o[field] = v; }
      }, null, { deferRender: true }).then((ok) => { if (!ok) el.classList.add('save-failed'); });
      return;
    }
    if (el.dataset.actChange === 'auto') {
      const kind = el.dataset.kind, on = el.checked;
      editFile(el.dataset.emp, (f) => {
        if (kind === 'goals') f.autoGoals = on; else f.autoComps = on;
        if (on) { const w = L.equalWeights(f[kind].length); f[kind].forEach((g, i) => (g.weight = w[i])); }
      }, on ? 'وُزّعت الأوزان بالتساوي.' : 'يمكنك الآن تعديل الأوزان يدوياً.');
      return;
    }
    if (el.dataset.ie) { const [eid, iid, field] = el.dataset.ie.split('|'); const it = UI.itemEdit[eid].find((i) => i.id === iid); it[field] = field === 'weight' ? Number(el.value) : el.value; setTimeout(render, 0); return; }
    if (el.dataset.tp) { const [role, iid, field] = el.dataset.tp.split('|'); const it = UI.tplDraft[role].find((i) => i.id === iid); it[field] = field === 'weight' ? Number(el.value) : el.value; setTimeout(render, 0); return; }
    switch (el.id) {
      case 'yearSel': UI.year = el.value; render(); break;
      case 'roleSel': UI.role = el.value; render(); break;
      case 'statusSel': UI.status = el.value; render(); break;
      case 'evEmp': UI.ev.emp = el.value; render(); break;
      case 'repEmp': UI.rep.empId = el.value; render(); break;
      case 'repTpl': UI.rep.tpl = el.value; render(); break;
      case 'repMode': UI.rep.mode = el.value; render(); break;
      case 'repBg': UI.rep.bg = el.checked; render(); break;
      case 'repStamp': UI.rep.stamp = el.checked; render(); break;
      case 'anaRole': UI.ana.role = el.value; render(); break;
      case 'portalEmp': UI.portal.empId = el.value; render(); break;
      case 'msgNewEmp': if (el.value) { UI.msgEmp = el.value; render(); } break;
      case 'xlsxFile': if (el.files[0]) readXlsx(el.files[0]); break;
      case 'logoFile': onLogo(el.files[0]); break;
      case 'asset_ministry_logo': case 'asset_background': case 'asset_stamp': onAssetFile(el.id.slice(6), el.files[0], el); break;
      case 'restoreFile': onRestore(el.files[0]); break;
      default: break;
    }
  });
  document.addEventListener('toggle', (ev) => { const d = ev.target; if (d && d.dataset && d.dataset.esLog && d.open) esFillLog(d.dataset.esLog, d.querySelector('.es-log')); }, true);
  document.addEventListener('input', (ev) => {
    if (ev.target.id === 'q') { UI.q = ev.target.value; render(); }
    if (ev.target.dataset && ev.target.dataset.sgRow && PE) { const r = PE.rows.find((x) => x.k === ev.target.dataset.sgRow); if (r) r.text = ev.target.value; }
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') { if ($('modalForm')) closeModal(); else closeNav(); }
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.dataset && ev.target.dataset.act === 'qr-view') { ev.preventDefault(); showQr(ev.target.dataset.id); }
  });
  document.addEventListener('submit', async (ev) => {
    if (ev.target.id === 'authForm' || ev.target.id === 'authForm2') { ev.preventDefault(); onAuthSubmit(ev.target); return; }
    if (ev.target.dataset && ev.target.dataset.compose) { ev.preventDefault(); const fd = new FormData(ev.target); sendMessage(ev.target.dataset.compose, String(fd.get('topic') || 'general'), fd.get('body'), ev.target); return; }
    if (ev.target.id === 'modalForm') {
      ev.preventDefault();
      if (modalHandler) {
        const btn = ev.target.querySelector('button[type=submit]'); if (btn) btn.disabled = true;
        Promise.resolve(modalHandler(new FormData(ev.target), ev.target)).then((close) => { if (close) closeModal(); else if (btn) btn.disabled = false; });
      }
      return;
    }
    if (ev.target.id === 'ackForm') { ev.preventDefault(); submitAck(ev.target); return; }
    if (ev.target.classList && ev.target.classList.contains('me-upd')) { ev.preventDefault(); myPlanUpdate(ev.target); return; }
    if (ev.target.id === 'rhForm') {
      ev.preventDefault();
      const fd = new FormData(ev.target);
      const g = (k) => String(fd.get(k) || '').trim();
      const n = (k, a, b, d) => { const v = Number(fd.get(k)); return isFinite(v) && fd.get(k) !== '' ? Math.min(b, Math.max(a, v)) : d; };
      const show = {}; ['kingdom', 'ministry', 'office', 'school', 'ministryLogo', 'schoolLogo'].forEach((k) => (show[k] = fd.get('show_' + k) === 'on'));
      const report = { mode: g('mode') || 'text', principalTitle: g('principalTitle') || 'مدير/ة المدرسة', kingdom: g('kingdom'), ministry: g('ministry'), office: g('office'), school: g('school'), principal: g('principal'),
        show, paperText: fd.get('paperText') === 'on', bgFit: g('bgFit') || 'cover', bgOpacity: n('bgOpacity', 10, 100, 100), bgPrint: fd.get('bgPrint') === 'on',
        mTop: n('mTop', 5, 80, 12), mBottom: n('mBottom', 5, 80, 12), mSide: n('mSide', 5, 40, 12), stampMode: g('stampMode') || 'image', signSpace: fd.get('signSpace') === 'on' };
      const ok = await commit((db) => { db.settings.report = report; }, 'حُفظت إعدادات الديباجة.');
      if (ok) { UI.rep.mode = undefined; UI.rep.bg = undefined; }
      return;
    }
    if (ev.target.id === 'settingsForm') {
      ev.preventDefault();
      const fd = new FormData(ev.target);
      const data = {}; ['schoolName', 'principalName', 'year', 'evaluator', 'stage', 'statNo', 'office'].forEach((k) => (data[k] = String(fd.get(k) || '').trim()));
      const logo = UI.pendingLogo !== undefined ? UI.pendingLogo : DB.settings.logo;
      const ok = await commit((db) => { Object.assign(db.settings, data, { logo: logo || null, updatedAt: nowIso() }); }, CLOUD ? 'حُفظت إعدادات المدرسة في قاعدة البيانات.' : 'حُفظت إعدادات المدرسة في هذا المتصفح.');
      if (ok) { UI.pendingLogo = undefined; render(); }
    }
  });

  function onLogo(file) {
    if (!file) return;
    if (!/^image\//.test(file.type)) { toast('الملف ليس صورة.', 'bad'); return; }
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 256, k = Math.min(1, max / Math.max(img.width || max, img.height || max));
        const c = document.createElement('canvas'); c.width = Math.round((img.width || max) * k); c.height = Math.round((img.height || max) * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        UI.pendingLogo = c.toDataURL('image/png'); render();
      };
      img.onerror = () => toast('تعذّرت قراءة الصورة.', 'bad');
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }
  async function onRestore(file) {
    if (!file) return;
    let data;
    try { data = JSON.parse(await file.text()); } catch (e) { toast('الملف ليس نسخة احتياطية صالحة.', 'bad'); return; }
    if (!S.validate(data)) { toast('الملف لا يطابق بنية نسخة إتقان الاحتياطية.', 'bad'); return; }
    const yes = await confirmBox({ title: 'استعادة نسخة احتياطية', text: `ستُستبدل كل البيانات الحالية في هذا المتصفح بالنسخة (${data.employees.length} موظف).`, ok: 'استعادة', danger: true });
    if (!yes) return;
    const before = DB; DB = data; migrate(DB);
    const r = S.save(DB);
    if (!r.ok) { DB = before; toast('لم تُستعد: ' + r.error, 'bad'); } else toast('استُعيدت النسخة الاحتياطية.');
    UI.tplDraft = {}; render();
  }

  /* القائمة الجانبية على الجوال */
  function closeNav() { document.body.classList.remove('nav-open'); $('menuBtn').setAttribute('aria-expanded', 'false'); }
  $('menuBtn').addEventListener('click', () => {
    if (window.matchMedia('(min-width: 941px)').matches) { const m = document.body.classList.toggle('side-mini'); lsSet('itqan.sideMini', m ? '1' : ''); return; }
    const o = document.body.classList.toggle('nav-open'); $('menuBtn').setAttribute('aria-expanded', String(o));
  });
  $('scrim').addEventListener('click', closeNav);
  window.addEventListener('hashchange', () => { closeNav(); closeModal(); render(); });

  /* إتاحة للاختبارات */
  window.Itqan = { get db() { return DB; }, UI, render, qrUrl, reportHtml };

  /* أنماط التقرير نفسها للمعاينة وPDF والطباعة */
  const rcss = document.createElement('style'); rcss.id = 'reportCss'; rcss.textContent = R.REPORT_CSS; document.head.appendChild(rcss);

  boot();
})();

</script>
</body>
</html>
