.rp-bar span.trk{background:#F0EAF6;border-radius:4px;height:8px;display:flex;justify-content:flex-start}
.rp-sign{display:grid;grid-template-columns:1fr 1fr 150px;gap:10px;margin-top:6px}
.rp-sign > div{border:1px solid var(--rp-line);border-radius:6px;padding:6px 9px;min-height:78px;background:rgba(255,255,255,.88)}
.rp-sign span{display:block;color:var(--rp-mute);font-size:10.3px}
.rp-sign .line{border-bottom:1px dotted #9C90AC;height:26px;margin-top:4px}
.rp-sign.nosp .line{height:8px}
.rp-sig{display:block;max-width:170px;max-height:56px;object-fit:contain;margin:2px 0}
.rp-stamp{display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
.rp-stamp img{max-width:120px;max-height:90px;object-fit:contain}
.rp-stamp .ph{width:96px;height:72px;border:1px dashed #B9AECB;border-radius:50%;margin-top:4px}
`;

  /* ---------- تجميع بيانات الملف ---------- */
  function collect(file) {
    const res = L.fileResult(file);
    const out = { res, scored: [], strengths: [], improve: [], feedback: [], plans: [], goals: null, comps: null, items: [] };
    const push = (o, name, score, extra) => {
      const has = score != null && isFinite(score);
      if (has) {
        out.scored.push({ name, score });
        if (score >= 4) out.strengths.push(name);
        if (score <= 3) out.improve.push(name);
      }
      if (o.feedback || o.justification) out.feedback.push({ name, text: o.feedback || '', just: o.justification || '' });
      if ((has && score < 3) || o.plan || o.planStatus || o.followResult) {
        out.plans.push({ name, score: has ? score : null, plan: o.plan || '', followUp: o.followUp || '', status: o.planStatus || '', result: o.followResult || '', ...extra });
      }
    };
    if (file.kind === 'admin') {
      out.goals = res.goals; out.comps = res.comps;
      res.goals.rows.forEach((g) => push(g, g.title || 'هدف', g.calc.score, { target: g.target, actual: g.actual, unit: g.unit }));
      res.comps.rows.forEach((g) => push(g, g.title || 'جدارة', g.calc.score, { target: g.target, actual: g.actual, unit: g.unit }));
    } else {
      out.items = file.items || [];
      out.items.forEach((it) => push(it, it.name, L.isScore(it.score) ? Number(it.score) : null, {}));
    }
    return out;
  }
  const lvlText = (score) => { const l = L.levelOf(score); return l ? l.label : ''; };
  const finalText = (res) => (res.complete ? `${f2(res.score)} من 5 — ${lvlText(res.score)}` : 'لم يكتمل التقييم بعد');

  /* ---------- الديباجة ---------- */
  function letterhead(rs, assets, settings, mode) {
    if (mode === 'paper' && !rs.paperText) return '';
    const show = rs.show || {};
    const lines = [show.kingdom && rs.kingdom, show.ministry && rs.ministry, show.office && rs.office, show.school && (rs.school || settings.schoolName)].filter(Boolean);
    const ml = show.ministryLogo && assets.ministry_logo ? `<img src="${assets.ministry_logo}" alt="">` : '';
    const sl = show.schoolLogo && settings.logo ? `<img src="${settings.logo}" alt="">` : '';
    if (!lines.length && !ml && !sl) return '';
    return `<div class="rp-lh"><div class="t">${lines.map((l) => `<div>${esc(l)}</div>`).join('')}</div><div class="c">${ml}</div><div class="l">${sl}</div></div>`;
  }

  /* ---------- كتل مشتركة ---------- */
  function titleBlock(tplLabel, emp, file, settings) {
    const approved = file.status === 'approved';
    return `<div class="rp-title"><h1>${esc(tplLabel)} — تقييم الأداء الوظيفي</h1>
      <div class="sub">العام الدراسي: <b>${esc(emp.year || settings.year || '—')}</b>${file.evalPeriod ? ` · الفترة: <b>${esc(file.evalPeriod)}</b>` : ''}${approved ? `<span class="rp-badge">معتمد${file.approvedAt ? ' — ' + dateAr(file.approvedAt) : ''}</span>` : ''}</div></div>`;
  }
  function infoBlock(emp, file, settings, compact, periodLabel) {
    const role = L.roleOf(emp.role);
    const cells = [
      ['الاسم', emp.name], ['المسمى الوظيفي', L.titleOf(emp)], ['فئة التقييم', role ? role.label : ''],
      ['المدرسة', emp.school || settings.schoolName], ['العام الدراسي', emp.year || settings.year],
      [periodLabel || 'فترة التقييم', file.evalPeriod], ['نوع التقييم', file.evalType],
    ];
    if (!compact) cells.push(['التخصص', emp.specialty], ['المسار', role ? L.TRACKS[role.track].label : ''], ['حالة التقييم', L.STATUS[L.fileStatus(file)].label],
      ['تاريخ التقييم', file.evalDate ? dateAr(file.evalDate) : ''], ['تاريخ الاعتماد', file.approvedAt ? dateAr(file.approvedAt) : '']);
    while (cells.length % 4) cells.push(['', null]);
    return `<div class="rp-block"><h2>البيانات الوظيفية</h2><div class="rp-info">${cells.map(([k, v]) => `<div>${k ? `<span>${k}</span><b>${dash(v)}</b>` : ''}</div>`).join('')}</div></div>`;
  }
  function roleTable(c, compact) {
    const items = c.items; const res = c.res; let lastSec = null;
    if (!items.length) return '<div class="rp-block"><h2>عناصر التقييم</h2><div class="rp-box"><span class="rp-empty">لا توجد عناصر في هذا الملف.</span></div></div>';
    const cols = compact ? 4 : 7;

      <tr class="rp-final"><td colspan="${cols - 1}">النتيجة النهائية والتقدير العام</td><td class="n">${esc(finalText(res))}</td></tr>

  }
  function adminTables(c, compact) {

  function trainingBlock(file, title) {

  function distBlock(c, compact) {

  /* خطط تحسين الأداء المعتمدة من مكتبة المقترحات (النص النهائي كما اعتمدته المديرة) */
  const SG_CATS = [['strength', 'نقاط القوة'], ['improve', 'فرص التحسين'], ['remedial', 'الخطط العلاجية'], ['development', 'الخطط التحسينية'], ['feedback', 'التغذية الراجعة'], ['recommendation', 'التوصيات'], ['training', 'الاحتياجات التدريبية'], ['indicator', 'مؤشرات قياس الأثر']];
  function approvedPlansBlock(plans, file) {
    const ids = new Set(file.kind === 'admin' ? [...(file.goals || []), ...(file.comps || [])].map((g) => g.id) : (file.items || []).map((i) => i.id));
    const list = (plans || []).filter((p) => ids.has(p.itemId));
    if (!list.length) return '';
    return `<div class="rp-block"><h2>خطط تحسين الأداء المعتمدة</h2><table><thead><tr><th style="width:20%">عنصر الأداء</th><th>محتوى الخطة</th><th style="width:24%">التنفيذ والمتابعة</th></tr></thead><tbody>
      ${list.map((p) => {
        const by = {}; (p.selections || []).forEach((x) => { (by[x.category] = by[x.category] || []).push(x.text); });
        return `<tr><td><b>${esc(p.itemLabel)}</b>${p.score != null ? `<br><small>الدرجة عند الاعتماد: ${f2(p.score)}</small>` : ''}</td>
          <td>${SG_CATS.filter(([c]) => by[c]).map(([c, t]) => `<div><b>${t}:</b> ${by[c].map(nl).join('؛ ')}</div>`).join('')}</td>
          <td>${[p.planType && `<div><b>${p.planType === 'development' ? 'خطة تحسينية' : 'خطة علاجية'}</b>${p.status ? ` · ${esc(PSTAT[p.status] || '')}` : ''}</div>`, p.goal && `<div>الهدف: ${esc(p.goal)}</div>`, p.duration && `<div>المدة: ${esc(p.duration)}</div>`, (p.startDate || p.endDate) && `<div>من ${esc(dateAr(p.startDate) || '—')} إلى ${esc(dateAr(p.endDate) || '—')}</div>`, p.owner && `<div>المسؤول: ${esc(p.owner)}</div>`, p.indicator && `<div>مؤشر النجاح: ${esc(p.indicator)}</div>`, p.measureMethod && `<div>آلية القياس: ${esc(p.measureMethod)}</div>`, p.followDate && `<div>المتابعة: ${esc(dateAr(p.followDate))}</div>`, p.followResults && `<div>نتائج المتابعة: ${esc(p.followResults)}</div>`, p.approvedAt && `<div><small>اعتُمدت: ${esc(dateAr(p.approvedAt))}</small></div>`].filter(Boolean).join('') || '<span class="rp-empty">—</span>'}</td></tr>`;

  function talkBlock(msgs, emp) {

    if (!list.length) return '';
    return `<div class="rp-block"><h2>ملاحظات الموظف على التقييم والردود</h2><table><thead><tr><th class="n">التاريخ</th><th>المرسل</th><th>النص</th></tr></thead><tbody>
      ${list.map((m) => `<tr><td class="n">${dateAr(m.createdAt)}</td><td>${m.sender === 'principal' ? 'مدير/ة المدرسة' : esc(emp.name)}</td><td>${nl(m.body)}</td></tr>`).join('')}</tbody></table></div>`;

  function recBlock(file, extra) {

      ${train.length ? `<h3 style="margin-top:6px">الاحتياجات التدريبية والبرامج التطويرية</h3><ul>${train.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}

  function nextActions(c, plans) {
    const open = c.plans.filter((p) => p.status !== 'done');

  function signBlock(emp, file, rs, assets, withStamp, es) {
    const approved = file.status === 'approved';
    es = es || {};
    // التوقيع الإلكتروني يظهر فقط عند وجود إقرار/اعتماد فعلي مسجّل في الخادم
    const empSig = es.emp && es.emp.img ? `<img class="rp-sig" src="${es.emp.img}" alt="توقيع الموظف">` : '<div class="line"></div>';
    const prinSig = approved && es.prin && es.prin.img ? `<img class="rp-sig" src="${es.prin.img}" alt="توقيع مدير/ة المدرسة">` : '<div class="line"></div>';
    const empAt = es.emp && es.emp.at ? `<span>تاريخ الإقرار: ${dateAr(es.emp.at)}${es.emp.choice === 'note' ? ' (مع ملاحظة)' : ''}</span>` : '';
    const prinAt = approved && es.prin && es.prin.at ? es.prin.at : file.approvedAt;
    let stamp = '';
    if (rs.stampMode !== 'none') {
      // صورة الختم لا تعني الاعتماد: تظهر على التقرير المعتمد فقط، وإلا تبقى المساحة فارغة للختم اليدوي
      const img = rs.stampMode === 'image' && withStamp !== false && approved && assets.stamp ? `<img src="${assets.stamp}" alt="الختم">` : '<div class="ph"></div>';
      stamp = `<div class="rp-stamp"><span>الختم الرسمي</span>${img}</div>`;
    }
    return `<div class="rp-block"><div class="rp-sign ${rs.signSpace ? '' : 'nosp'}" style="${stamp ? '' : 'grid-template-columns:1fr 1fr'}">
      <div><span>الموظف</span><b>${esc(emp.name)}</b><span style="margin-top:4px">التوقيع:</span>${empSig}${empAt}</div>
      <div><span>${esc(rs.principalTitle || 'مدير/ة المدرسة')}</span><b>${dash(rs.principal)}</b><span style="margin-top:4px">التوقيع:</span>${prinSig}<span>تاريخ الاعتماد النهائي: ${approved && prinAt ? dateAr(prinAt) : '—'}</span></div>
      ${stamp}</div></div>`;

  function followTargets(c) {
    const rows = c.plans;
    const ach = (p) => {
      if (p.target != null && p.target !== '' && isFinite(Number(p.target)) && Number(p.target) > 0 && p.actual !== '' && p.actual != null) return `${Math.round((Number(p.actual) / Number(p.target)) * 100)}% من المستهدف`;
      return p.score != null ? esc(lvlText(p.score)) : '<span class="rp-empty">—</span>';
    };
    const done = rows.filter((p) => p.status === 'done').length, prog = rows.filter((p) => p.status === 'progress').length;
    return `<div class="rp-block"><h2>عناصر الأداء المستهدفة ومستوى الإنجاز</h2>
      ${rows.length ? `<table><thead><tr><th class="n">م</th><th>العنصر</th><th class="n">الدرجة</th><th>مستوى الإنجاز</th><th class="n">موعد المتابعة</th><th>حالة التنفيذ</th></tr></thead><tbody>
      ${rows.map((p, i) => `<tr><td class="n">${i + 1}</td><td>${esc(p.name)}</td><td class="n">${p.score ?? '—'}</td><td>${ach(p)}</td><td class="n">${p.followUp ? esc(dateAr(p.followUp)) : '—'}</td><td>${esc(PLAN_ST[p.status] || PLAN_ST[''])}</td></tr>`).join('')}
      </tbody></table>` : `<div class="rp-box">${c.scored.length ? 'لا توجد عناصر مستهدفة بالمتابعة؛ جميع الدرجات 3 فأكثر ولم تُسجَّل خطط تحسين.' : '<span class="rp-empty">لم تُرصد درجات بعد.</span>'}</div>`}</div>`
      + (rows.length ? `<div class="rp-block"><h2>مدى التقدم في التنفيذ</h2><div class="rp-result"><b class="big">${Math.round((done / rows.length) * 100)}%</b><div><b>${done}</b> منفّذ، و<b>${prog}</b> قيد التنفيذ، و<b>${rows.length - done - prog}</b> لم يبدأ — من أصل <b>${rows.length}</b> إجراء.</div></div></div>` : '');
  }

  /* ---------- بناء التقرير: قائمة كتل تُقسَّم على صفحات A4 ---------- */
  function build(ctx) {
    const { emp, file, settings } = ctx;
    const tpl = TEMPLATES.find((t) => t.key === ctx.template) || TEMPLATES[0];
    const rs = ctx.rs || reportSettings(settings);
    const assets = ctx.assets || {};
    const c = collect(file);
    const admin = file.kind === 'admin';
    const B = [titleBlock(tpl.label, emp, file, settings)];
    if (tpl.key === 'full') {
      B.push(infoBlock(emp, file, settings, false));
      if (admin) B.push(...adminTables(c, false), trainingBlock(file, 'ثالثاً: الاحتياجات التدريبية والدورات'));
      else B.push(roleTable(c, false));
      B.push(distBlock(c, false), strengthsBlock(c, file, 0), feedbackBlock(c, file), plansBlock(c, rs), approvedPlansBlock(ctx.plans, file), talkBlock(ctx.messages, emp), recBlock(file, ''));
    } else if (tpl.key === 'short') {
      B.push(infoBlock(emp, file, settings, true));
      if (admin) B.push(...adminTables(c, true)); else B.push(roleTable(c, true));
      B.push(distBlock(c, true), strengthsBlock(c, file, 5));
      B.push(`<div class="rp-block"><h2>التوصيات المختصرة</h2><div class="rp-box">${file.recommendation ? nl(file.recommendation) : '<span class="rp-empty">—</span>'}</div></div>`);
    } else {
      B.push(infoBlock(emp, file, settings, true, 'فترة المتابعة'));
      B.push(followTargets(c), strengthsBlock(c, file, 0), plansBlock(c, rs, 'الخطة العلاجية والإجراءات التحسينية'), approvedPlansBlock(ctx.plans, file), feedbackBlock(c, file), recBlock(file, nextActions(c, ctx.plans)));
    }
    B.push(signBlock(emp, file, rs, assets, ctx.withStamp, ctx.esign));
    return { blocks: B.filter(Boolean), template: tpl, rs };
  }

  /* صفحة A4 (794×1123 بكسل = 210×297 مم) بخلفيتها وديباجتها؛ المحتوى يُضاف في .rp-body */
  function pageShell(ctx, opts) {
    const rs = ctx.rs || reportSettings(ctx.settings);
    const assets = ctx.assets || {};
    const mode = opts.mode || rs.mode || 'text';
    const mm = (v) => Math.round((Number(v) || 0) * 3.7795);
    const bgOn = opts.withBg !== false && mode !== 'text' && assets.background;
    const fit = rs.bgFit === 'stretch' ? '100% 100%' : rs.bgFit === 'contain' ? 'contain' : 'cover';
    const op = Math.max(0.05, Math.min(1, (Number(rs.bgOpacity) || 100) / 100));
    const bg = bgOn ? `<div class="rp-bg" style="background-image:url('${assets.background}');background-size:${fit};opacity:${op}"></div>` : '';
    const lh = letterhead(rs, assets, ctx.settings || {}, mode);
    return `<div class="rp-page">${bg}<div class="rp-inner" style="top:${mm(rs.mTop)}px;bottom:${mm(rs.mBottom)}px;left:${mm(rs.mSide)}px;right:${mm(rs.mSide)}px">${lh}<div class="rp-body"></div><div class="rp-pfoot"><span>${esc(rs.school || (ctx.settings || {}).schoolName || '')}</span><span class="pn"></span></div></div></div>`;
  }

  /* ملف HTML مستقل للطباعة (صفحات جاهزة) */
  function standaloneHtml(pagesHtml, title, autoPrint) {
    return `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(title)}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Readex+Pro:wght@500;600&display=swap">
<style>html,body{margin:0;padding:0}body{background:#EEEBF3}.bar{display:flex;justify-content:center;gap:8px;padding:12px;font-family:Tahoma,sans-serif}
.bar button{padding:8px 16px;border-radius:8px;border:0;background:#5B3B6E;color:#fff;font-size:14px;cursor:pointer}
.rp-page{margin:0 auto 14px;box-shadow:0 4px 18px rgba(0,0,0,.1)}
@page{size:A4;margin:0}
@media print{html,body{background:#fff}.bar{display:none}.rp-page{margin:0;box-shadow:none;page-break-after:always;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}.rp-page:last-child{page-break-after:auto;break-after:auto}}
${REPORT_CSS}</style></head><body>${autoPrint ? '' : '<div class="bar"><button onclick="window.print()">طباعة / حفظ PDF</button></div>'}${pagesHtml}</body></html>`;
  }

  root.ItqanReport = { build, pageShell, standaloneHtml, reportSettings, REPORT_CSS, TEMPLATES, MODES, collect };
})(window);

</script>
<script>/* js/cloud.js */
/* =========================================================
   إتقان — طبقة Supabase (المرحلة الثانية)
   تُفعَّل فقط عند تعبئة js/config.js برابط المشروع والمفتاح العام (anon / publishable).
   لا يوضع مفتاح service_role هنا أبداً.
   كل حفظ يمر عبر الدالة itqan_apply في قاعدة البيانات، وتطبّق سياسات RLS على كل سطر.
   ========================================================= */
(function (root) {
  'use strict';

  const CORE_EMP = ['id', 'name', 'role', 'specialty', 'year', 'school', 'nationalId'];
  const SERVER_EMP = ['linked', 'inviteCode', 'inviteExpiresAt', 'createdAt', 'updatedAt'];

  function cfg() { return root.ITQAN_CONFIG || {}; }
  function configured() {
    const c = cfg();
    return !!(c.supabaseUrl && c.supabaseAnonKey && /^https?:\/\//.test(c.supabaseUrl));
  }
  function errMsg(e) {
    if (!e) return 'خطأ غير معروف';
    const m = e.message || e.msg || e.error_description || String(e);
    const IQ = {
      ITQAN_APPROVAL_LOCKED: 'الاعتماد النهائي يتم بعد إقرار الموظف عبر «اعتماد التقييم النهائي» فقط',
      ITQAN_REAUTH: 'لأمان التوقيع: أعيدي إدخال كلمة المرور ثم حاولي مرة أخرى',
      ITQAN_INCOMPLETE: 'التقييم غير مكتمل؛ أكملي درجات جميع العناصر قبل الإرسال',
      ITQAN_ALREADY_SENT: 'هذه النسخة مرسلة للموظف مسبقاً وبانتظار إقراره',
      ITQAN_ALREADY_APPROVED: 'التقييم معتمد نهائياً؛ أعيدي فتحه للتعديل أولاً',
      ITQAN_NOT_AWAITING: 'هذا التقييم ليس بانتظار إقرارك حالياً',
      ITQAN_CHANGED: 'تغيّر التقييم بعد إرساله؛ يلزم إرسال النسخة الجديدة للإقرار',
      ITQAN_CONFIRM: 'يلزم تأكيد استخدام التوقيع صراحةً',
      ITQAN_SIGNATURE: 'يلزم توقيع صالح محفوظ لحسابك',
      ITQAN_NOTE_REQUIRED: 'اكتبي الملاحظة',
      ITQAN_NOT_ACKED: 'لا يمكن الاعتماد قبل إقرار الموظف',
      ITQAN_BAD_STATE: 'لا يمكن تنفيذ هذا الإجراء في حالة التقييم الحالية',
      ITQAN_UPLOAD_NOT_ALLOWED: 'رفع صورة التوقيع غير مسموح؛ ارسمي توقيعك',
      ITQAN_NO_FILE: 'لا يوجد ملف تقييم لهذا الموظف',
      ITQAN_FORBIDDEN: 'لا تملكين صلاحية هذه العملية',
      ITQAN_NO_IDENTITY: 'تعذّر ربط حسابك برقم الهوية؛ تواصلي مع إدارة المدرسة',
      ITQAN_PLAN_LOCKED: 'تحديث هذه الخطة غير متاح لك؛ تتابعها الإدارة',
    };
    const code = (m.match(/ITQAN_[A-Z_]+/) || [])[0];
    if (code && IQ[code]) return IQ[code];
    if (/signatures_data_check/.test(m)) return 'صورة التوقيع غير صالحة أو كبيرة الحجم';
    if (/Invalid login credentials/i.test(m)) return 'الرقم الوزاري أو رقم الهوية أو كلمة المرور غير صحيحة';
    if (/Email address .* invalid|email_address_invalid/i.test(m)) return 'أوقفي «Confirm email» في إعدادات Supabase ← Authentication ثم أعيدي المحاولة';
    if (/Signups not allowed|signup_disabled/i.test(m)) return 'التسجيل مغلق في إعدادات Supabase (Allow new users to sign up)';
    if (/over_request_rate_limit|over_email_send_rate_limit|Request rate limit/i.test(m)) return 'محاولات كثيرة من الشبكة نفسها؛ انتظري دقائق ثم أعيدي المحاولة';
    if (/Email not confirmed/i.test(m)) return 'لم يُؤكَّد البريد بعد. افتحي رسالة التأكيد في بريدك';
    if (/already registered|already exists/i.test(m)) return 'يوجد حساب بهذا الرقم الوزاري ورقم الهوية. سجّلي الدخول';
    if (/at least 6 characters|weak_password/i.test(m)) return 'كلمة المرور قصيرة (6 أحرف على الأقل)';
    if (/Failed to fetch|NetworkError|network/i.test(m)) return 'تعذّر الاتصال بالخادم. تحققي من الإنترنت';
    if (/row-level security|permission denied|غير مصرح/i.test(m)) return 'لا تملكين صلاحية هذه العملية';
    if (/rate limit/i.test(m)) return 'محاولات كثيرة، انتظري قليلاً ثم أعيدي المحاولة';
    return m;
  }
  const PLAN_COLS = 'id,employee_id,item_id,item_label,eval_year,score,selections,duration,owner_name,indicator,follow_date,approved_at,updated_at,plan_type,goal,start_date,end_date,measure_method,status,follow_notes,follow_results,employee_can_update';
  const PLAN_COLS_6 = 'id,employee_id,item_id,item_label,eval_year,score,selections,duration,owner_name,indicator,follow_date,approved_at,updated_at';
  async function must(p) {
    const { data, error } = await p;
    if (error) throw error;
    return data;
  }

  /* ---------- تحويل السجلات ---------- */
  function empFromRow(r) {
    const extra = r.extra || {};
    return { ...extra, id: r.id, name: r.name, role: r.role, specialty: r.specialty || '', year: r.year || '', school: r.school_name || '', nationalId: r.national_id || '',
      linked: !!r.user_id, inviteCode: r.invite_code || null, inviteExpiresAt: r.invite_expires_at || null, createdAt: r.created_at, updatedAt: r.updated_at };
  }
  function empPayload(e) {
    const extra = {};
    Object.keys(e).forEach((k) => { if (!CORE_EMP.includes(k) && !SERVER_EMP.includes(k)) extra[k] = e[k]; });
    return { id: e.id, name: e.name, role: e.role, specialty: e.specialty || '', year: e.year || '', school_name: e.school || '', national_id: e.nationalId || '', extra };
  }
  function evFromRow(r) {
    return { id: r.id, employeeId: r.employee_id, itemId: r.item_id, itemLabel: r.item_label, title: r.title, url: r.url,
      archived: !!r.archived, archivedAt: r.archived_at, addedBy: r.added_by, createdAt: r.created_at, updatedAt: r.updated_at };
  }
  function evPayload(x) {
    const o = { id: x.id, employee_id: x.employeeId, item_id: x.itemId || null, item_label: x.itemLabel || '', title: x.title, url: x.url,
      archived: !!x.archived, archived_at: x.archivedAt || null, added_by: x.addedBy === 'employee' ? 'employee' : 'principal', created_at: x.createdAt || null };
    return o;
  }
  function filePayload(id, f) { return { employee_id: id, status: f.status === 'approved' ? 'approved' : 'draft', data: f }; }
  const J = (o) => JSON.stringify(o);

  /* الفرق بين حالتين → دفعة تغييرات، أو null إذا لا تغيير */
  function diff(before, after) {
    const p = {};
    const sB = { name: before.settings.schoolName || '', settings: before.settings, admin_defaults: before.adminDefaults };
    const sA = { name: after.settings.schoolName || '', settings: after.settings, admin_defaults: after.adminDefaults };
    if (J(sB) !== J(sA)) p.school = sA;
    const tpl = Object.keys(after.templates || {}).filter((r) => J((before.templates || {})[r]) !== J(after.templates[r])).map((r) => ({ role: r, data: after.templates[r] }));
    if (tpl.length) p.templates = tpl;
    const bE = new Map(before.employees.map((e) => [e.id, J(empPayload(e))]));
    const aE = new Map(after.employees.map((e) => [e.id, e]));
    const eu = after.employees.filter((e) => bE.get(e.id) !== J(empPayload(e))).map(empPayload);
    const ed = before.employees.filter((e) => !aE.has(e.id)).map((e) => e.id);
    if (eu.length) p.employees_upsert = eu;
    if (ed.length) p.employees_delete = ed;
    const fu = Object.keys(after.files).filter((id) => aE.has(id) && J(before.files[id]) !== J(after.files[id])).map((id) => filePayload(id, after.files[id]));
    if (fu.length) p.files_upsert = fu;
    const bV = new Map(before.evidence.map((x) => [x.id, J(evPayload(x))]));
    const aV = new Set(after.evidence.map((x) => x.id));
    const vu = after.evidence.filter((x) => bV.get(x.id) !== J(evPayload(x))).map(evPayload);
    const vd = before.evidence.filter((x) => !aV.has(x.id)).map((x) => x.id);
    if (vu.length) p.evidence_upsert = vu;
    if (vd.length) p.evidence_delete = vd;
    return Object.keys(p).length ? p : null;
  }

  const Cloud = {
    sb: null, me: null, user: null,
    configured, errMsg, diff, empPayload, evPayload,
    init() {
      if (!root.supabase || typeof root.supabase.createClient !== 'function') throw new Error('مكتبة Supabase لم تُحمَّل');
      const c = cfg();
      const key = c.supabaseAnonKey.trim();
      const opts = { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'itqan-auth' } };
      /* المفاتيح الجديدة (sb_publishable_...) ليست JWT: تُرسل في ترويسة apikey فقط، ولا تُرسل كـ Bearer
         (المكتبة ترسلها كـ Bearer عند عدم وجود جلسة، وترفضها المنصة بخطأ Invalid JWT) */
      if (/^sb_/.test(key)) {
        const baseFetch = root.fetch.bind(root);
        opts.global = { fetch: (input, init = {}) => {
          const h = new Headers(init.headers || (input instanceof Request ? input.headers : undefined));
          if (h.get('Authorization') === 'Bearer ' + key) h.delete('Authorization');
          return baseFetch(input, { ...init, headers: h });
        } };
      }
      this.sb = root.supabase.createClient(c.supabaseUrl.trim().replace(/\/(rest|auth)\/v1\/?$/, '').replace(/\/+$/, ''), key, opts);
      return this.sb;
    },
    async session() { const { data } = await this.sb.auth.getSession(); this.user = data.session ? data.session.user : null; return data.session; },
    onAuth(fn) { return this.sb.auth.onAuthStateChange(fn); },
    async signIn(email, password) { const d = await must(this.sb.auth.signInWithPassword({ email, password })); this.user = d.user; return d; },
    async signUp(email, password) {
      const d = await must(this.sb.auth.signUp({ email, password, options: { emailRedirectTo: root.location.origin + root.location.pathname } }));
      this.user = d.user; return d; // d.session = null عند تفعيل تأكيد البريد
    },
    async signOut() { try { await this.sb.auth.signOut(); } catch (e) { /* */ } this.user = null; this.me = null; this.identityId = null; this.nidLast3 = null; this.sigStorage = undefined; },
    async resetPassword(email) { return must(this.sb.auth.resetPasswordForEmail(email, { redirectTo: root.location.origin + root.location.pathname })); },
    async updatePassword(password) { return must(this.sb.auth.updateUser({ password })); },
    /* الدخول بالرقم الوزاري ورقم الهوية: يُشتق بريد داخلي لا يُرسل إليه شيء (يطابق itqan_login_email في SQL) */
    loginEmail(ministry, nid) { return `${String(nid).trim()}.${String(ministry).trim()}@itqan.local`; },
    async signInId(ministry, nid, password) { return this.signIn(this.loginEmail(ministry, nid), password); },
    async registerSchool({ name, ministry, adminName, adminNid, password }, settings, templates, adminDefaults) {
      const free = await must(this.sb.rpc('itqan_school_available', { p_ministry: ministry }));
      const email = this.loginEmail(ministry, adminNid);
      if (!free) throw new Error('هذا الرقم الوزاري مسجّل مسبقاً. إن كنتِ مسؤولة النظام فسجّلي الدخول');
      try { const d = await this.signUp(email, password); if (!d.session) await this.signIn(email, password); }
      catch (e) { if (/already registered|already exists/i.test(e.message || '')) await this.signIn(email, password); else throw e; }
      const arr = Object.entries(templates).map(([role, data]) => ({ role, data }));
      return must(this.sb.rpc('itqan_register_school', { p_name: name, p_ministry: ministry, p_admin_name: adminName, p_admin_nid: adminNid, p_settings: settings, p_templates: arr, p_admin_defaults: adminDefaults }));
    },
    /* تفعيل حساب موظف أو تعيين كلمة مرور جديدة برمز من المديرة */
    async activate({ ministry, nid, code, password }) {
      const chk = await must(this.sb.rpc('itqan_check_activation', { p_ministry: ministry, p_nid: nid, p_code: code }));
      const email = this.loginEmail(ministry, nid);
      if (chk.account_exists) {
        await must(this.sb.rpc('itqan_set_password_with_code', { p_ministry: ministry, p_nid: nid, p_code: code, p_password: password }));
        await this.signIn(email, password);
      } else {
        const d = await this.signUp(email, password);
        if (!d.session) await this.signIn(email, password);
      }
      if (!chk.linked) await must(this.sb.rpc('itqan_activate', { p_ministry: ministry, p_nid: nid, p_code: code }));
      return chk;
    },
    async whoami() { this.me = await must(this.sb.rpc('itqan_whoami')); return this.me; },
    async createSchool(name, settings, templates, adminDefaults) {
      const arr = Object.entries(templates).map(([role, data]) => ({ role, data }));
      return must(this.sb.rpc('itqan_create_school', { p_name: name, p_settings: settings, p_templates: arr, p_admin_defaults: adminDefaults }));
    },
    async claim(code) { return must(this.sb.rpc('itqan_claim_invite', { p_code: code })); },
    async issueInvite(empId) { return must(this.sb.rpc('itqan_issue_invite', { p_employee: empId })); },
    async revoke(empId) { return must(this.sb.rpc('itqan_revoke_access', { p_employee: empId })); },
    async fetchAll(table, cols, schoolId) {
      const out = []; const size = 1000;
      for (let from = 0; ; from += size) {
        let q = this.sb.from(table).select(cols).range(from, from + size - 1);
        if (schoolId) q = q.eq('school_id', schoolId);
        const rows = await must(q);
        out.push(...rows);
        if (rows.length < size) break;
      }
      return out;
    },
    /* تحميل بيانات المدرسة كاملة للمديرة بنفس بنية النسخة المحلية */
    async loadPrincipal(schoolId, excelTemplates) {
      const [school, tpls, emps, files, evs] = await Promise.all([
        must(this.sb.from('schools').select('id,name,ministry_no,settings,admin_defaults').eq('id', schoolId).single()),
        this.fetchAll('templates', 'role,data', schoolId),
        this.fetchAll('employees', 'id,name,role,specialty,year,school_name,national_id,extra,user_id,invite_code,invite_expires_at,created_at,updated_at', schoolId),
        this.fetchAll('evaluation_files', 'employee_id,status,data', schoolId),
        this.fetchAll('evidence', 'id,employee_id,item_id,item_label,title,url,archived,archived_at,added_by,created_at,updated_at', schoolId),
      ]);
      const templates = { ...excelTemplates };
      tpls.forEach((t) => { templates[t.role] = t.data; });
      const fileMap = {};
      files.forEach((f) => { fileMap[f.employee_id] = { ...f.data, status: f.status }; });
      return {
        meta: { schema: 1, storage: 'supabase', schoolId },
        settings: { ...(school.settings || {}), schoolName: school.name, ministryNo: school.ministry_no || '' },
        templates, adminDefaults: school.admin_defaults || { shares: { goals: 50, comp: 50 } },
        employees: emps.map(empFromRow), files: fileMap, evidence: evs.map(evFromRow),
      };
    },
    /* بيانات الموظف: سجله، وشواهده، وملفه إن كان معتمداً، وأسماء عناصره فقط */
    async loadEmployee(me) {
      const [school, emps, files, evs, items] = await Promise.all([
        must(this.sb.from('schools').select('id,name,ministry_no,settings,admin_defaults').eq('id', me.school_id).single()),
        must(this.sb.from('employees').select('id,name,role,specialty,year,school_name,national_id,extra,user_id,created_at,updated_at')),
        must(this.sb.from('evaluation_files').select('employee_id,status,data')),
        must(this.sb.from('evidence').select('id,employee_id,item_id,item_label,title,url,archived,archived_at,added_by,created_at,updated_at')),
        must(this.sb.rpc('itqan_my_items')),
      ]);
      const fileMap = {};
      files.forEach((f) => { fileMap[f.employee_id] = { ...f.data, status: f.status }; });
      return {
        meta: { schema: 1, storage: 'supabase', schoolId: me.school_id, employeeMode: true },
        settings: { ...(school.settings || {}), schoolName: school.name, ministryNo: school.ministry_no || '' },
        templates: {}, adminDefaults: school.admin_defaults || {},
        employees: emps.map(empFromRow), files: fileMap, evidence: evs.map(evFromRow),
        portalItems: (items || []).map((i) => ({ id: i.id, label: i.label, group: i.grp })),
      };
    },
    /* تحديث حالة الحساب لموظف (قد يكون فعّل حسابه بعد تحميل الصفحة) */
    async accessState(empId) {
      const r = await must(this.sb.from('employees').select('user_id,invite_code,invite_expires_at').eq('id', empId).single());
      return { linked: !!r.user_id, inviteCode: r.invite_code || null, inviteExpiresAt: r.invite_expires_at || null };
    },
    /* ---------- مالك النظام ---------- */
    ownerEmail(nid) { return `owner.${String(nid).trim()}@itqan.local`; },
    async ownerSignIn(nid, password) { return this.signIn(this.ownerEmail(nid), password); },
    async ownerSignUp(nid, password) {
      const d = await this.signUp(this.ownerEmail(nid), password);
      if (!d.session) await this.signIn(this.ownerEmail(nid), password);
      return d;
    },
    async ownerList() { return must(this.sb.rpc('itqan_owner_list_schools')); },
    async ownerSetStatus(id, status) { return must(this.sb.rpc('itqan_owner_set_status', { p_school: id, p_status: status })); },
    async ownerUpdate(id, name, adminName) { return must(this.sb.rpc('itqan_owner_update_school', { p_school: id, p_name: name, p_admin_name: adminName })); },
    async ownerDelete(id, ministry) { return must(this.sb.rpc('itqan_owner_delete_school', { p_school: id, p_confirm_ministry: ministry })); },
    async ownerResetAdmin(id, password) { return must(this.sb.rpc('itqan_owner_reset_admin_password', { p_school: id, p_password: password })); },
    async principalSetPassword(empId, password) { return must(this.sb.rpc('itqan_principal_set_password', { p_employee: empId, p_password: password })); },
    /* ---------- الملاحظات والرسائل ---------- */
    /* دورة الإقرار والتوقيع والاعتماد (كل انتقال عبر دوال الخادم) */
    async uid() { const { data } = await this.sb.auth.getSession(); return data && data.session ? data.session.user.id : null; },
    async reauth(password) {
      const { data } = await this.sb.auth.getSession();
      const email = data && data.session ? data.session.user.email : null;
      if (!email) throw new Error('انتهت الجلسة؛ سجّلي الدخول من جديد');
      const { error } = await this.sb.auth.signInWithPassword({ email, password });
      if (error) throw new Error(/Invalid login/i.test(error.message) ? 'كلمة المرور غير صحيحة' : errMsg(error));
    },
    /* التوقيع الشخصي بحسب هوية الحساب الموثّق (لا بحسب المدرسة ولا المتصفح). الصور الجديدة في Storage خاصة */
    async sigImage(path) {
      const { data, error } = await this.sb.storage.from('signatures').download(path);
      if (error || !data) return null;
      const buf = new Uint8Array(await data.arrayBuffer()); let bin = '';
      for (let k = 0; k < buf.length; k += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(k, k + 0x8000));
      return `data:${data.type || 'image/png'};base64,${btoa(bin)}`;
    },
    async mySignature() {
      const { data, error } = await this.sb.rpc('itqan_my_signature');
      if (error) {
        if (!/itqan_my_signature|schema cache|does not exist|function/i.test(error.message || '')) throw error;
        // قبل تطبيق update-008: التوقيع المحفوظ داخل الجدول لهذا الحساب

  async function onAuthSubmit(form) {
    const raw = (id) => { const el = form.querySelector('#' + id); return el ? el.value.trim() : ''; };
    const stage = form.dataset.stage;
    const btn = form.querySelector('button[type=submit]');
    AUTH.err = ''; AUTH.msg = '';
    AUTH.form = { a_min: raw('a_min'), a_nid: raw('a_nid'), a_code: raw('a_code'), r_name: raw('r_name'), r_admin: raw('r_admin'), r_year: raw('r_year') };
    const fail = (m) => { AUTH.err = m; render(); };
    const ministry = L.toLatinDigits(raw('a_min')), nid = L.normNid(raw('a_nid'));
    const pw = (form.querySelector('#a_pw') || {}).value || '', pw2 = (form.querySelector('#a_pw2') || {}).value;
    const ownerStage = stage === 'owner' || stage === 'owner-signup';
    if (!ownerStage && !L.isMinistryNo(ministry)) return fail('الرقم الوزاري أرقام فقط (3 إلى 12 رقماً)');
    if (!L.isNid(nid)) return fail('رقم الهوية 10 أرقام يبدأ بـ 1 أو 2');
    if (stage === 'login' || stage === 'owner') { if (!pw) return fail('أدخلي كلمة المرور'); }
    else { if (pw.length < 8) return fail('كلمة المرور 8 أحرف على الأقل'); if (pw !== pw2) return fail('كلمتا المرور غير متطابقتين'); }
    if (btn) btn.disabled = true;
    try {
      if (stage === 'login') {
        await C.signInId(ministry, nid, pw); AUTH.form = {}; await afterLogin();
      } else if (stage === 'owner') {
        await C.ownerSignIn(nid, pw); AUTH.form = {};
        const me = await C.whoami();
        if (!me.is_owner) { AUTH.ownerNid = nid; AUTH.stage = 'owner-grant'; render(); return; }
        await afterLogin();
      } else if (stage === 'owner-signup') {
        await C.ownerSignUp(nid, pw); AUTH.form = {};
        const me = await C.whoami();
        if (me.is_owner) await afterLogin(); else { AUTH.ownerNid = nid; AUTH.stage = 'owner-grant'; render(); }
      } else if (stage === 'activate') {
        if (raw('a_code').length < 6) return fail('أدخلي رمز التفعيل');
        const r = await C.activate({ ministry, nid, code: raw('a_code'), password: pw });
        AUTH.form = {};
        toast(r.linked ? 'عُيّنت كلمة المرور الجديدة.' : `فُعّل حسابك وربط بسجل «${r.name}».`);
        await afterLogin();
      } else if (stage === 'register') {
        if (raw('r_name').length < 3) return fail('اكتبي اسم المدرسة');
        if (raw('r_admin').length < 3) return fail('اكتبي اسم مسؤول النظام');
        await C.registerSchool({ name: raw('r_name'), ministry, adminName: raw('r_admin'), adminNid: nid, password: pw },
          { schoolName: raw('r_name'), principalName: raw('r_admin'), year: raw('r_year'), stage: '', statNo: '', office: '', evaluator: '', logo: null },
          S.templatesFromExcel(), { shares: { goals: 50, comp: 50 } });
        AUTH.form = {};
        await afterLogin();
      }
    } catch (e) { fail(C.errMsg(e)); }
    finally { if (btn && document.body.contains(btn)) btn.disabled = false; }
  }

  /* ---------- نقل البيانات المحلية إلى السحابة (دون التجريبية) ---------- */
  async function migrateLocal() {
    const loc = S.load().db;
    if (!loc || !loc.employees) { toast('لا توجد بيانات محلية محفوظة في هذا المتصفح.', 'warn'); return; }
    const real = loc.employees.filter((e) => !e.demo);
    const demoN = loc.employees.length - real.length;
    const keys = new Set(DB.employees.map(L.dupKey));
    const add = real.filter((e) => !keys.has(L.dupKey(e)));
    const ids = new Set(add.map((e) => e.id));
    const evs = loc.evidence.filter((x) => !x.demo && ids.has(x.employeeId));
    if (!add.length) { toast(`لا يوجد ما يُنقل: ${real.length ? 'كل الموظفين الحقيقيين موجودون مسبقاً' : 'لا توجد بيانات حقيقية'}${demoN ? `، و${demoN} تجريبي لا يُنقل` : ''}.`, 'warn'); return; }
    const yes = await confirmBox({ title: 'نقل البيانات من هذا المتصفح', ok: 'نقل إلى قاعدة البيانات',
      text: `سيُضاف ${add.length} موظف مع ملفات تقييمهم و${evs.length} شاهد. يُستبعد ${demoN} موظف تجريبي، و${real.length - add.length} موظف موجود مسبقاً (لا يُستبدل). البيانات المحلية تبقى كما هي.` });
    if (!yes) return;
    await commit((db) => {
      add.forEach((e) => {
        const nid = L.uid('emp'); const ne = { ...e, id: nid }; delete ne.demo;
        db.employees.push(ne);
        const f = loc.files[e.id] ? clone(loc.files[e.id]) : (e.role === 'admin' ? L.newAdminFile(db.adminDefaults.shares) : L.newRoleFile(e.role, db.templates[e.role]));
        delete f.demo; db.files[nid] = f;
        evs.filter((x) => x.employeeId === e.id).forEach((x) => { const nx = { ...x, id: L.uid('ev'), employeeId: nid }; delete nx.demo; db.evidence.push(nx); });
      });

  async function sendMessage(empId, topic, body, form) {

  /* المسميات الوظيفية المخصصة في المدرسة: من الإعدادات ومن الموظفين الحاليين */
  function savedTitles() {
    const m = new Map();
    Object.entries((DB.settings && DB.settings.jobTitles) || {}).forEach(([t, r]) => m.set(t, r));
    DB.employees.forEach((x) => { if (x.jobTitle && !m.has(x.jobTitle)) m.set(x.jobTitle, x.role); });
    return [...m.entries()].map(([title, role]) => ({ title, role })).sort((a, b) => a.title.localeCompare(b.title, 'ar'));
  }
  function employeeForm(e, presetRole) {
    const s = DB.settings;

    const locked = !!(f && (f.kind === 'admin' ? (f.goals.length + f.comps.length) > 0 : f.items.some((i) => L.isScore(i.score))));
    const role = e ? e.role : (presetRole || 'teacher');

    const custom = cur.startsWith('t:');
    return `<div class="fgrid">
      <div class="field span2"><label for="m_name">الاسم</label><input id="m_name" name="name" required maxlength="120" value="${esc(e?.name)}" autocomplete="off"><span class="err" id="m_name_err"></span></div>

        ${L.ROLES.map((r) => `<option value="r:${r.key}" ${cur === 'r:' + r.key ? 'selected' : ''} ${locked && r.key !== role ? 'disabled' : ''}>${r.label}</option>`).join('')}
        ${titles.length ? `<optgroup label="مسميات المدرسة">${titles.map((t) => `<option value="t:${esc(t.title)}" data-role="${t.role}" ${cur === 't:' + t.title ? 'selected' : ''} ${locked && t.role !== role ? 'disabled' : ''}>${esc(t.title)}</option>`).join('')}</optgroup>` : ''}
        <option value="other">أخرى</option></select></div>
      <div class="field" id="m_cat_wrap" ${custom ? '' : 'hidden'}><label for="m_cat">فئة التقييم</label><select id="m_cat" name="category" ${locked ? 'disabled' : ''}>${L.ROLES.map((r) => `<option value="${r.key}" ${role === r.key ? 'selected' : ''}>${r.label}</option>`).join('')}</select></div>
      <div class="field span2" id="m_other_wrap" hidden><label for="m_jobtitle">اكتب المسمى الوظيفي</label><input id="m_jobtitle" name="jobTitle" maxlength="80" placeholder="مثال: منسقة الجودة، أمينة مصادر التعلم، فنية دعم" autocomplete="off"><span class="err" id="m_jobtitle_err"></span></div>
      <div class="field"><label for="m_nid">رقم الهوية</label><input id="m_nid" name="nationalId" class="ltr" inputmode="numeric" maxlength="10" value="${esc(e?.nationalId)}" autocomplete="off"><span class="err" id="m_nid_err"></span></div>
      <div class="field"><label for="m_spec">التخصص</label><input id="m_spec" name="specialty" maxlength="80" value="${esc(e?.specialty)}"></div>
      <div class="field"><label for="m_year">العام الدراسي</label><input id="m_year" name="year" maxlength="30" value="${esc(e ? e.year : s.year)}" placeholder="مثال: 1448هـ"></div>
      <div class="field"><label for="m_school">المدرسة</label><input id="m_school" name="school" maxlength="120" value="${esc(e ? e.school : s.schoolName)}"></div>
    </div>`;
  }
  function openEmployeeModal(id, presetRole) {
    const e = id ? emp(id) : null;
    openModal({
      title: e ? 'تعديل بيانات موظف' : 'إضافة موظف',
      body: employeeForm(e, presetRole),
      onChange: (k, v) => {
        if (k !== 'title') return;
        const isCustom = v === 'other' || v.startsWith('t:');
        $('m_cat_wrap').hidden = !isCustom; $('m_other_wrap').hidden = v !== 'other';
        if (v.startsWith('t:')) { const o = $('m_title').selectedOptions[0]; if (o && o.dataset.role && !$('m_cat').disabled) $('m_cat').value = o.dataset.role; }
        if (v === 'other') $('m_jobtitle').focus();
      },
      foot: `<button class="btn primary" type="submit">${ic('check', 'sm')} ${e ? 'حفظ التعديل' : 'إضافة'}</button><button class="btn ghost" type="button" data-act="modal-close">إلغاء</button>`,
      onSubmit: async (fd) => {
        const sel = String(fd.get('titleSel') || '');
        let role = sel.startsWith('r:') ? sel.slice(2) : (fd.get('category') || (e && e.role) || 'teacher');
        let jobTitle = sel.startsWith('t:') ? sel.slice(2) : sel === 'other' ? L.cleanTitle(fd.get('jobTitle')) : '';
        $('m_jobtitle_err').textContent = '';
        if (sel === 'other' && !jobTitle) { $('m_jobtitle_err').textContent = L.isOther(fd.get('jobTitle')) ? 'اكتبي المسمى الفعلي بدل «أخرى»' : 'اكتبي المسمى الوظيفي'; return false; }
        if (jobTitle && L.isRoleName(jobTitle)) jobTitle = '';
        if (e && e.role !== role && $('m_cat') && $('m_cat').disabled) role = e.role;
        const data = { name: String(fd.get('name') || '').replace(/\s+/g, ' ').trim(), role, jobTitle, specialty: String(fd.get('specialty') || '').trim(), year: String(fd.get('year') || '').trim(), school: String(fd.get('school') || '').trim() };
        if (data.name.length < 3) { $('m_name_err').textContent = 'أدخلي الاسم كاملاً'; return false; }
        data.nationalId = L.normNid(fd.get('nationalId'));
        $('m_nid_err').textContent = '';
        if (data.nationalId && !L.isNid(data.nationalId)) { $('m_nid_err').textContent = 'رقم الهوية 10 أرقام يبدأ بـ 1 أو 2'; return false; }
        if (data.nationalId && DB.employees.some((x) => x.id !== (e && e.id) && L.normNid(x.nationalId) === data.nationalId)) { $('m_nid_err').textContent = 'رقم الهوية مسجّل لموظف آخر'; return false; }
        const k = L.dupKey(data);
        const dup = DB.employees.find((x) => x.id !== (e && e.id) && L.dupKey(x) === k);
        if (dup) { $('m_name_err').textContent = 'يوجد موظف بالاسم والدور والعام والمدرسة نفسها. لم يُحفظ.'; return false; }
        const ok = await commit((db) => {
          if (jobTitle) { db.settings.jobTitles = { ...(db.settings.jobTitles || {}), [jobTitle]: role }; }
          if (e) {
            const t = db.employees.find((x) => x.id === e.id);
            const roleChanged = t.role !== data.role;
            Object.assign(t, data, { updatedAt: nowIso() });
            if (roleChanged) db.files[t.id] = data.role === 'admin' ? L.newAdminFile(db.adminDefaults.shares) : L.newRoleFile(data.role, db.templates[data.role]);
          } else {
            const nid = L.uid('emp');
            db.employees.push({ id: nid, ...data, createdAt: nowIso() });
            db.files[nid] = data.role === 'admin' ? L.newAdminFile(db.adminDefaults.shares) : L.newRoleFile(data.role, db.templates[data.role]);
          }
        }, e ? 'حُفظت بيانات الموظف.' : `أُضيف «${data.name}» وأُنشئ ملف تقييمه.`);
        return !!ok;
      },
    });
  }
  async function deleteEmployee(id) {
    const e = emp(id); if (!e) return;
    const evN = DB.evidence.filter((x) => x.employeeId === id).length;
    const yes = await confirmBox({ title: 'حذف موظف', text: `سيُحذف «${esc(e.name)}» وملف تقييمه و${evN} شاهد مرتبط به من هذا المتصفح. لا يمكن التراجع.`, ok: 'حذف نهائي', danger: true });
    if (!yes) return;
    commit((db) => { db.employees = db.employees.filter((x) => x.id !== id); delete db.files[id]; db.evidence = db.evidence.filter((x) => x.employeeId !== id); }, 'حُذف الموظف وملفه.');
    if (route().view === 'file') location.hash = 'employees';
  }

  /* ---------- ملف الموظف ---------- */
  function evidenceList(empId, itemId, { canEdit = true, portal = false } = {}) {
    const list = DB.evidence.filter((x) => x.employeeId === empId && x.itemId === itemId && !x.archived);
    const items = list.map((x) => evCard(x, { canEdit: canEdit && (!portal || x.addedBy === 'employee'), portal, compact: true })).join('');
    return `<div class="evs">${items || '<span class="muted small">لا توجد شواهد لهذا العنصر.</span>'}
      ${canEdit ? `<div><button class="btn xs" type="button" data-act="ev-add" data-emp="${empId}" data-item="${itemId}" ${portal ? 'data-portal="1"' : ''}>${ic('link', 'sm')} إضافة رابط شاهد</button></div>` : ''}</div>`;
  }
  /* نوع الشاهد من رابطه (للعرض فقط) */
  function evType(url) {
    let h = '', p = '';
    try { const u = new URL(url); h = u.hostname.replace(/^www\./, ''); p = u.pathname.toLowerCase(); } catch (e) { return { label: 'رابط', icon: 'link' }; }
    if (/docs\.google\.com$/.test(h)) return p.includes('/spreadsheets') ? { label: 'جدول Google', icon: 'sheet' } : p.includes('/presentation') ? { label: 'عرض تقديمي', icon: 'file' } : p.includes('/forms') ? { label: 'نموذج Google', icon: 'clip' } : { label: 'مستند Google', icon: 'file' };
    if (/drive\.google\.com$/.test(h)) return p.includes('/folders') ? { label: 'مجلد Drive', icon: 'archive' } : { label: 'ملف Drive', icon: 'file' };
    if (/(youtube\.com|youtu\.be)$/.test(h)) return { label: 'فيديو', icon: 'eye' };
    if (/(onedrive\.live\.com|sharepoint\.com|1drv\.ms)$/.test(h)) return { label: 'ملف OneDrive', icon: 'file' };
    if (/\.pdf$/.test(p)) return { label: 'ملف PDF', icon: 'file' };
    if (/\.(png|jpe?g|webp|gif)$/.test(p)) return { label: 'صورة', icon: 'image' };
    if (/\.(docx?|xlsx?|pptx?)$/.test(p)) return { label: 'ملف مكتبي', icon: 'file' };
    return { label: 'رابط', icon: 'link' };
  }
  function evCard(x, { canEdit = true, portal = false, showEmp = false, compact = false } = {}) {
    const q = qrUrl(x.url);
    const e = showEmp ? emp(x.employeeId) : null;
    if (compact) {
      // داخل صفحات التقييم: اسم الشاهد ونوعه ورمز QR وزر «عرض»، دون إظهار الرابط كنص
      const t = evType(x.url);
      return `<div class="ev ev-c ${x.archived ? 'arch' : ''}">
        ${q ? `<button type="button" class="qr-btn" data-act="qr-view" data-id="${x.id}" aria-label="تكبير رمز QR: ${esc(x.title)}"><img class="qr" src="${q}" alt=""></button>` : '<span class="qr-na">—</span>'}
        <div class="ev-main"><b>${esc(x.title)}</b>${demoTag(x)}
          <div class="ev-meta"><span class="ev-type">${ic(t.icon, 'sm')} ${t.label}</span>${showEmp ? `<span>${e ? esc(e.name) + ' · ' : ''}${x.archived ? 'مؤرشف — كان مرتبطاً بـ: ' : 'العنصر: '}${esc(x.itemLabel || '—')}</span>` : ''}<span>${x.addedBy === 'employee' ? 'أضافه الموظف' : 'أضافته الإدارة'} · ${dateAr(x.createdAt)}</span></div></div>
        <div class="acts"><a class="btn xs primary" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer" data-ev-open="${x.id}">${ic('eye', 'sm')} عرض</a>
          ${canEdit ? `<button class="btn xs" type="button" data-act="ev-edit" data-id="${x.id}" ${portal ? 'data-portal="1"' : ''} aria-label="تعديل">${ic('edit', 'sm')}</button><button class="btn xs danger" type="button" data-act="ev-del" data-id="${x.id}" ${portal ? 'data-portal="1"' : ''} aria-label="حذف">${ic('trash', 'sm')}</button>` : ''}</div>
      </div>`;
    }
    return `<div class="ev ${x.archived ? 'arch' : ''}">
      ${q ? `<img class="qr" src="${q}" alt="رمز QR: ${esc(x.title)}" data-act="qr-view" data-id="${x.id}" role="button" tabindex="0">` : '<span class="muted small">QR غير متاح</span>'}
      <div style="min-width:0"><b>${esc(x.title)}</b>${demoTag(x)}
        <a class="url" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.url)}</a>
        <small>${showEmp && e ? esc(e.name) + ' · ' : ''}${x.archived ? 'مؤرشف — كان مرتبطاً بـ: ' : 'العنصر: '}${esc(x.itemLabel || '—')} · أُضيف ${dateAr(x.createdAt)} · ${x.addedBy === 'employee' ? 'أضافه الموظف' : 'أضافته الإدارة'}</small></div>
      <div class="acts">${canEdit ? `<button class="btn xs" type="button" data-act="ev-edit" data-id="${x.id}" ${portal ? 'data-portal="1"' : ''} aria-label="تعديل">${ic('edit', 'sm')}</button><button class="btn xs danger" type="button" data-act="ev-del" data-id="${x.id}" aria-label="حذف">${ic('trash', 'sm')}</button>` : ''}</div>
    </div>`;
  }
  const PLAN_ST = { '': 'لم يبدأ', progress: 'جارٍ التنفيذ', done: 'مكتمل', needs: 'يحتاج متابعة' };
  const EVAL_TYPES = ['تقييم نهائي', 'تقييم نصفي', 'تقييم متابعة'];
  function selectField(id, label, value, bind, opts, disabled) {
    return `<div class="field"><label for="${id}">${label}</label><select id="${id}" data-bind="${bind}" ${disabled ? 'disabled' : ''}>${opts.map(([v, t]) => `<option value="${esc(v)}" ${String(value || '') === v ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>`;
  }
  const SUG_PLAN = 'تحديد أسباب انخفاض الأداء في هذا العنصر بلقاء فردي.\nبرنامج تطوير موجّه: ورشة أو قراءة مهنية ونماذج تطبيقية.\nزيارة تبادلية أو ملاحظة زميل متميز في العنصر نفسه.\nتطبيق عملي موثّق بالشواهد ومتابعة دورية.';
  function planFields(pref, o, b, dis, empId, kind) {
    const weak = kind === 'items' ? (L.isScore(o.score) && o.score < 3) : false;
    return `${textField(pref + 'pl_' + o.id, 'الإجراءات العلاجية / خطة التحسين', o.plan, b('plan'), { disabled: dis })}
      ${textField(pref + 'fu_' + o.id, 'موعد المتابعة', o.followUp, b('followUp'), { disabled: dis, type: 'date' })}
      ${selectField(pref + 'ps_' + o.id, 'حالة التنفيذ', o.planStatus, b('planStatus'), Object.entries(PLAN_ST), dis)}
      ${textField(pref + 'fr_' + o.id, 'نتائج المتابعة', o.followResult, b('followResult'), { disabled: dis })}
      ${weak && !o.plan && !dis ? `<div class="span2"><button type="button" class="btn xs" data-act="sug-plan" data-emp="${empId}" data-item="${o.id}">إدراج إجراءات علاجية مقترحة</button></div>` : ''}`;
  }

  function textField(id, label, value, bind, { disabled = false, rows = 2, type = 'textarea', hint = '', extra = '' } = {}) {
    if (type === 'textarea') return `<div class="field"><label for="${id}">${label}</label><textarea id="${id}" rows="${rows}" data-bind="${bind}" ${disabled ? 'disabled' : ''}>${esc(value)}</textarea>${hint ? `<span class="hint">${hint}</span>` : ''}${extra}</div>`;
    return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" data-bind="${bind}" ${disabled ? 'disabled' : ''}>${hint ? `<span class="hint">${hint}</span>` : ''}${extra}</div>`;
  }
  function suggestionFor(name) {
    const X = window.ITQAN_EXCEL; const t = X.roles.teacher.items;
    const n = L.normAr(name);
    const idx = t.findIndex((it) => L.normAr(it.name) === n);
    let j = idx;
    if (j < 0 && n === L.normAr('تحسين نتائج المتعلمين')) j = 4;
    if (j < 0) return null;
    return X.suggestions.rows[j] || null;
  }

  function fileHeader(e, f, res) {
    const role = L.roleOf(e.role);
    const lv = res.complete ? res.level : null;
    return `<div class="card"><div class="file-head">
      <span class="avatar">${esc(initials(e.name))}</span>
      <div style="min-width:0"><h1>${esc(e.name)}${demoTag(e)}</h1>
        <div class="meta-list"><span>المسمى الوظيفي: <b>${esc(L.titleOf(e))}</b></span>${e.jobTitle ? `<span>فئة التقييم: <b>${role.label}</b></span>` : ''}<span>المسار: <b>${L.TRACKS[role.track].label}</b></span><span>التخصص: <b>${esc(e.specialty) || '—'}</b></span>
        <span>المدرسة: <b>${esc(e.school || DB.settings.schoolName) || '—'}</b></span><span>العام: <b>${esc(e.year) || '—'}</b></span></div>
        <div class="row" style="margin-top:8px">${statusPill(f)}${f.approvedAt ? `<span class="muted small">اعتُمد ${dateAr(f.approvedAt)}</span>` : ''}
          <button class="btn xs" type="button" data-act="emp-edit" data-id="${e.id}">${ic('edit', 'sm')} البيانات الوظيفية</button>
          <a class="btn xs" href="#reports" data-act="rep-open" data-id="${e.id}">${ic('printer', 'sm')} التقرير</a></div>
      </div>
      <div class="score-big">${lv ? `<b>${f2(res.score)}</b><span>${lv.label}</span>` : `<b>—</b><span>${f.kind === 'admin' ? 'النتيجة تظهر بعد الاكتمال' : `أُدخل ${res.scored} من ${res.total}`}</span>`}</div>
    </div></div>`;
  }
  function approvalCard(e, f, res) {
    if (esOn()) return esignCard(e, f, res);
    const approved = f.status === 'approved';
    const bl = (res.blockers || []).filter(Boolean);
    return `<div class="card"><div class="card-h"><h2>الاعتماد</h2>${statusPill(f)}</div><div class="card-b stack">
      ${approved ? `<div class="note ok">${ic('check', 'sm')}<div>الملف معتمد${f.approvedAt ? ' بتاريخ ' + dateAr(f.approvedAt) : ''}.</div></div>
        <div class="row"><button class="btn" type="button" data-act="unapprove" data-id="${e.id}">${ic('unlock', 'sm')} إعادة فتح للتعديل</button></div>`
      : `${bl.length ? `<div class="small muted"><b>متطلبات الاعتماد:</b><ul class="req">${bl.map((b) => `<li>${esc(b)}</li>`).join('')}</ul></div>` : ''}
        <div class="row"><button class="btn primary" type="button" data-act="approve" data-id="${e.id}" ${bl.length ? 'disabled' : ''}>${ic('check', 'sm')} اعتماد التقييم</button></div>`}
      ${(f.log || []).length ? `<details><summary class="small muted">سجل الملف (${f.log.length})</summary><ul class="small muted">${f.log.slice(-8).reverse().map((l) => `<li>${dateAr(l.at)} — ${esc(l.msg)}</li>`).join('')}</ul></details>` : ''}
    </div></div>`;
  }
  function summaryCard(e, f) {
    const dis = f.status === 'approved';
    const b = (k) => `file|${e.id}|summary||${k}`;
    return `<div class="card"><div class="card-h"><h2>الملخص والتوصية</h2></div><div class="card-b stack">
      <div class="fgrid">
        ${textField('s_str_' + e.id, 'نقاط القوة (إضافة إلى المستخرج تلقائياً)', f.strengths, b('strengths'), { disabled: dis })}
        ${textField('s_imp_' + e.id, 'فرص التحسين', f.improvements, b('improvements'), { disabled: dis })}
        ${textField('s_dev_' + e.id, 'خطة التطوير العامة', f.devPlan, b('devPlan'), { disabled: dis })}
        ${textField('s_rec_' + e.id, 'التوصية النهائية', f.recommendation, b('recommendation'), { disabled: dis })}
        ${textField('s_per_' + e.id, 'فترة التقييم', f.evalPeriod || '', b('evalPeriod'), { disabled: dis, type: 'text' })}
        ${selectField('s_typ_' + e.id, 'نوع التقييم', f.evalType || '', b('evalType'), [['', '—'], ...EVAL_TYPES.map((t) => [t, t])], dis)}
        ${textField('s_dt_' + e.id, 'تاريخ التقييم', f.evalDate || '', b('evalDate'), { disabled: dis, type: 'date' })}
      </div></div></div>`;
  }

  VIEWS.file = (r) => {
    const e = emp(r.id);
    if (!e) return `${pageHead('', 'الملف غير موجود', '')}<div class="card">${emptyState({ icon: 'alert', title: 'لم يُعثر على هذا الموظف', actions: '<a class="btn" href="#employees">منسوبو المدرسة</a>' })}</div>`;
    const f = fileOf(e.id);
    const res = L.fileResult(f);
    const back = e.role === 'admin' ? ['admins', 'شؤون الموظفين — الإداريات'] : ['edu', 'الشؤون التعليمية'];
    const crumb = `<div class="crumb"><a href="#${back[0]}">${back[1]}</a><span>‹</span><span>ملف الأداء</span></div>`;
    const u = unreadCount(e.id);
    const talk = `<div class="card" id="talk"><div class="card-h"><h2>${ic('chat', 'sm')} ملاحظات الموظف والرسائل</h2>${u ? `<span class="badge">${u} جديدة</span>` : ''}<span class="sub">محادثة خاصة بينك وبين ${esc(e.name)}</span></div><div class="card-b">${thread(e.id)}</div></div>`;
    return crumb + fileHeader(e, f, res) + (f.kind === 'admin' ? adminFileBody(e, f, res) : roleFileBody(e, f, res)) + `<div class="grid g-2">${summaryCard(e, f)}${approvalCard(e, f, res)}</div>` + talk + archiveCard(e, f);
  };

  function archiveCard(e, f) {
    const arch = DB.evidence.filter((x) => x.employeeId === e.id && x.archived);
    const items = f.archivedItems || [];
    if (!arch.length && !items.length) return '';
    return `<div class="card"><div class="card-h"><h2>${ic('archive', 'sm')} الأرشيف</h2></div><div class="card-b stack">
      ${items.length ? `<div class="small muted">العناصر المحذوفة: ${items.map((i) => `«${esc(i.name)}» (${dateAr(i.deletedAt)})`).join('، ')}</div>` : ''}
      <div class="evs">${arch.map((x) => evCard(x, { canEdit: true })).join('') || '<span class="muted small">لا شواهد مؤرشفة.</span>'}</div></div></div>`;
  }

  function roleFileBody(e, f, res) {
    const dis = f.status === 'approved';
    const editing = UI.itemEdit[e.id];
    const sumW = L.sumWeights(f.items);
    const weightNote = '';
    if (editing) return itemEditor(e, f) ;
    let lastSec = null;
    const items = f.items.map((it, i) => {
      let pre = '';
      if (it.section && it.section !== lastSec) pre = `<div class="item" style="background:var(--mauve-tint);padding-block:8px"><b class="small" style="color:var(--mauve-strong)">${esc(it.section)}</b></div>`;
      lastSec = it.section || lastSec;
      const evN = DB.evidence.filter((x) => x.employeeId === e.id && x.itemId === it.id && !x.archived).length;
      const sug = suggestionFor(it.name);
      const open = UI.openItems && UI.openItems.has(it.id);
      const b = (k) => `file|${e.id}|items|${it.id}|${k}`;
      return pre + `<div class="item">
        <div class="item-top"><span class="item-no">${i + 1}</span>
          <div class="item-name">${esc(it.name)}<small>الوزن النسبي ${pctTxt(it.weight)}${L.isScore(it.score) ? ` · الدرجة × الوزن = ${f2((it.score * it.weight) / 100)}` : ''}</small></div>
          <div class="scores" role="group" aria-label="درجة ${esc(it.name)}">${[1, 2, 3, 4, 5].map((v) => `<button type="button" class="sbtn" data-act="score" data-emp="${e.id}" data-item="${it.id}" data-v="${v}" aria-pressed="${it.score === v}" ${dis ? 'disabled' : ''} title="${L.LEVELS[5 - v].label}">${v}</button>`).join('')}
            ${L.isScore(it.score) && !dis ? `<button type="button" class="btn xs ghost" data-act="score" data-emp="${e.id}" data-item="${it.id}" data-v="">مسح</button>` : ''}</div>
          ${suggBtn(e.id, it.id)}
        </div>
        ${planSummary(e.id, it.id)}
        <details data-item-id="${it.id}" ${open ? 'open' : ''}><summary>التغذية الراجعة وخطة التحسين والشواهد ${it.feedback || it.plan ? pill('مُدخلة', 'p-mauve') : ''} ${evN ? pill(evN + ' شاهد', 'p-info') : ''} ${it.followUp ? pill('متابعة ' + it.followUp, 'p-mute') : ''}</summary>
          <div class="dbody">
            ${sug && !dis ? `<div class="row small"><span class="muted">نص مقترح من ملف المدرسة (ورقة «صفحه التعديلات»):</span><button type="button" class="btn xs" data-act="use-sug" data-emp="${e.id}" data-item="${it.id}">إدراج المقترح</button></div>` : ''}
            <div class="fgrid">
              ${textField(`jf_${it.id}`, 'مبررات الدرجة وملاحظات الأداء', it.justification, b('justification'), { disabled: dis })}
              ${textField(`fb_${it.id}`, 'التغذية الراجعة', it.feedback, b('feedback'), { disabled: dis })}
              ${planFields('', it, b, dis, e.id, 'items')}
            </div>
            <div class="field"><span class="lab">الشواهد</span>${evidenceList(e.id, it.id)}</div>
          </div></details>
      </div>`;
    }).join('');
    return `${weightNote}
      <div class="card"><div class="card-h"><h2>عناصر التقييم</h2>
        <div class="progress"><span class="num">${res.scored}/${res.total}</span><div class="trk"><div class="fill" style="width:${res.total ? (res.scored / res.total) * 100 : 0}%"></div></div></div>
        <div class="tools"><button class="btn sm" type="button" data-act="items-edit" data-id="${e.id}" ${dis ? 'disabled title="أعيدي فتح الملف للتعديل أولاً"' : ''}>${ic('sliders', 'sm')} تحرير عناصر هذا الملف</button></div></div>
        ${f.items.length ? items : emptyState({ icon: 'sliders', title: 'لا توجد عناصر في هذا الملف' })}
        <div class="card-b" style="border-top:1px solid var(--line)">
          ${res.complete ? `<div class="note ok">${ic('award', 'sm')}<div><b>النتيجة: ${f2(res.score)} من 5 — ${res.level.label}</b><br>
            الطريقة: مجموع (درجة العنصر × وزنه) ÷ مجموع الأوزان = <span class="ltr num">${f2(res.weighted)} ÷ ${res.sumW} = ${f2(res.score)}</span></div></div>`
          : `<div class="small muted">النتيجة: ${res.scored} من ${res.total} عنصر مقيّم.</div>`}
        </div></div>`;
  }

  function itemEditor(e, f) {
    const d = UI.itemEdit[e.id];
    const sum = L.sumWeights(d);
    return `<div class="card"><div class="card-h"><h2>تحرير عناصر ملف «${esc(e.name)}» فقط</h2></div>
      <div class="card-b stack">
        <div class="wsum">مجموع الأوزان <div class="trk"><div class="fill ${Math.abs(sum - 100) < 0.01 ? 'lvl5' : 'lvl2'}" style="width:${Math.min(100, sum)}%"></div></div><b class="num">${pctTxt(sum)}</b>${Math.abs(sum - 100) < 0.01 ? pill('100%', 'p-ok') : pill('لا يساوي 100%', 'p-warn')}</div>
      </div>
      <div class="tbl-wrap"><table class="t"><thead><tr><th>م</th><th>اسم العنصر</th><th>الوزن %</th><th></th></tr></thead><tbody>
        ${d.map((it, i) => `<tr><td class="num muted">${i + 1}</td><td><input id="ie_n_${it.id}" value="${esc(it.name)}" data-ie="${e.id}|${it.id}|name" aria-label="اسم العنصر"></td>
          <td><input class="w num" id="ie_w_${it.id}" type="number" step="0.01" min="0" value="${it.weight}" data-ie="${e.id}|${it.id}|weight" aria-label="الوزن"></td>
          <td><button class="btn xs danger" type="button" data-act="ie-del" data-emp="${e.id}" data-item="${it.id}">${ic('trash', 'sm')} حذف</button></td></tr>`).join('')}
      </tbody></table></div>
      <div class="card-b row"><button class="btn sm" type="button" data-act="ie-add" data-emp="${e.id}">${ic('plus', 'sm')} إضافة عنصر</button>
        <span class="spacer"></span><button class="btn ghost" type="button" data-act="ie-cancel" data-emp="${e.id}">إلغاء</button><button class="btn primary" type="button" data-act="ie-save" data-emp="${e.id}">${ic('check', 'sm')} حفظ عناصر هذا الملف</button></div></div>`;
  }

  /* ----- ملف الإدارية ----- */
  function adminSection(e, f, kind, res) {
    const dis = f.status === 'approved';
    const list = f[kind];
    const isG = kind === 'goals';
    const auto = isG ? f.autoGoals : f.autoComps;
    const r = isG ? res.goals : res.comps;
    const word = isG ? 'الهدف' : 'الجدارة';
    const rows = r.rows.map((g, i) => {
      const b = (k) => `file|${e.id}|${kind}|${g.id}|${k}`;
      const evN = DB.evidence.filter((x) => x.employeeId === e.id && x.itemId === g.id && !x.archived).length;
      const c = g.calc;
      const open = UI.openItems && UI.openItems.has(g.id);
      return `<div class="item">
        <div class="item-top"><span class="item-no">${i + 1}</span>
          <div class="field" style="margin:0"><label for="g_t_${g.id}" class="small">عنوان ${isG ? 'الهدف الذكي' : 'الجدارة'}</label><input id="g_t_${g.id}" value="${esc(g.title)}" data-bind="${b('title')}" ${dis ? 'disabled' : ''}></div>
          <div class="calc-pill">${c.score != null ? `<span class="pill ${L.levelOf(c.score).pill}">الدرجة ${c.score}</span>` : c.state === 'invalid' ? pill('بيانات غير صالحة', 'p-bad') : pill('لم يُقيّم', 'p-mute')}</div>
        </div>
        <div class="fgrid">
          ${textField(`g_m_${g.id}`, 'معيار القياس', g.measure, b('measure'), { disabled: dis, type: 'text' })}
          ${textField(`g_u_${g.id}`, 'الوحدة', g.unit, b('unit'), { disabled: dis, type: 'text' })}
          <div class="field"><label for="g_w_${g.id}">الوزن النسبي %</label><input id="g_w_${g.id}" type="number" step="0.01" min="0" value="${g.weight}" data-bind="${b('weight')}" data-num="1" ${dis || auto ? 'disabled' : ''}></div>
          <div class="field"><label for="g_tg_${g.id}">الناتج المستهدف</label><input id="g_tg_${g.id}" type="number" step="any" min="0" value="${esc(g.target)}" data-bind="${b('target')}" data-num="1" ${dis ? 'disabled' : ''}></div>
          <div class="field"><label for="g_ac_${g.id}">الناتج الفعلي</label><input id="g_ac_${g.id}" type="number" step="any" min="0" value="${esc(g.actual)}" data-bind="${b('actual')}" data-num="1" ${dis ? 'disabled' : ''}></div>
          <div class="field"><span class="lab">الدرجة المحسوبة</span><div class="small">${c.score != null ? `<b>${c.score}</b> — ${esc(c.rule)}` : c.error ? `<span class="err">${esc(c.error)}</span>` : '<span class="muted">تظهر بعد إدخال المستهدف والفعلي</span>'}</div></div>
        </div>
        <details data-item-id="${g.id}" ${open ? 'open' : ''}><summary>التغذية الراجعة وخطة التحسين والشواهد ${evN ? pill(evN + ' شاهد', 'p-info') : ''}</summary><div class="dbody">
          <div class="fgrid">${textField(`g_jf_${g.id}`, 'مبررات الدرجة وملاحظات الأداء', g.justification, b('justification'), { disabled: dis })}${textField(`g_fb_${g.id}`, 'التغذية الراجعة', g.feedback, b('feedback'), { disabled: dis })}
          ${planFields('g_', g, b, dis, e.id, kind)}</div>
          <div class="row">${suggBtn(e.id, g.id)}</div>${planSummary(e.id, g.id)}
          <div class="field"><span class="lab">الشواهد</span>${evidenceList(e.id, g.id)}</div>
          ${!dis ? `<div><button class="btn xs danger" type="button" data-act="g-del" data-emp="${e.id}" data-kind="${kind}" data-id="${g.id}">${ic('trash', 'sm')} حذف ${word}</button></div>` : ''}
        </div></details>
      </div>`;
    }).join('');
    return `<div class="card"><div class="card-h"><h2>${isG ? 'أولاً: الأهداف الذكية' : 'ثانياً: الجدارات'}</h2><span class="sub">${list.length}</span>
      <div class="tools"><label class="row small" style="gap:6px"><input type="checkbox" data-act-change="auto" data-emp="${e.id}" data-kind="${kind}" ${auto ? 'checked' : ''} ${dis ? 'disabled' : ''}> توزيع الأوزان بالتساوي تلقائياً</label>
      <button class="btn sm primary" type="button" data-act="g-add" data-emp="${e.id}" data-kind="${kind}" ${dis ? 'disabled' : ''}>${ic('plus', 'sm')} إضافة ${word}</button></div></div>
      <div class="card-b" style="padding-block:10px"><div class="wsum">مجموع الأوزان <div class="trk"><div class="fill ${r.weightsOk ? 'lvl5' : 'lvl2'}" style="width:${Math.min(100, r.sumW)}%"></div></div><b class="num">${pctTxt(r.sumW)}</b>${list.length ? (r.weightsOk ? pill('100%', 'p-ok') : pill('يجب أن يساوي 100% قبل الاعتماد', 'p-warn')) : ''}
        <span class="spacer small">المتوسط الموزون: <b class="num">${f2(r.avg)}</b>${!r.complete && list.length ? ' <span class="muted">(يظهر بعد اكتمال الكل)</span>' : ''}</span></div></div>
      ${list.length ? rows : emptyState({ icon: isG ? 'target' : 'award', title: isG ? 'لم تُضف أهداف بعد' : 'لم تُضف جدارات بعد', text: 'أدخليها يدوياً: يمكن إضافة 4 أو 5 أو 6 أو أكثر.' })}
    </div>`;
  }
  function trainingSection(e, f) {
    const st = [['planned', 'مخطط'], ['progress', 'قيد التنفيذ'], ['done', 'منفّذ'], ['cancelled', 'ملغى']];
    return `<div class="card"><div class="card-h"><h2>ثالثاً: الاحتياجات التدريبية والدورات</h2>
      <div class="tools"><button class="btn sm" type="button" data-act="t-add" data-emp="${e.id}">${ic('plus', 'sm')} إضافة احتياج / دورة</button></div></div>
      ${!f.training.length ? emptyState({ icon: 'grad', title: 'لا توجد احتياجات تدريبية مسجلة' }) : f.training.map((t, i) => {

  /* تقسيم التقرير على صفحات A4 دون قص الصفوف أو العناوين؛ تتكرر الديباجة والخلفية في كل صفحة */
  async function paginate(ctx, opts) {
    try { await document.fonts.ready; } catch (e) { /* */ }
    const built = R.build(ctx);
    const host = document.createElement('div');
    host.style.cssText = 'position:fixed;left:-20000px;top:0;width:800px;visibility:hidden;pointer-events:none';
    document.body.appendChild(host);
    const pages = [];
    const shell = R.pageShell({ ...ctx, rs: built.rs }, opts);
    const newPage = () => { const w = document.createElement('div'); w.innerHTML = shell; const p = w.firstElementChild; host.appendChild(p); pages.push(p); return p.querySelector('.rp-body'); };
    const over = (b) => b.scrollHeight > b.clientHeight + 1;
    const frag = (html) => { const w = document.createElement('div'); w.innerHTML = html.trim(); return w.firstElementChild; };
    let body = newPage();
    for (const html of built.blocks) {
      const node = frag(html); if (!node) continue;
      body.appendChild(node);
      if (!over(body)) continue;
      if (body.children.length > 1) { body.removeChild(node); body = newPage(); body.appendChild(node); }
      if (!over(body)) continue;
      // كتلة أطول من صفحة: تُقسَّم بالصفوف أو القوائم مع تكرار عنوانها ورأس الجدول
      const pick = (n) => n.querySelector('tbody') || n.querySelector('.rp-info') || n.querySelector('ul');
      let box = pick(node); if (!box) continue;
      const units = Array.from(box.children); box.innerHTML = '';
      let cur = node;
      for (const u of units) {
        box.appendChild(u);
        if (over(body) && box.children.length > 1) {
          box.removeChild(u);
          const next = node.cloneNode(true); const h = next.querySelector('h2'); if (h && !/\(تابع\)$/.test(h.textContent)) h.textContent += ' (تابع)';
          body = newPage(); body.appendChild(next); cur = next; box = pick(next); box.innerHTML = ''; box.appendChild(u);
        }
      }
      void cur;
    }
    pages.forEach((p, i) => { const pn = p.querySelector('.pn'); if (pn) pn.textContent = `صفحة ${i + 1} من ${pages.length}`; });
    return { host, pages, built };
  }

  /* قراءة الصورة والتحقق من نوعها وحجمها ثم تصغيرها قبل الرفع */
  function processImage(file, spec) {
    return new Promise((ok, bad) => {
      if (!file) return bad(new Error(''));
      if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return bad(new Error('الصيغ المقبولة: PNG أو JPG أو WebP.'));
      if (file.size > 10 * 1024 * 1024) return bad(new Error('حجم الصورة أكبر من 10 ميجابايت.'));
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, spec.max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
        const g = c.getContext('2d');
        if (spec.type === 'image/jpeg') { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
        g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        let q = 0.88, out = c.toDataURL(spec.type, q);
        while (out.length > 3800000 && q > 0.4) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
        if (out.length > 3800000) return bad(new Error('الصورة كبيرة جداً بعد الضغط.'));
        ok(out);
      };
      img.onerror = () => { URL.revokeObjectURL(url); bad(new Error('تعذّرت قراءة الصورة.')); };
      img.src = url;
    });
  }

  function libManagerBody() {

      ${rows.slice(0, 300).map((r) => `<tr class="${off(r) ? 'row-off' : ''}"><td>${esc(r.body)}</td><td class="small">${sgCatLabel(r.category)}</td><td class="small">${r.item_name === '*' ? 'أي عنصر' : esc(r.item_name)}</td><td class="num small">${r.min_score === r.max_score ? r.min_score : `${r.min_score}–${r.max_score}`}</td>

  function fillLib() { const b = $('libBody'); if (b) b.innerHTML = libManagerBody(); }

  /* تعديل المكتبة لا يمس الخطط المعتمدة: الخطة تحفظ نصها النهائي مستقلاً */

        if (r && r.school_id) { await C.libUpdate(r.id, row); Object.assign(r, row); }
        else {
          const nr = await C.libAdd({ ...row, school_id: ME.school_id, replaces: r ? r.id : null });
          if (r) { await C.libHide(ME.school_id, r.id, true); LIB.hidden.add(r.id); }
          LIB.rows.push(nr);
        }
      } else {
        const ok = await commit((db) => {
          db.meta.libCustom = db.meta.libCustom || []; db.meta.libHidden = db.meta.libHidden || [];
          if (r && r.school_id) Object.assign(db.meta.libCustom.find((x) => x.id === r.id), row);
          else { db.meta.libCustom.push({ ...row, id: L.uid('sg'), school_id: 'local', replaces: r ? r.id : null }); if (r) db.meta.libHidden.push(r.id); }
        }, null);
        if (!ok) { setSaving(false); return false; }
        LIB.loaded = false; await loadLibrary(true);
      }
      setSaving(false); toast(CLOUD ? 'تم الحفظ بنجاح' : 'حُفظ في هذا المتصفح', '', { ms: 3000 }); fillLib(); return true;
    } catch (err) { setSaving(false); toast('تعذّر الحفظ، حاولي مرة أخرى', 'bad', { detail: CLOUD ? C.errMsg(err) : '' }); return false; }
  }
  async function libToggle(id) {

    try {
      setSaving(true);
      if (CLOUD) {
        if (r.school_id) { await C.libUpdate(r.id, { active: off }); r.active = off; }
        else { await C.libHide(ME.school_id, r.id, !off); if (off) LIB.hidden.delete(r.id); else LIB.hidden.add(r.id); }
      } else {

          db.meta.libCustom = db.meta.libCustom || []; db.meta.libHidden = db.meta.libHidden || [];

        LIB.loaded = false; await loadLibrary(true);
