<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إتقان — تقييم الأداء الوظيفي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&family=Aref+Ruqaa:wght@400&display=swap">
<style>
/* إتقان — الأنماط
   التخطيط: قائمة جانبية عائمة يميناً + هيدر ثابت، والمحتوى بطاقات على أرضية رمادية فاتحة بميل موفي */
:root{
  --bg:#F5F4F8; --surface:#FFFFFF; --surface-2:#FAF9FC; --line:#E6E2EE; --line-strong:#D5CEE1;
  --fg:#2B2534; --fg-2:#5F566E; --fg-3:#8C8399;
  --mauve:#7D6A9E; --mauve-strong:#665388; --mauve-soft:#EFEAF6; --mauve-tint:#F6F3FA; --on-mauve:#FFFFFF;
  --ok:#2F8A62; --ok-soft:#E5F4EC; --warn:#A66F10; --warn-soft:#FBF1DE; --bad:#B8475A; --bad-soft:#F9E7EA;
  --info:#4F6FA8; --info-soft:#E8EEF8; --demo:#9A5B13; --demo-soft:#FFF4E0; --demo-line:#F0D3A4;
  --lv5:#5E8F75; --lv4:#7D6A9E; --lv3:#8EA3C6; --lv2:#D6A55A; --lv1:#C97080;
  --shadow:0 1px 2px rgba(43,37,52,.05),0 6px 20px -12px rgba(60,40,90,.18);
  --font-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --font-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r-md:12px; --r-lg:16px; --side-w:272px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18151D; --surface:#221E29; --surface-2:#1D1A23; --line:#332D3D; --line-strong:#443C51;
  --fg:#EEEAF3; --fg-2:#BDB4CA; --fg-3:#8E859C;
  --mauve:#B4A1D6; --mauve-strong:#C9BAE6; --mauve-soft:#2F283B; --mauve-tint:#27222F; --on-mauve:#1B1722;
  --ok:#6CCB9C; --ok-soft:#1D3229; --warn:#E3B45C; --warn-soft:#382D18; --bad:#EE8A9A; --bad-soft:#3A2128;
  --info:#93AEE0; --info-soft:#1F2839; --demo:#F0B862; --demo-soft:#33270F; --demo-line:#5C4519;
  --lv5:#6FB08E; --lv4:#A893CF; --lv3:#8EA3C6; --lv2:#D9AE66; --lv1:#D98595;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18151D; --surface:#221E29; --surface-2:#1D1A23; --line:#332D3D; --line-strong:#443C51;
  --fg:#EEEAF3; --fg-2:#BDB4CA; --fg-3:#8E859C;
  --mauve:#B4A1D6; --mauve-strong:#C9BAE6; --mauve-soft:#2F283B; --mauve-tint:#27222F; --on-mauve:#1B1722;
  --ok:#6CCB9C; --ok-soft:#1D3229; --warn:#E3B45C; --warn-soft:#382D18; --bad:#EE8A9A; --bad-soft:#3A2128;
  --info:#93AEE0; --info-soft:#1F2839; --demo:#F0B862; --demo-soft:#33270F; --demo-line:#5C4519;
  --lv5:#6FB08E; --lv4:#A893CF; --lv3:#8EA3C6; --lv2:#D9AE66; --lv1:#D98595;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.35}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--mauve-strong)}
:focus-visible{outline:2px solid var(--mauve);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:16px;height:16px}
.muted{color:var(--fg-3)} .small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{margin-inline-start:auto}
.stack{display:grid;gap:12px}

/* ---------- Header ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:14px;min-height:66px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:42px;height:42px;border-radius:12px;background:var(--mauve);color:var(--on-mauve);display:grid;place-items:center;flex:none;overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand-mark svg{width:24px;height:24px}
.brand-txt{min-width:0}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:19px;display:flex;align-items:baseline;gap:8px}
.brand-name small{font-family:var(--font-body);font-weight:500;font-size:13px;color:var(--fg-3)}
.brand-school{font-size:13px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-meta{margin-inline-start:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;color:var(--fg-2);white-space:nowrap}
.chip b{color:var(--fg);font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.principal{display:flex;align-items:center;gap:10px;padding-inline-start:12px;border-inline-start:1px solid var(--line)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--mauve-soft);color:var(--mauve-strong);display:grid;place-items:center;font-weight:700;font-family:var(--font-display);flex:none}
.principal .pt{line-height:1.3}
.principal .pt span{display:block;font-size:12px;color:var(--fg-3)}
.principal .pt b{font-size:14px;font-weight:600}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--fg-2)}
.icon-btn:hover{background:var(--mauve-tint);color:var(--mauve-strong)}
.menu-btn{display:none}

.band{border-bottom:1px solid var(--line)}
.band-in{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px;font-size:13.5px;font-weight:500;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band.local{background:var(--info-soft);color:var(--info)}
.band.demo{background:var(--demo-soft);color:var(--demo);border-color:var(--demo-line)}
.band.bad{background:var(--bad-soft);color:var(--bad)}
.band.cloud{background:var(--ok-soft);color:var(--ok)}
/* شاشة الدخول */
body.auth-mode .side,body.auth-mode .top-meta,body.auth-mode .band,body.auth-mode .menu-btn{display:none!important}
body.auth-mode .app{grid-template-columns:minmax(0,1fr)}
.auth-wrap{display:grid;place-items:center;min-height:60vh}
.auth-card{width:min(640px,100%);padding:24px;display:grid;gap:16px}
.auth-card h1{font-size:22px}
.auth-tabs{border-radius:12px;border:1px solid var(--line);margin-bottom:4px;flex-wrap:wrap}
.auth-brand{display:flex;align-items:center;gap:12px}
.auth-brand b{display:block;font-family:var(--font-display);font-size:19px}
.auth-brand span{font-size:13px;color:var(--fg-3)}
.band .btn{margin-inline-start:auto}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);gap:20px;align-items:start;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1520px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;box-shadow:var(--shadow);max-height:calc(100vh - 106px);overflow:auto}
.side-label{font-size:11.5px;font-weight:600;color:var(--fg-3);letter-spacing:.04em;padding:10px 12px 4px}
.nav{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--fg-2);font-weight:500;font-size:14.5px}
.nav a .n{margin-inline-start:auto;font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.nav a:hover{background:var(--mauve-tint);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--mauve-soft);color:var(--mauve-strong);font-weight:600}
.scrim{display:none}
main{min-width:0;display:grid;gap:20px}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head .ph-txt{min-width:0;flex:1 1 320px}
.eyebrow{font-size:12.5px;color:var(--mauve-strong);font-weight:600;margin-bottom:4px}
.page-head h1{font-size:25px}
.page-head p{color:var(--fg-2);margin-top:4px;max-width:75ch}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.crumb{font-size:13px;color:var(--fg-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--fg-2);text-decoration:none}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:16.5px}
.card-h .sub{font-size:13px;color:var(--fg-3)}
.card-h .tools{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card-b{padding:18px}
.grid{display:grid;gap:20px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.kpi{padding:14px 16px;display:grid;gap:4px;align-content:start}
.kpi-top{display:flex;align-items:center;gap:10px;color:var(--fg-2);font-size:13.5px;font-weight:500}
.kpi-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--mauve-soft);color:var(--mauve-strong);flex:none}
.kpi-ic.ok{background:var(--ok-soft);color:var(--ok)} .kpi-ic.warn{background:var(--warn-soft);color:var(--warn)} .kpi-ic.info{background:var(--info-soft);color:var(--info)}
.kpi-v{font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi-v small{font-size:15px;color:var(--fg-3);font-weight:500}
.kpi-s{font-size:12.5px;color:var(--fg-3)}
.track-card .card-h{background:var(--mauve-tint);border-radius:var(--r-lg) var(--r-lg) 0 0}

/* ---------- Buttons & pills ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--mauve-tint)}
.btn.primary{background:var(--mauve);border-color:var(--mauve);color:var(--on-mauve)}
.btn.primary:hover{background:var(--mauve-strong);border-color:var(--mauve-strong)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px}
.btn.xs{min-height:28px;padding:0 9px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)}
.p-mute{background:var(--surface-2);color:var(--fg-3);border:1px solid var(--line)}
.p-demo{background:var(--demo-soft);color:var(--demo);border:1px dashed var(--demo-line)}
.p-mauve{background:var(--mauve-soft);color:var(--mauve-strong)}

.empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:30px 18px;color:var(--fg-2)}
.empty .e-ic{width:54px;height:54px;border-radius:16px;background:var(--mauve-tint);color:var(--mauve);display:grid;place-items:center}
.empty .e-ic svg{width:26px;height:26px}
.empty h3{font-size:16px;color:var(--fg)}
.empty p{max-width:56ch;font-size:14px}
.empty .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.note{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--r-md);font-size:13.5px;line-height:1.7}
.note svg{margin-top:3px}
.note.info{background:var(--info-soft);color:var(--info)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.mauve{background:var(--mauve-tint);color:var(--fg-2);border:1px solid var(--line)}
.note b{font-weight:700}
.note ul{margin:4px 0 0;padding-inline-start:18px}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{font-weight:600;color:var(--fg-3);font-size:12.5px;text-align:start;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.clickable{cursor:pointer} .t tr.clickable:hover td{background:var(--mauve-tint)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .avatar{width:32px;height:32px;font-size:13px}
.who small{display:block;color:var(--fg-3);font-size:12px}
.t input,.t select{height:36px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface-2);padding:0 10px;width:100%}
.t input.w{max-width:96px}
.row-bad td{background:var(--bad-soft)} .row-dup td{background:var(--warn-soft)}
.sec-row td{background:var(--mauve-tint);font-weight:600;color:var(--mauve-strong);font-size:13px}

/* bars */
.bars{display:grid;gap:11px}
.bar-row{display:grid;grid-template-columns:minmax(96px,170px) minmax(0,1fr) auto;align-items:center;gap:12px;font-size:13.5px}
.bar-row .lbl{color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk{height:12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:flex}
.fill{height:100%;background:var(--mauve);border-radius:999px}
.bar-row .v{font-weight:600;min-width:58px;text-align:end;font-variant-numeric:tabular-nums}
.lvl5{background:var(--lv5)}.lvl4{background:var(--lv4)}.lvl3{background:var(--lv3)}.lvl2{background:var(--lv2)}.lvl1{background:var(--lv1)}
.stackbar{height:22px;border-radius:8px;overflow:hidden;display:flex;background:var(--surface-2);border:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--fg-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.vchart{display:flex;align-items:flex-end;gap:12px;height:190px;padding:6px 4px 0;border-bottom:1px solid var(--line-strong);overflow-x:auto}
.vcol{flex:1 0 46px;display:grid;justify-items:center;gap:4px;height:100%;align-content:end}
.vcol .vb{width:min(42px,70%);border-radius:8px 8px 0 0;background:var(--mauve)}
.vcol .vv{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.vlabels{display:flex;gap:12px;padding:6px 4px 0;font-size:11.5px;color:var(--fg-2);overflow-x:auto}
.vlabels span{flex:1 0 46px;text-align:center;line-height:1.3}

/* toolbar & filters */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1 1 220px;min-width:0}
.search input{width:100%;height:40px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface-2);padding:0 40px 0 12px}
.search svg{position:absolute;right:12px;top:12px;color:var(--fg-3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer;color:var(--fg-2)}
.fchip[aria-pressed="true"]{background:var(--mauve-soft);border-color:var(--mauve);color:var(--mauve-strong);font-weight:600}
select.sel{height:40px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface-2);padding:0 10px;max-width:100%}

/* forms */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.field{display:grid;gap:5px;min-width:0;align-content:start}
.field label,.field .lab{font-size:13px;font-weight:600;color:var(--fg-2)}
.field .hint{font-size:12px;color:var(--fg-3)}
.field .err{font-size:12.5px;color:var(--bad);font-weight:600}
.field input,.field select,.field textarea{min-height:40px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface-2);padding:0 12px;width:100%}
.field textarea{min-height:76px;padding:8px 12px;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--mauve);outline:none;box-shadow:0 0 0 3px var(--mauve-soft)}
.field input[disabled],.field textarea[disabled],.field select[disabled]{opacity:.7}
.field.span2{grid-column:span 2} @media (max-width:620px){.field.span2{grid-column:auto}}
.logo-box{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo-prev{width:84px;height:84px;border-radius:16px;border:1px dashed var(--line-strong);display:grid;place-items:center;background:var(--surface-2);overflow:hidden;color:var(--fg-3)}
.logo-prev img{width:100%;height:100%;object-fit:contain;background:#fff}
.form-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;padding:6px;background:var(--surface-2);border-bottom:1px solid var(--line);border-radius:var(--r-lg) var(--r-lg) 0 0}
.tab{min-height:36px;padding:0 14px;border-radius:9px;border:0;background:transparent;cursor:pointer;white-space:nowrap;color:var(--fg-2);font-weight:500;font-size:13.5px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--mauve-strong);font-weight:600;box-shadow:var(--shadow)}

/* weight sum */
.wsum{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.wsum .trk{width:160px}

/* ---------- Employee file ---------- */
.file-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px}
.file-head .avatar{width:56px;height:56px;font-size:22px}
.file-head h1{font-size:22px}
.meta-list{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--fg-2);margin-top:4px}
.meta-list b{color:var(--fg);font-weight:600}
.score-big{text-align:center;padding:10px 18px;border-radius:14px;background:var(--mauve-tint);border:1px solid var(--line);min-width:130px}
.score-big b{display:block;font-family:var(--font-display);font-size:30px;line-height:1.2;color:var(--mauve-strong);font-variant-numeric:tabular-nums}
.score-big span{font-size:12.5px;color:var(--fg-2)}
.progress{display:flex;align-items:center;gap:10px;font-size:13.5px}
.progress .trk{flex:1;max-width:280px}

.item{border-bottom:1px solid var(--line);padding:14px 18px;display:grid;gap:10px}
.item:last-child{border-bottom:0}
.item-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.item-no{width:30px;height:30px;border-radius:9px;background:var(--mauve-soft);color:var(--mauve-strong);display:grid;place-items:center;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.item-name{font-weight:600}
.item-name small{display:block;font-weight:500;color:var(--fg-3);font-size:12.5px}
.scores{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.sbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--fg-2)}
.sbtn:hover{border-color:var(--mauve);color:var(--mauve-strong)}
.sbtn[aria-pressed="true"]{background:var(--mauve);border-color:var(--mauve);color:var(--on-mauve)}
.sbtn[disabled]{cursor:not-allowed;opacity:.6}
.item details{border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.item summary{cursor:pointer;padding:8px 12px;font-size:13.5px;color:var(--fg-2);font-weight:600;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item summary::-webkit-details-marker{display:none}
.item summary::before{content:"";width:8px;height:8px;border-inline-end:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-inline-end:4px;transition:transform .15s}
.item details[open] summary::before{transform:rotate(-135deg)}
.item .dbody{padding:4px 12px 12px;display:grid;gap:12px}
.calc-pill{min-width:72px;text-align:center}

/* evidence */
.evs{display:grid;gap:8px}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ev .qr{width:64px;height:64px;border-radius:8px;border:1px solid var(--line);background:#fff;padding:3px;cursor:zoom-in;image-rendering:pixelated}
.ev b{font-size:14px;display:block}
.ev .url{font-size:12.5px;color:var(--info);word-break:break-all;display:block;text-align:left;direction:ltr;unicode-bidi:isolate}
.ev small{font-size:12px;color:var(--fg-3)}
.ev .acts{display:flex;gap:4px;flex-wrap:wrap}
.ev.arch{background:var(--surface-2);border-style:dashed}
@media (max-width:620px){.ev{grid-template-columns:auto minmax(0,1fr)}.ev .acts{grid-column:1 / -1}}

/* drop zone */
.drop{border:2px dashed var(--line-strong);border-radius:var(--r-lg);padding:26px 18px;display:grid;justify-items:center;gap:8px;text-align:center;background:var(--surface-2);color:var(--fg-2)}
.drop.over{border-color:var(--mauve);background:var(--mauve-tint)}
.drop .e-ic{width:54px;height:54px;border-radius:16px;background:var(--mauve-soft);color:var(--mauve-strong);display:grid;place-items:center}
.cols{display:flex;gap:6px;flex-wrap:wrap}
.cols code{font-family:var(--font-body);font-size:12.5px;padding:3px 10px;border-radius:7px;background:var(--surface);border:1px solid var(--line);color:var(--fg)}

/* modal */
.modal-wrap{position:fixed;inset:0;z-index:70;background:rgba(20,16,28,.45);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:0 20px 60px -20px rgba(0,0,0,.4);width:min(620px,100%);max-height:100%;display:flex;flex-direction:column;border:1px solid var(--line)}
.modal.wide{width:min(860px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:17px}
.modal-b{padding:18px;overflow:auto;display:grid;gap:14px}
.modal-f{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);justify-content:flex-start}
.qr-big{display:grid;justify-items:center;gap:10px;text-align:center}
.qr-big img{width:min(260px,70vw);height:auto;image-rendering:pixelated;background:#fff;padding:8px;border-radius:12px;border:1px solid var(--line)}

/* toast */
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:calc(20px + env(safe-area-inset-left,0px));z-index:90;display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:14px;box-shadow:var(--shadow);max-width:min(440px,calc(100vw - 40px))}
.toast.bad{background:var(--bad);color:#fff}
.toast-btn{border:1px solid rgba(255,255,255,.6);background:transparent;color:inherit;border-radius:8px;padding:4px 10px;font-weight:600;cursor:pointer;white-space:nowrap}
.saving-note{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:calc(20px + env(safe-area-inset-right,0px));z-index:91;display:flex;gap:8px;align-items:center;padding:9px 14px;border-radius:999px;background:var(--surface);color:var(--fg-2);border:1px solid var(--line);box-shadow:var(--shadow);font-size:13.5px;font-weight:600}
.saving-note .spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--mauve-soft);border-top-color:var(--mauve);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body.is-saving #settingsForm button[type=submit],body.is-saving #rhForm button[type=submit],body.is-saving .modal button[type=submit],body.is-saving [data-act=approve],body.is-saving [data-act=imp-save],body.is-saving [data-act=tp-save],body.is-saving [data-act=ie-save],body.is-saving [data-act=score],body.is-saving [data-act=g-add],body.is-saving [data-act=t-add]{pointer-events:none;opacity:.55}
.save-failed{border-color:var(--bad)!important;box-shadow:0 0 0 3px var(--bad-soft)!important}
.toast.warn{background:var(--warn);color:#fff}

/* report preview */
.report-stage{background:var(--surface-2);border-radius:var(--r-lg);padding:20px;overflow-x:auto}
.report-paper{background:#fff;color:#2B2534;width:210mm;max-width:none;margin:0 auto;padding:12mm 10mm;box-shadow:0 6px 24px rgba(0,0,0,.12);border-radius:4px}

/* portal */
.portal-head{background:linear-gradient(0deg,var(--surface),var(--mauve-tint));}

  .report-stage{padding:10px}
}

/* ---------- Print: التقرير فقط ---------- */
@page{size:A4;margin:12mm 10mm}

  body{background:#fff!important;color:#000}

@keyframes skp{0%{background-position:100% 0}100%{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.sk-nav{height:34px;margin:8px 6px;list-style:none}
.sk-page{display:flex;flex-direction:column;gap:14px}
.sk-title{height:28px;width:min(320px,70%)}
.sk-sub{height:14px;width:min(460px,85%)}
.sk-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.sk-kpi{height:96px;border-radius:16px}
.sk-card{height:260px;border-radius:16px}
.sk-card.short{height:140px}
.msg-box{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;background:#fff}
ul.req{margin:4px 0 0;padding-inline-start:18px}

/* ===== التقارير: معاينة صفحات A4 ===== */
.report-stage{background:linear-gradient(180deg,#EFE9F5,#F6F2F9);border-radius:var(--r-lg);padding:22px 12px;overflow:hidden}
.rp-pages{display:flex;flex-direction:column;align-items:center;gap:18px}
.rp-pages .rp-page,.rp-preview .rp-page{box-shadow:0 10px 30px rgba(59,31,78,.16);border-radius:2px;flex:none}
.rp-ph{background:#fff;opacity:.6}
.rp-preview{display:flex;flex-direction:column;align-items:center;gap:16px;background:#EFE9F5;padding:16px;border-radius:12px}
.modal.xl{max-width:min(900px,96vw)}
@media (max-width:1180px){.rp-pages .rp-page{zoom:.82}}
@media (max-width:940px){.rp-pages .rp-page,.rp-preview .rp-page{zoom:.62}}
@media (max-width:620px){.rp-pages .rp-page,.rp-preview .rp-page{zoom:.42}}
.rep-tools .toolbar + .toolbar{padding-top:10px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;white-space:nowrap}
.chk input{accent-color:var(--mauve);width:16px;height:16px}
.chk-row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.chk-row .lab{font-size:12.5px;color:var(--fg-2);font-weight:600}
.asset-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.asset-tile{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface,#fff)}
.asset-prev{position:relative;height:120px;border-radius:10px;background:#F6F2FA;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#A99BBC}
.asset-prev.a4{height:170px}
.asset-prev img{max-width:100%;max-height:100%;object-fit:contain}
.asset-confirm{display:flex;justify-content:center;background:#F6F2FA;border-radius:12px;padding:12px}
.asset-confirm img{max-width:100%;max-height:60vh;object-fit:contain;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.btn.danger-t{color:var(--bad,#B4374A)}

/* =====================================================================
   الهوية الداخلية: باذنجاني داكن · موف · لافندر فاتح · أوف وايت
   ===================================================================== */
:root{
  --aub-900:#2A1736; --aub-800:#36204A; --aub-700:#4A2C61; --mv-600:#6E4E8E; --mv-500:#8C6BA8; --lav-300:#CDB9E3; --lav-200:#E7DDF3; --lav-100:#F3EEF9; --offwhite:#FAF8FC;
  --shadow-p:0 1px 2px rgba(42,23,54,.06),0 14px 32px -18px rgba(74,44,97,.38);
  --grad-aub:linear-gradient(115deg,#2A1736 0%,#3E2454 45%,#6E4E8E 100%);
}
:root{ --info:#5D4A9B; --info-soft:#EEEAF8; --bg:#F7F4FA; --mauve:#6E4E8E; --mauve-strong:#4A2C61; --mauve-soft:#EDE4F6; --mauve-tint:#F6F2FA; --line:#ECE5F3; --line-strong:#DCD1E8 }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --bg:#17121D; --mauve:#B9A2D9; --mauve-strong:#D5C4EE }}
body{background:var(--bg)}

/* ---- الهيدر العلوي ---- */
.topbar{background:var(--grad-aub);border-bottom:0;box-shadow:0 8px 24px -10px rgba(42,23,54,.55);color:#fff}
.topbar-in{min-height:70px}
.topbar .brand{color:#fff;text-decoration:none}
.topbar .brand-mark{width:46px;height:46px;border-radius:14px;background:#fff;box-shadow:0 4px 14px -4px rgba(0,0,0,.35)}
.topbar .brand-mark img.lg{background:#fff;padding:4px}
.topbar .brand-name{font-family:"Aref Ruqaa","Readex Pro",serif;font-weight:400;font-size:27px;line-height:1;letter-spacing:0;color:#fff}
.topbar .brand-sub{font-size:12px;color:var(--lav-300);margin-top:3px;white-space:nowrap}
.topbar .icon-btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff;border-radius:12px}
.topbar .icon-btn:hover{background:rgba(255,255,255,.2);color:#fff}
.topbar .chip.glass{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:var(--lav-200)}
.topbar .chip.glass b{color:#fff}
.topbar .chip .dot{background:#F0C46A}
.user-chip{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 6px 4px 14px;border-inline-start:1px solid rgba(255,255,255,.18)!important;padding-inline-start:5px}
.user-chip:hover{background:rgba(255,255,255,.18)}
.user-chip .avatar{width:38px;height:38px;background:linear-gradient(135deg,#F3EEF9,#CDB9E3);color:var(--aub-700);box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.user-chip .pt{line-height:1.25;padding-inline-end:10px}
.user-chip .pt b{display:block;font-size:13.5px;color:#fff;font-weight:600;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-chip .pt span{display:block;font-size:11.5px;color:var(--lav-300);max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-chip .pt .sch{color:rgba(231,221,243,.75)}
.logout-btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.logout-btn:hover{background:#fff;color:var(--aub-700)}
.logout-btn[hidden]{display:none}
.bell-count{border:2px solid var(--aub-800)}
.menu-btn{display:grid}
@media (max-width:1100px){.user-chip .pt{display:none}.user-chip{padding:3px}}
@media (max-width:620px){.topbar .brand-sub{display:none}.logout-btn span{display:none}.logout-btn{padding:0 11px}.user-chip{display:flex}}

/* ---- القائمة الجانبية ---- */
.side{background:linear-gradient(185deg,#3E2454 0%,#2A1736 75%);border:0;border-radius:22px;box-shadow:0 22px 44px -22px rgba(42,23,54,.65);padding:12px 10px;color:#fff;scrollbar-color:rgba(255,255,255,.2) transparent}
.side-label{padding:0;margin-top:6px}
.side-label button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:9px 12px 5px;font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--lav-300);cursor:pointer;border-radius:8px}
.side-label button:hover{color:#fff}
.side-label button:focus-visible{outline:2px solid var(--lav-300)}
.side-label .i{width:14px;height:14px;transition:transform .2s}
.side-label button[aria-expanded="false"] .i{transform:rotate(90deg)}
.nav li[hidden]{display:none}
.nav a{color:rgba(255,255,255,.82);border-radius:12px;padding:10px 12px;transition:background .18s,color .18s,transform .18s}
.nav a .i{opacity:.9}
.nav a:hover{background:rgba(255,255,255,.09);color:#fff}
.nav a[aria-current="page"]{background:linear-gradient(90deg,#F3EEF9,#E7DDF3);color:var(--aub-700);font-weight:700;box-shadow:0 8px 18px -10px rgba(0,0,0,.5)}
.nav a .n{color:rgba(231,221,243,.7)}
.nav a[aria-current="page"] .n{color:var(--mv-600)}
@media (min-width:941px){
  body.side-mini{--side-w:84px}
  body.side-mini .nav a{justify-content:center;padding:11px 0}
  body.side-mini .nav a .lbl,body.side-mini .nav a .n,body.side-mini .side-label button span{display:none}
  body.side-mini .side-label button{justify-content:center;padding:6px 0}
  body.side-mini .side-label button .i{display:none}
  body.side-mini .side-label{border-top:1px solid rgba(255,255,255,.12);margin:6px 8px 2px}
  body.side-mini .nav li[hidden]{display:list-item}
  .app{transition:grid-template-columns .2s ease}
}
@media (max-width:940px){.side{border-radius:0 0 0 22px}}

/* ---- البطاقات والمكوّنات ---- */
.card{border-color:var(--line);border-radius:18px;box-shadow:var(--shadow-p)}
.page-head h1{color:var(--aub-700)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .page-head h1{color:var(--fg)}}
.eyebrow{color:var(--mv-600)}
.btn{border-radius:12px}
.btn.primary{background:linear-gradient(115deg,#4A2C61,#7A5A98);border-color:transparent;box-shadow:0 8px 18px -10px rgba(74,44,97,.7)}
.btn.primary:hover{background:linear-gradient(115deg,#3B2250,#6E4E8E)}
.t th{background:#F6F1FA;color:var(--mv-600)}
.modal{border-radius:20px}
.modal-h h2{color:var(--aub-700)}
.toast{background:var(--aub-800);color:#fff;border-color:transparent;box-shadow:0 14px 34px -14px rgba(42,23,54,.7)}
.toast.bad{background:#8A2E44}
.field input,.field select,.field textarea,.sel{border-radius:12px}

/* ---- لوحة المؤشرات ---- */
.welcome{position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:24px 26px;border-radius:24px;margin-bottom:18px;
  background:linear-gradient(120deg,#FFFFFF 0%,#F6F1FB 55%,#ECE2F6 100%);border:1px solid var(--lav-200);box-shadow:var(--shadow-p)}
.welcome::after{content:"";position:absolute;inset-inline-end:-70px;top:-90px;width:260px;height:260px;border-radius:50%;border:38px solid rgba(110,78,142,.06);pointer-events:none}
.welcome h1{font-family:var(--font-display);font-size:25px;color:var(--aub-700);margin:6px 0 6px}
.welcome p{margin:8px 0 0;color:var(--fg-2);font-size:14px;max-width:640px}
.w-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--mv-600);background:#fff;border:1px solid var(--lav-200);padding:3px 12px;border-radius:999px}
.w-meta{display:flex;flex-wrap:wrap;gap:8px}
.w-meta span{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--aub-700);background:rgba(255,255,255,.75);border:1px solid var(--lav-200);padding:4px 12px;border-radius:999px}
.w-side{position:relative;z-index:1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .welcome{background:linear-gradient(120deg,#241C2D,#2D2338);border-color:#3A2F47}:root:not([data-theme="light"]) .welcome h1,:root:not([data-theme="light"]) .w-meta span{color:var(--fg)}:root:not([data-theme="light"]) .w-meta span,:root:not([data-theme="light"]) .w-eyebrow{background:rgba(255,255,255,.05);border-color:#3A2F47}}
.card.kpi{border:0;border-radius:20px;padding:16px 18px;transition:transform .2s ease,box-shadow .2s ease}
.card.kpi:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(42,23,54,.06),0 20px 36px -18px rgba(74,44,97,.5)}
@media (prefers-reduced-motion:reduce){.card.kpi{transition:none}.card.kpi:hover{transform:none}}
.kpi-top{font-size:13px;font-weight:600;color:var(--fg-2)}
.kpi-ic{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#9B7DB8,#4A2C61);color:#fff;box-shadow:0 8px 16px -8px rgba(74,44,97,.7)}
.kpi-ic.info{background:linear-gradient(135deg,#B4A3DE,#5D4A9B);color:#fff}
.kpi-ic.ok{background:linear-gradient(135deg,#C6A6D6,#7A4E8E);color:#fff}
.kpi-ic.warn{background:linear-gradient(135deg,#E2A9C6,#8E4778);color:#fff}
.kpi-v{font-size:32px;color:var(--aub-700)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kpi-v{color:var(--fg)}}
/* ألوان مستويات الأداء ضمن الهوية (المعنى نفسه: من الأعلى إلى الأدنى) */
:root{--lv5:#4A2C61;--lv4:#7A5A98;--lv3:#A994C8;--lv2:#D39AB4;--lv1:#B4475E}

/* الهيكل المؤقت داخل الهيدر الجديد */
body.skel-mode .side{background:linear-gradient(185deg,#3E2454 0%,#2A1736 75%)}
body.skel-mode .sk-nav{background:rgba(255,255,255,.08);animation:none}

/* ===== مكتبة مقترحات تحسين الأداء ===== */
.item-top .sg-btn{grid-column:2 / -1;justify-self:start}
.sg-btn{border-color:var(--lav-200);color:var(--mv-600);background:var(--lav-100)}
.sg-btn:hover{background:var(--lav-200)}
.sg-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.sg-head b{display:block;font-size:16px;color:var(--aub-700)}
.sg-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.sg-grid{grid-template-columns:1fr}}
.sg-lib,.sg-plan{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface-2);min-width:0}
.sg-plan h3{margin:0 0 8px;font-size:14px;color:var(--aub-700)}
.sg-list{max-height:52vh;overflow:auto;margin-top:10px;display:flex;flex-direction:column;gap:10px}
.sg-cat{border:0;margin:0;padding:0}
.sg-cat legend{font-weight:700;font-size:13px;color:var(--mv-600);padding:0 0 4px}
.sg-item{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:10px;cursor:pointer;font-size:13.5px;line-height:1.6}
.sg-item:hover{background:var(--lav-100)}
.sg-item input{margin-top:4px;accent-color:var(--mauve);width:16px;height:16px;flex:none}
.sg-item.dim{opacity:.62}
.sg-fit,.sg-gen{font-style:normal;font-size:11px;font-weight:600;border-radius:999px;padding:0 8px;white-space:nowrap}
.sg-fit{background:#E7F3EC;color:#2F7A55}
.sg-gen{background:var(--lav-100);color:var(--mv-600)}
#sgPlan{display:flex;flex-direction:column;gap:6px;max-height:36vh;overflow:auto}
.sg-pcat{border-bottom:1px dashed var(--line);padding-bottom:6px}
.sg-pcat:not(.has) .sg-ph b{color:var(--fg-3);font-weight:500}
.sg-ph{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px}
.sg-row{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:4px}
.sg-row textarea{width:100%;border-radius:10px;border:1px solid var(--line-strong);padding:6px 10px;font:inherit;font-size:13.5px;background:var(--surface);resize:vertical}
.sg-row .icon-btn{width:32px;height:32px}
.sg-fields{margin-top:10px}
.sg-sum{margin-top:8px;border:1px solid var(--lav-200);background:var(--lav-100);border-radius:12px;padding:8px 12px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.sg-sum .lab{font-weight:600;color:var(--mv-600)}
.row-off td{opacity:.55}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sg-sum,:root:not([data-theme="light"]) .sg-btn{background:#2A2234;border-color:#3A2F47}:root:not([data-theme="light"]) .sg-item:hover{background:#2A2234}}
.modal{max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.modal-b{min-height:0}
.modal.xl{width:min(1100px,100%);max-width:min(1100px,96vw)}

/* ===== الشواهد داخل صفحات التقييم: QR + عرض، دون الرابط النصي ===== */
.ev.ev-c{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px}
.ev-c .qr-btn{all:unset;cursor:zoom-in;border-radius:8px;line-height:0;box-shadow:0 0 0 1px var(--line)}
.ev-c .qr-btn:focus-visible{outline:2px solid var(--mauve);outline-offset:2px}
.ev-c .qr{width:64px;height:64px;image-rendering:pixelated;border-radius:8px;background:#fff;padding:3px}
.ev-c .qr-na{width:64px;text-align:center;color:var(--fg-3)}
.ev-main b{display:block;font-size:14px;overflow-wrap:anywhere}
.ev-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--fg-3);margin-top:3px}
.ev-type{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--mv-600);background:var(--lav-100);border-radius:999px;padding:1px 10px}
.ev-c .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:620px){.ev.ev-c{grid-template-columns:auto minmax(0,1fr)}.ev-c .acts{grid-column:1 / -1;justify-content:flex-start}}
.qr-big .ev-type{margin-inline:auto}

/* ===== الإقرار والتوقيع والاعتماد ===== */
.es-ack{border:1px solid var(--lav-200);background:var(--lav-100);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.es-ack blockquote{margin:2px 0;padding:6px 10px;border-inline-start:3px solid var(--mv-500);background:#fff;border-radius:8px;white-space:pre-wrap}
.sig-img{display:block;max-width:180px;max-height:64px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px}
.sig-img.lg{max-width:300px;max-height:110px}
.sig-fig{margin:0;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.sig-fig figcaption{font-size:11.5px;color:var(--fg-3)}
.es-log ul{margin:6px 0 0;padding-inline-start:18px}
.es-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.es-sum > div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.es-sum b{font-size:17px;color:var(--aub-700)}
.es-h{font-size:14px;margin:4px 0 0;color:var(--aub-700)}
.sig-pad-wrap{border:2px dashed var(--lav-300);border-radius:14px;background:#fff;padding:6px;touch-action:none}
.sig-pad-wrap canvas{display:block;width:100%;height:auto;aspect-ratio:3/1;cursor:crosshair;touch-action:none}
.ack-opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:600}
.ack-opt:has(input:checked){border-color:var(--mauve);background:var(--lav-100)}
.ack-opt input{accent-color:var(--mauve);width:18px;height:18px}
#ackForm .chk{white-space:normal}

/* ===== صفحة «تقييمي الوظيفي» ===== */
.me-tile{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;background:var(--grad-aub);border-radius:20px;padding:16px 18px;box-shadow:0 14px 30px -16px rgba(42,23,54,.7);transition:transform .2s}
.me-tile:hover{transform:translateY(-2px)}
.me-tile .me-ic{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.me-tile .me-ic .i{width:26px;height:26px}
.me-tile .me-tt{flex:1;display:flex;flex-direction:column}
.me-tile b{font-size:18px;font-family:var(--font-display)}
.me-tile small{color:var(--lav-300);font-size:13px}
.me-tile .badge{background:#F0C46A;color:var(--aub-800)}
.me-hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}
@media (max-width:760px){.me-hero{grid-template-columns:1fr}}
.me-card{border-radius:20px;padding:16px 18px;background:#fff;box-shadow:var(--shadow-p);display:flex;flex-direction:column;gap:6px;border:1px solid var(--lav-200)}
.me-card .lab{font-size:12.5px;color:var(--fg-3);font-weight:600}
.me-card b{font-family:var(--font-display);font-size:30px;color:var(--aub-700);line-height:1.1}
.me-card b small{font-size:15px;color:var(--fg-3)}
.me-card.score{background:var(--grad-aub);border:0}
.me-card.score .lab,.me-card.score b small{color:var(--lav-300)}
.me-card.score b{color:#fff}
.me-card.level b{font-size:22px}
.me-card.state small{font-size:12px;color:var(--fg-3)}
.me-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:2px;padding:12px 16px}
.me-f{display:flex;flex-direction:column;gap:2px;padding:6px 4px;min-width:0}
.me-f > .lab{font-size:12px;font-weight:700;color:var(--mv-600)}
.me-f > div{font-size:14px;overflow-wrap:anywhere}
.me-f ul{margin:2px 0 0;padding-inline-start:18px}
.me-f.just{background:#FFF8EC;border:1px solid #F1DDB3;border-radius:12px;padding:8px 12px}
.me-f.just > .lab{color:#8A5A10}
.me-items{display:flex;flex-direction:column;gap:10px}
.me-item{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.me-item.needs{border-color:#EBCB95}
.me-item > summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 16px;cursor:pointer}
.me-item > summary::-webkit-details-marker{display:none}
.me-item[open] > summary{background:var(--lav-100)}
.me-in{font-weight:700;display:flex;flex-direction:column}
.me-in small{font-weight:500;color:var(--fg-3);font-size:12px}
.me-sc{font-size:13px;color:var(--fg-3);white-space:nowrap}
.me-sc b{font-size:18px;color:var(--aub-700)}
.me-body{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.me-nums{display:flex;flex-wrap:wrap;gap:4px 24px}
@media (max-width:620px){.me-item > summary{grid-template-columns:minmax(0,1fr) auto}.me-item > summary .pill{grid-column:1 / -1;justify-self:start}}
.me-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.me-two{grid-template-columns:1fr}}
.me-box{border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.me-box h3{margin:0 0 6px;font-size:14px}
.me-box.ok{background:#F1F8F4;border-color:#CFE7D9}
.me-box.warn{background:#FFF8EC;border-color:#F1DDB3}
.me-box ul{margin:0;padding-inline-start:18px}
.me-plan{border:1px solid var(--lav-200);border-radius:16px;padding:12px 14px;background:var(--surface)}
.me-ph{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.me-ph b{font-size:15px;color:var(--aub-700);margin-inline-end:auto}
.me-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2px 12px}
.me-upd{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.me-upd select,.me-upd input{min-height:36px;border-radius:10px;border:1px solid var(--line-strong);padding:0 10px;font:inherit;background:var(--surface-2)}
.me-upd input{flex:1 1 200px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .me-card{background:var(--surface);border-color:#3A2F47}:root:not([data-theme="light"]) .me-f.just,:root:not([data-theme="light"]) .me-box.warn{background:#2E2618;border-color:#5C4519}:root:not([data-theme="light"]) .me-box.ok{background:#1D3229;border-color:#2D4A3C}}

</style>

/* =========================================================
   إتقان — منطق الحساب (دوال نقية بلا واجهة، قابلة للاختبار في Node)
   ========================================================= */
(function (root) {
  'use strict';

  /* ---------- الأدوار والمسارات ---------- */
  const ROLES = [
    { key: 'teacher',   label: 'المعلم / المعلمة',        short: 'معلم',          track: 'edu',   kind: 'role'  },
    { key: 'deputy',    label: 'الوكيل / الوكيلة',        short: 'وكيل',          track: 'edu',   kind: 'role'  },
    { key: 'counselor', label: 'الموجه الطلابي',          short: 'موجه طلابي',    track: 'edu',   kind: 'role'  },
    { key: 'health',    label: 'الموجه الصحي',            short: 'موجه صحي',      track: 'edu',   kind: 'role'  },
    { key: 'activity',  label: 'رائد النشاط',             short: 'رائد نشاط',     track: 'edu',   kind: 'role'  },
    { key: 'principal', label: 'مدير / مديرة المدرسة',    short: 'مدير المدرسة',  track: 'edu',   kind: 'role'  },
    { key: 'lab',       label: 'محضر المختبر',            short: 'محضر مختبر',    track: 'edu',   kind: 'role'  },
    { key: 'admin',     label: 'إداري / إدارية',          short: 'إداري',         track: 'staff', kind: 'admin' },
  ];
  const TRACKS = {
    edu:   { key: 'edu',   label: 'الشؤون التعليمية' },
    staff: { key: 'staff', label: 'شؤون الموظفين (الإداريات)' },
  };
  const roleOf = (k) => ROLES.find((r) => r.key === k) || null;

  /* سلم التقدير الخماسي كما في ملف Excel */
  const LEVELS = [
    { n: 5, label: 'مثالي',           cls: 'lvl5', pill: 'p-ok'   },
    { n: 4, label: 'تخطى التوقعات',   cls: 'lvl4', pill: 'p-info' },
    { n: 3, label: 'وافق التوقعات',   cls: 'lvl3', pill: 'p-info' },
    { n: 2, label: 'بحاجة إلى تطوير', cls: 'lvl2', pill: 'p-warn' },
    { n: 1, label: 'غير مرضٍ',        cls: 'lvl1', pill: 'p-bad'  },
  ];
  function levelOf(score) {
    if (score == null || !isFinite(score)) return null;
    const s = Math.round(score * 10000) / 10000; // إزالة أخطاء الفاصلة العائمة
    if (s >= 5) return LEVELS[0];
    if (s >= 4) return LEVELS[1];
    if (s >= 3) return LEVELS[2];
    if (s >= 2) return LEVELS[3];
    return LEVELS[4];
  }

  /* ---------- أدوات عامة ---------- */
  const r2 = (x) => Math.round(x * 100) / 100;
  const isScore = (v) => v === 1 || v === 2 || v === 3 || v === 4 || v === 5;
  const num = (v) => (v === '' || v == null ? NaN : Number(v));
  function uid(prefix) {
    return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function sumWeights(items) {
    return r2((items || []).reduce((a, i) => a + (Number(i.weight) || 0), 0));
  }
  const weightsAre100 = (items) => Math.abs(sumWeights(items) - 100) < 0.01;

  /* ---------- نتيجة تقييم الأدوار (ملفات Excel) ----------
     النتيجة = Σ(درجة العنصر × وزنه) ÷ Σ الأوزان، ولا تُعرض قبل اكتمال جميع الدرجات */
  function roleResult(items) {
    items = items || [];
    const total = items.length;
    const scored = items.filter((i) => isScore(i.score)).length;
    const sumW = sumWeights(items);
    const base = { total, scored, sumW, weightsOk: Math.abs(sumW - 100) < 0.01 };
    if (!total) return { ...base, complete: false, score: null, reason: 'لا توجد عناصر في هذا الملف' };
    if (scored < total) return { ...base, complete: false, score: null, reason: `بقي ${total - scored} من ${total} عنصر دون درجة` };
    if (items.some((i) => !(Number(i.weight) > 0))) return { ...base, complete: false, score: null, reason: 'يوجد عنصر وزنه صفر أو غير صالح' };
    const weighted = items.reduce((a, i) => a + i.score * Number(i.weight), 0);
    const score = weighted / sumW;
    return { ...base, complete: true, weighted: r2(weighted), score, level: levelOf(score) };
  }

  /* ---------- قاعدة داخلية لدرجة الأهداف والجدارات (قابلة للمراجعة) ----------
     تفترض أن ارتفاع الناتج أفضل.
     الفعلي = المستهدف → 4 | الفعلي ≥ المستهدف + وحدة → 5 | تجاوز بأقل من وحدة → 4
     أقل من المستهدف: ≥75% → 3، ≥50% → 2، أقل → 1. الخانة الفارغة = لم يُقيّم. */
  const EPS = 1e-9;
  function goalScore(target, actual) {
    const t = num(target), a = num(actual);
    if (actual === '' || actual == null) {
      if (target !== '' && target != null && !(t > 0)) return { score: null, state: 'invalid', error: 'المستهدف يجب أن يكون أكبر من صفر' };
      return { score: null, state: 'unscored' };
    }
    if (!(t > 0)) return { score: null, state: 'invalid', error: 'المستهدف يجب أن يكون أكبر من صفر' };
    if (!(a >= 0)) return { score: null, state: 'invalid', error: 'الناتج الفعلي يجب أن يكون صفراً أو أكثر' };
    if (a - t >= 1 - EPS) return { score: 5, state: 'scored', rule: 'تجاوز المستهدف بوحدة واحدة فأكثر' };
    if (a >= t - EPS) return { score: 4, state: 'scored', rule: a > t + EPS ? 'تجاوز المستهدف بأقل من وحدة' : 'الفعلي يساوي المستهدف' };
    const ratio = a / t;
    if (ratio >= 0.75 - EPS) return { score: 3, state: 'scored', rule: 'تحقق 75% فأكثر من المستهدف', ratio };
    if (ratio >= 0.5 - EPS) return { score: 2, state: 'scored', rule: 'تحقق 50% إلى أقل من 75%', ratio };
    return { score: 1, state: 'scored', rule: 'تحقق أقل من 50%', ratio };
  }
  /* متوسط قسم (أهداف أو جدارات) موزوناً بأوزان عناصره */
  function sectionResult(list) {
    list = list || [];
    const rows = list.map((g) => ({ ...g, calc: goalScore(g.target, g.actual) }));
    const total = rows.length;
    const scored = rows.filter((g) => g.calc.score != null).length;
    const invalid = rows.filter((g) => g.calc.state === 'invalid').length;
    const sumW = sumWeights(list);
    const weightsOk = Math.abs(sumW - 100) < 0.01;
    const base = { rows, total, scored, invalid, sumW, weightsOk };
    if (!total) return { ...base, complete: false, avg: null };
    if (scored < total) return { ...base, complete: false, avg: null };
    if (!(sumW > 0)) return { ...base, complete: false, avg: null };
    const avg = rows.reduce((a, g) => a + g.calc.score * (Number(g.weight) || 0), 0) / sumW;
    return { ...base, complete: true, avg };
  }
  function adminResult(file) {
    const g = sectionResult(file.goals), c = sectionResult(file.comps);
    const sg = Number(file.shares?.goals), sc = Number(file.shares?.comp);
    const sharesOk = isFinite(sg) && isFinite(sc) && sg >= 0 && sc >= 0 && Math.abs(sg + sc - 100) < 0.01;
    const blockers = [];
    if (!g.total) blockers.push('أضيفي هدفاً ذكياً واحداً على الأقل');
    if (!c.total) blockers.push('أضيفي جدارة واحدة على الأقل');
    if (g.total && g.scored < g.total) blockers.push(`بقي ${g.total - g.scored} هدف دون ناتج فعلي صالح`);
    if (c.total && c.scored < c.total) blockers.push(`بقيت ${c.total - c.scored} جدارة دون ناتج فعلي صالح`);
    if (g.total && !g.weightsOk) blockers.push(`مجموع أوزان الأهداف ${g.sumW}% ويجب أن يساوي 100%`);
    if (c.total && !c.weightsOk) blockers.push(`مجموع أوزان الجدارات ${c.sumW}% ويجب أن يساوي 100%`);
    if (!sharesOk) blockers.push(`حصتا الأهداف والجدارات مجموعهما ${r2((sg || 0) + (sc || 0))}% ويجب أن يساوي 100%`);
    const complete = blockers.length === 0;
    const score = complete ? (g.avg * sg + c.avg * sc) / 100 : null;
    return { goals: g, comps: c, shares: { goals: sg, comp: sc }, sharesOk, blockers, complete, score, level: complete ? levelOf(score) : null };
  }

  /* توزيع 100% بالتساوي على n عنصر بدقة منزلتين، والباقي يُضاف لأول العناصر */
  function equalWeights(n) {
    if (!n) return [];
    const base = Math.floor(10000 / n);
    let rem = 10000 - base * n;
    return Array.from({ length: n }, () => {
      const v = base + (rem > 0 ? 1 : 0);
      if (rem > 0) rem--;
      return v / 100;
    });
  }

  /* ---------- نتيجة ملف أي موظف ---------- */
  function fileResult(file) {
    if (!file) return { complete: false, score: null };
    if (file.kind === 'admin') return adminResult(file);
    const r = roleResult(file.items);
    return { ...r, blockers: r.complete ? [] : [r.reason] };
  }
  /* حالة الملف: approved | ready (مكتمل بانتظار الاعتماد) | progress | empty */
  function fileStatus(file) {
    if (!file) return 'empty';
    if (file.status === 'approved') return 'approved';
    const r = fileResult(file);
    if (r.complete) return 'ready';
    const touched = file.kind === 'admin'
      ? ((file.goals || []).length + (file.comps || []).length) > 0
      : (file.items || []).some((i) => isScore(i.score));
    return touched ? 'progress' : 'empty';
  }
  const STATUS = {
    approved: { label: 'معتمد',                 pill: 'p-ok'   },
    ready:    { label: 'مكتمل — بانتظار الاعتماد', pill: 'p-info' },
    progress: { label: 'قيد التقييم',           pill: 'p-warn' },
    empty:    { label: 'لم يبدأ',               pill: 'p-mute' },
  };

  /* ---------- النصوص العربية والأدوار ---------- */
  function normAr(s) {
    return String(s == null ? '' : s)
      .replace(/[ً-ْٰـ]/g, '')
      .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
      .replace(/[‌-‏‪-‮]/g, '')
      .replace(/\s+/g, ' ').trim().toLowerCase();
  }
  function parseRole(text) {
    const t = normAr(text);
    if (!t) return null;
    const direct = ROLES.find((r) => r.key === t);
    if (direct) return direct.key;
    if (t.includes('محضر') || t.includes('مختبر')) return 'lab';
    if (t.includes('صحي')) return 'health';
    if ((t.includes('موجه') || t.includes('مرشد')) && (t.includes('طلاب') || t === 'موجه' || t === 'موجهه')) return 'counselor';
    if (t.includes('رائد') || t.includes('نشاط')) return 'activity';
    if (t.includes('وكيل')) return 'deputy';
    if (t.includes('مدير')) return 'principal';
    if (t.includes('اداري')) return 'admin';
    if (t.includes('معلم')) return 'teacher';
    return null;
  }

  /* المسمى الوظيفي (مستقل عن فئة التقييم وعن الصلاحيات) */
  const isOther = (t) => ['اخري', 'اخرى', 'other'].includes(normAr(t).toLowerCase());
  function cleanTitle(t) { const v = String(t ?? '').replace(/\s+/g, ' ').trim().slice(0, 80); return isOther(v) ? '' : v; }
  const ROLE_NAMES = ['معلم', 'معلمه', 'المعلم', 'المعلمه', 'وكيل', 'وكيله', 'الوكيل', 'الوكيله', 'اداري', 'اداريه', 'مدير', 'مديره', 'مدير المدرسه', 'مديره المدرسه', 'موجه طلابي', 'موجهه طلابيه', 'الموجه الطلابي', 'موجه صحي', 'موجهه صحيه', 'الموجه الصحي', 'رائد نشاط', 'رائده نشاط', 'رائد النشاط', 'محضر مختبر', 'محضره مختبر', 'محضر المختبر'];
  const isRoleName = (t) => ROLE_NAMES.includes(normAr(t)) || ROLES.some((r) => normAr(r.label) === normAr(t) || normAr(r.short) === normAr(t));
  function titleOf(e) { return (e && e.jobTitle) || (e && roleOf(e.role) ? roleOf(e.role).label : '—'); }

  /* رقم الهوية الوطنية / الإقامة: 10 أرقام تبدأ بـ 1 أو 2 */
  const toLatinDigits = (s) => String(s == null ? '' : s).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\s+/g, '');
  function normNid(v) { return toLatinDigits(v).replace(/\.0+$/, ''); }
  const isNid = (v) => /^[12][0-9]{9}$/.test(normNid(v));
  const isMinistryNo = (v) => /^[0-9]{3,12}$/.test(toLatinDigits(v));

  /* مفتاح التكرار: الاسم + الدور + العام + المدرسة */
  function dupKey(e) {
    return [normAr(e.name), e.role || '', normAr(e.year), normAr(e.school)].join('|');
  }

  /* ---------- معاينة الاستيراد ----------
     rows: [{name, roleText, specialty, year, school, line}]  → صفوف بحالة لكل منها */
  function buildImportPreview(rows, existing, defaults) {
    defaults = defaults || {};
    const existingKeys = new Set((existing || []).map(dupKey));
    const existingNids = new Set((existing || []).map((e) => normNid(e.nationalId)).filter(Boolean));
    const seen = new Map(), seenNid = new Map();
    return rows.map((row, idx) => {
      const name = String(row.name ?? '').replace(/\s+/g, ' ').trim();
      let jobTitle = cleanTitle(row.jobTitle);
      const roleKey = row.role || parseRole(row.roleText);
      // المسمى يساوي اسم الفئة نفسها ← لا داعي لحفظه كمسمى مخصص
      if (jobTitle && roleKey && isRoleName(jobTitle)) jobTitle = '';
      const out = {
        line: row.line ?? idx + 1,
        name,
        role: roleKey,
        roleText: row.roleText ?? '',
        jobTitle,
        specialty: String(row.specialty ?? '').trim(),
        year: String(row.year ?? '').trim() || String(defaults.year || ''),
        school: String(row.school ?? '').trim() || String(defaults.school || ''),
        nationalId: normNid(row.nationalId),
        status: 'ok', reasons: [],
      };
      if (out.nationalId && !isNid(out.nationalId)) { out.status = 'invalid'; out.reasons.push('رقم الهوية غير صحيح (10 أرقام تبدأ بـ 1 أو 2)'); }
      if (!name) { out.status = 'invalid'; out.reasons.push('الاسم فارغ'); }
      else if (name.length < 3) { out.status = 'invalid'; out.reasons.push('الاسم قصير جداً'); }
      if (isOther(row.jobTitle)) { out.status = 'invalid'; out.reasons.push('اكتبي المسمى الوظيفي الفعلي بدل «أخرى»'); }
      if (!roleKey) { out.status = 'invalid'; out.reasons.push(row.roleText ? `«${row.roleText}» يحتاج فئة تقييم (معلم، وكيل، إداري...)` : 'فئة التقييم غير محددة'); }
      if (out.status === 'ok') {
        const k = dupKey(out);
        if (existingKeys.has(k)) { out.status = 'dup-existing'; out.reasons.push('موجود مسبقاً في المنصة — لن يُستبدل'); }
        else if (out.nationalId && existingNids.has(out.nationalId)) { out.status = 'dup-existing'; out.reasons.push('رقم الهوية مسجّل لموظف آخر — لن يُستبدل'); }
        else if (seen.has(k)) { out.status = 'dup-file'; out.reasons.push(`مكرر مع السطر ${seen.get(k)}`); }
        else if (out.nationalId && seenNid.has(out.nationalId)) { out.status = 'dup-file'; out.reasons.push(`رقم الهوية مكرر مع السطر ${seenNid.get(out.nationalId)}`); }
        else { seen.set(k, out.line); if (out.nationalId) seenNid.set(out.nationalId, out.line); }
      }
      return out;
    });
  }
  /* تحويل نص ملصق إلى صفوف: كل سطر اسم */
  function parsePastedNames(text) {
    return String(text || '').split(/\r?\n/).map((l, i) => ({ name: l.replace(/^[\s\d\-\.\)\(•*،,]+/, '').trim(), line: i + 1, _raw: l }))
      .filter((r) => r._raw.trim() !== '');
  }
  /* تحويل صفوف ورقة Excel (مصفوفة مصفوفات) إلى صفوف استيراد بحسب عناوين الأعمدة */
  const HEADERS = {
    name: ['الاسم', 'اسم الموظف', 'اسم الموظفه', 'اسم المعلمه', 'اسم المعلم', 'الاسم الكامل'],
    role: ['فئه التقييم', 'الدور الوظيفي', 'الدور', 'الوظيفه'],
    jobTitle: ['المسمى الوظيفي', 'المسمى'],
    specialty: ['التخصص', 'التخصص او المسمى'],
    year: ['العام الدراسي', 'العام'],
    school: ['المدرسه', 'اسم المدرسه'],
    nationalId: ['رقم الهويه', 'الهويه', 'السجل المدني', 'رقم السجل المدني', 'رقم الهويه الوطنيه', 'الهويه الوطنيه'],
  };
  function mapSheetRows(aoa) {
    if (!aoa || !aoa.length) return { rows: [], error: 'الملف فارغ' };
    let hi = -1, map = {};
    for (let i = 0; i < Math.min(aoa.length, 10); i++) {
      const cells = (aoa[i] || []).map(normAr);
      const m = {};
      Object.entries(HEADERS).forEach(([k, names]) => {
        const j = cells.findIndex((c) => names.map(normAr).includes(c));
        if (j >= 0) m[k] = j;
      });
      if (m.name != null) { hi = i; map = m; break; }
    }
    if (hi < 0) return { rows: [], error: 'لم يُعثر على عمود «الاسم». استخدمي قالب الاستيراد.' };
    // ملفات قديمة: عمود «المسمى الوظيفي» وحده كان يُقرأ كدور
    const onlyTitle = map.role == null && map.jobTitle != null;
    const missing = ['role'].filter((k) => map[k] == null && !onlyTitle);
    const rows = [];
    for (let i = hi + 1; i < aoa.length; i++) {
      const r = aoa[i] || [];
      const get = (k) => (map[k] == null ? '' : String(r[map[k]] ?? '').trim());
      if (!r.some((c) => String(c ?? '').trim() !== '')) continue;
      rows.push({ line: i + 1, name: get('name'), roleText: onlyTitle ? get('jobTitle') : get('role'), jobTitle: get('jobTitle'), specialty: get('specialty'), year: get('year'), school: get('school'), nationalId: get('nationalId') });
    }
    return { rows, missing, headerRow: hi + 1 };
  }

  /* ---------- روابط الشواهد ---------- */
  function validateUrl(u) {
    const s = String(u || '').trim();
    if (!s) return { ok: false, error: 'أدخلي الرابط' };
    let url;
    try { url = new URL(s); } catch (e) { return { ok: false, error: 'الرابط غير صالح. انسخيه كاملاً ويبدأ بـ https://' }; }
    if (url.protocol !== 'https:') return { ok: false, error: 'يُقبل رابط HTTPS فقط (يبدأ بـ https://)' };
    if (!url.hostname || !url.hostname.includes('.')) return { ok: false, error: 'اسم الموقع في الرابط غير مكتمل' };
    return { ok: true, url: url.href };
  }

  /* ---------- ملفات التقييم ---------- */
  function newRoleFile(role, template) {
    return {
      kind: 'role', role,
      items: (template?.items || []).map((it) => ({ id: uid('it'), name: it.name, weight: Number(it.weight), section: it.section || null, score: null, feedback: '', plan: '', followUp: '' })),
      sourceSum: sumWeights(template?.items || []),
      templateSnapshotAt: new Date().toISOString(),
      status: 'draft', approvedAt: null,
      strengths: '', improvements: '', devPlan: '', recommendation: '', evaluator: '', evalDate: '',
      log: [], archivedItems: [],
    };
  }
  function newAdminFile(shares) {
    return {
      kind: 'admin', role: 'admin',
      goals: [], comps: [], training: [], autoGoals: true, autoComps: true,
      shares: { goals: Number(shares?.goals ?? 50), comp: Number(shares?.comp ?? 50) },
      status: 'draft', approvedAt: null,
      strengths: '', improvements: '', devPlan: '', recommendation: '', evaluator: '', evalDate: '',
      log: [], archivedItems: [],
    };
  }

  const API = {
    titleOf, cleanTitle, isOther, isRoleName,
    ROLES, TRACKS, LEVELS, STATUS, roleOf, levelOf, isScore, r2, uid,
    sumWeights, weightsAre100, roleResult, goalScore, sectionResult, adminResult, equalWeights,
    fileResult, fileStatus, normAr, parseRole, dupKey, buildImportPreview, parsePastedNames, mapSheetRows,
    validateUrl, newRoleFile, newAdminFile, normNid, isNid, isMinistryNo, toLatinDigits,
  };
  root.ItqanLogic = API;
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/store.js */
/* =========================================================
   إتقان — طبقة التخزين
   المرحلة الأولى: حفظ محلي مؤقت في متصفح هذا الجهاز فقط (localStorage).
   الواجهة تتعامل مع Store.load / Store.save فقط، ليُستبدل التنفيذ
   في المرحلة الثانية بـ Supabase دون تغيير الشاشات.
   ========================================================= */
(function (root) {
  'use strict';
  const L = root.ItqanLogic;
  const KEY = 'itqan.v1';
  const SCHEMA = 1;

  let memory = null; // احتياطي عند تعذّر localStorage

  function storageOk() {
    try {
      const k = '__itqan_probe__';
      root.localStorage.setItem(k, '1');
      root.localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  }

  /* القوالب الأولى من ملف Excel: الأوزان كما وردت، مع نسخة أصلية محفوظة لا تتغير */
  function templatesFromExcel() {
    const X = root.ITQAN_EXCEL;
    const out = {};
    Object.entries(X.roles).forEach(([role, t]) => {
      const items = t.items.map((it) => ({ id: L.uid('tp'), name: it.name, weight: it.weight, section: it.section || null }));
      out[role] = {
        role, title: t.title, source: `${X.source} — ورقة «${t.sheet}»`,
        items,
        original: t.items.map((it) => ({ no: it.no, name: it.name, weight: it.weight, section: it.section || null })),
        originalSum: t.sum,
        updatedAt: null,
      };
    });
    return out;
  }

  function freshDb() {
    return {
      meta: { schema: SCHEMA, createdAt: new Date().toISOString(), storage: 'local-browser' },
      settings: { schoolName: '', principalName: '', year: '', stage: '', statNo: '', office: '', evaluator: '', logo: null },
      templates: templatesFromExcel(),
      adminDefaults: { shares: { goals: 50, comp: 50 } },
      employees: [],
      files: {},
      evidence: [],
    };
  }

  function validate(db) {
    return db && typeof db === 'object' && db.meta && db.templates && Array.isArray(db.employees) && db.files && Array.isArray(db.evidence);
  }

  const Store = {
    mode: 'local',
    available: storageOk(),
    KEY,
    freshDb,
    templatesFromExcel,
    validate,
    /* يعيد {db, existed} */
    load() {
      if (!this.available) return { db: memory, existed: !!memory };
      try {
        const raw = root.localStorage.getItem(KEY);
        if (!raw) return { db: null, existed: false };
        const db = JSON.parse(raw);
        if (!validate(db)) return { db: null, existed: false, corrupt: true };
        return { db, existed: true };
      } catch (e) {
        return { db: null, existed: false, corrupt: true };
      }
    },
    save(db) {
      const json = JSON.stringify(db);
      if (!this.available) { memory = JSON.parse(json); return { ok: true, memoryOnly: true, bytes: json.length }; }
      try {
        root.localStorage.setItem(KEY, json);
        return { ok: true, bytes: json.length };
      } catch (e) {
        const quota = e && (e.name === 'QuotaExceededError' || e.code === 22);
        return { ok: false, error: quota ? 'امتلأت مساحة الحفظ المحلي في المتصفح. صغّري الشعار أو صدّري نسخة احتياطية واحذفي بيانات غير لازمة.' : 'تعذّر الكتابة في ذاكرة المتصفح.' };
      }
    },
    clear() {
      memory = null;
      try { root.localStorage.removeItem(KEY); } catch (e) { /* تجاهل */ }
    },
    usedBytes() {
      try { return (root.localStorage.getItem(KEY) || '').length * 2; } catch (e) { return 0; }
    },
  };

  root.ItqanStore = Store;
})(window);

</script>
<script>/* js/demo.js */
/* =========================================================
   إتقان — بيانات تجريبية
   كل سجل هنا يحمل demo: true، ويظهر بوسم «تجريبي»، ويُحذف بزر
   «حذف البيانات التجريبية فقط» دون المساس بالبيانات الحقيقية.
   الأسماء والأرقام مُولّدة ولا تمثل أشخاصاً حقيقيين.
   ========================================================= */
(function (root) {
  'use strict';
  const L = root.ItqanLogic;

  function seedDemo(db) {
    const year = db.settings.year || 'عام تجريبي';
    const school = db.settings.schoolName || 'مدرسة تجريبية';
    let s = 11;
    const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    const now = new Date().toISOString();
    const plan = [
      ['teacher', 'معلمة تجريبية', 6, ['لغتي', 'رياضيات', 'علوم', 'لغة إنجليزية', 'دراسات اجتماعية', 'حاسب آلي']],
      ['deputy', 'وكيلة تجريبية', 1, ['الشؤون التعليمية']],
      ['counselor', 'موجهة طلابية تجريبية', 1, ['توجيه وإرشاد']],
      ['health', 'موجهة صحية تجريبية', 1, ['أحياء']],
      ['activity', 'رائدة نشاط تجريبية', 1, ['تربية فنية']],
      ['principal', 'مديرة تجريبية', 1, ['إدارة مدرسية']],
      ['lab', 'محضرة مختبر تجريبية', 1, ['مختبر العلوم']],
      ['admin', 'إدارية تجريبية', 3, ['مساعدة إدارية', 'سكرتيرة', 'أمينة مصادر']],
    ];
    let k = 0;
    plan.forEach(([role, base, count, specs]) => {
      for (let i = 1; i <= count; i++) {
        k++;
        const id = 'demo_emp_' + k;
        const emp = { id, name: `${base} ${i}`, role, specialty: specs[(i - 1) % specs.length], year, school, demo: true, createdAt: now };
        db.employees.push(emp);
        let file;
        if (role === 'admin') {
          file = L.newAdminFile(db.adminDefaults.shares);
          if (i <= 2) {
            const goals = [
              ['أرشفة المعاملات الواردة إلكترونياً خلال يومي عمل', 'نسبة المعاملات المؤرشفة', '%', 95, i === 1 ? 96 : 95],
              ['تحديث بيانات الطالبات في نظام نور', 'عدد التحديثات الشهرية', 'تحديث', 4, i === 1 ? 5 : 3],
              ['إنجاز خطابات أولياء الأمور في موعدها', 'نسبة الإنجاز في الموعد', '%', 100, i === 1 ? 100 : 80],
              ['تنظيم ملفات الموظفات', 'عدد الملفات المكتملة', 'ملف', 40, i === 1 ? 41 : 18],
            ];
            const w = L.equalWeights(goals.length);
            file.goals = goals.map((g, j) => ({ id: L.uid('g'), title: g[0], measure: g[1], unit: g[2], weight: w[j], target: g[3], actual: g[4], feedback: '', plan: '', followUp: '' }));
            const comps = [
              ['الالتزام بمواعيد العمل', 'أيام الحضور المنتظم', 'يوم', 20, i === 1 ? 21 : 19],
              ['التواصل الفعال', 'عدد الشكاوى المغلقة', 'شكوى', 5, i === 1 ? 5 : 4],
              ['العمل بروح الفريق', 'مشاركات في لجان المدرسة', 'مشاركة', 3, i === 1 ? 4 : 2],
            ];
            const cw = L.equalWeights(comps.length);
            file.comps = comps.map((g, j) => ({ id: L.uid('c'), title: g[0], measure: g[1], unit: g[2], weight: cw[j], target: g[3], actual: g[4], feedback: '', plan: '', followUp: '' }));
            file.training = [{ id: L.uid('t'), need: 'مهارات الأرشفة الإلكترونية', course: 'دورة تجريبية في الأرشفة', provider: 'جهة تجريبية', date: '', status: i === 1 ? 'done' : 'planned', feedback: '', impact: '' }];
            if (i === 1) { file.status = 'approved'; file.approvedAt = now; file.recommendation = 'توصية تجريبية: الاستمرار.'; }
          }
        } else {
          file = L.newRoleFile(role, db.templates[role]);
          const mode = i === 1 ? 'full' : (rnd() < 0.5 ? 'partial' : (rnd() < 0.5 ? 'full' : 'none'));
          if (mode !== 'none') {
            file.items.forEach((it, j) => {
              if (mode === 'partial' && j > file.items.length / 2) return;
              it.score = Math.min(5, Math.max(2, Math.round(2.5 + rnd() * 2.6)));
            });
          }
          if (mode === 'full' && i === 1 && role !== 'principal') { file.status = 'approved'; file.approvedAt = now; file.recommendation = 'توصية تجريبية.'; }
        }
        file.demo = true;
        db.files[id] = file;
        // شواهد تجريبية بروابط example.com
        if (rnd() < 0.7) {
          const target = file.kind === 'admin' ? (file.goals[0] || null) : file.items[0];
          db.evidence.push({ id: 'demo_ev_' + k, employeeId: id, itemId: target ? target.id : null, itemLabel: target ? (target.name || target.title) : 'عام',
            title: 'شاهد تجريبي ' + k, url: 'https://example.com/itqan-demo/' + k, createdAt: now, addedBy: 'principal', archived: false, demo: true });
        }
      }
    });
    db.meta.demoSeededAt = now;
    return db;
  }

  function removeDemo(db) {
    const ids = new Set(db.employees.filter((e) => e.demo).map((e) => e.id));
    const before = { emp: db.employees.length, ev: db.evidence.length };
    db.employees = db.employees.filter((e) => !e.demo);
    Object.keys(db.files).forEach((id) => { if (ids.has(id) || db.files[id]?.demo) delete db.files[id]; });
    db.evidence = db.evidence.filter((e) => !e.demo && !ids.has(e.employeeId));
    db.meta.demoRemovedAt = new Date().toISOString();
    return { employees: before.emp - db.employees.length, evidence: before.ev - db.evidence.length };
  }

  const countDemo = (db) => db.employees.filter((e) => e.demo).length;

  root.ItqanDemo = { seedDemo, removeDemo, countDemo };
})(window);

</script>
<script>/* js/report.js */
/* =========================================================
   إتقان — التقارير الفردية (A4، عربي RTL)
   ثلاثة قوالب: التقرير الرسمي الشامل (الافتراضي)، التقرير المختصر، تقرير متابعة الأداء.
   يبني تقرير موظف واحد فقط من بياناته هو؛ لا يُضمَّن أي موظف آخر.
   التقارير باسم المدرسة فقط: بلا اسم المنصة، وبلا اسم المقيّم، وبلا الشواهد.
   ========================================================= */
(function (root) {
  'use strict';
  const L = root.ItqanLogic;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const f2 = (n) => (n == null || !isFinite(n) ? '—' : (Math.round(n * 100) / 100).toFixed(2));
  const pct = (n) => (n == null || !isFinite(n) ? '—' : `${Math.round(n * 100) / 100}%`);
  const nl = (s) => esc(s).replace(/\n/g, '<br>');
  const dash = (v) => (v == null || String(v).trim() === '' ? '<span class="rp-empty">—</span>' : esc(v));
  const dateAr = (iso) => { if (!iso) return ''; try { const d = new Date(iso); if (isNaN(d)) return String(iso); return d.toLocaleDateString('ar-SA-u-nu-latn-ca-gregory', { year: 'numeric', month: 'long', day: 'numeric' }); } catch (e) { return String(iso); } };

  const TEMPLATES = [
    { key: 'full', label: 'التقرير الرسمي الشامل' },
    { key: 'short', label: 'التقرير المختصر' },
    { key: 'follow', label: 'تقرير متابعة الأداء' },
  ];
  const MODES = [
    { key: 'text', label: 'ديباجة نصية' },
    { key: 'paper', label: 'صورة ورق رسمي' },
    { key: 'both', label: 'ديباجة نصية مع خلفية' },
  ];
  const PLAN_ST = { '': 'لم يبدأ', progress: 'جارٍ التنفيذ', done: 'مكتمل', needs: 'يحتاج متابعة' };
  const PSTAT = { not_started: 'لم يبدأ', in_progress: 'جارٍ التنفيذ', done: 'مكتمل', needs_follow: 'يحتاج متابعة' };

  /* إعدادات الديباجة (تُكمَّل من بيانات المدرسة) */
  function reportSettings(settings) {
    const s = settings || {};
    const r = s.report || {};
    const d = {
      mode: 'text',
      kingdom: 'المملكة العربية السعودية', ministry: 'وزارة التعليم', office: '',
      school: '', principal: '', principalTitle: 'مدير/ة المدرسة',
      show: { kingdom: true, ministry: true, office: true, school: true, ministryLogo: true, schoolLogo: true },
      paperText: false,
      bgFit: 'cover', bgOpacity: 100, bgPrint: true,
      mTop: 12, mBottom: 12, mSide: 12,
      stampMode: 'image', signSpace: true,
    };
    const out = { ...d, ...r, show: { ...d.show, ...(r.show || {}) } };
    if (!out.school) out.school = s.schoolName || '';
    if (!out.principal) out.principal = s.principalName || '';
    if (!out.office) out.office = s.office || '';
    return out;
  }

  const REPORT_CSS = `
.rp-page{--rp-ink:#2B2534;--rp-mute:#6C6378;--rp-line:#DCD3E6;--rp-soft:#F6F2FA;--rp-acc:#5B3B6E;--rp-acc2:#8C6BA8;
  direction:rtl;color:var(--rp-ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:12.2px;line-height:1.65;
  width:794px;height:1123px;position:relative;background:#fff;overflow:hidden;margin:0 auto}
.rp-page *{box-sizing:border-box}
.rp-bg{position:absolute;inset:0;background-repeat:no-repeat;background-position:center;pointer-events:none}

.rp-pfoot{flex:none;display:flex;justify-content:space-between;gap:8px;font-size:10px;color:var(--rp-mute);border-top:1px solid var(--rp-line);padding-top:4px;margin-top:6px}
.rp-lh{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding-bottom:8px;margin-bottom:10px;border-bottom:2px solid var(--rp-acc)}
.rp-lh .t{font-size:12px;font-weight:600;line-height:1.75}
.rp-lh .t div:first-child{font-weight:700}

.rp-block h2{font-family:"Readex Pro","IBM Plex Sans Arabic",sans-serif;font-size:13px;margin:0 0 6px;color:var(--rp-acc);font-weight:600;border-inline-start:3px solid var(--rp-acc2);padding-inline-start:8px}
